name: final-verify

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/final-verify.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-final-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout finalization repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove finalization-only change after candidate build
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 3224ef5f0f4d3162430d4597512a7637f0df3ea9..HEAD > changed.txt
          cat changed.txt
          test "$(wc -l < changed.txt)" -eq 1
          grep -qx '.github/workflows/final-verify.yml' changed.txt

      - name: Download exact selected-owner final-build artifact
        uses: actions/download-artifact@v4
        with:
          name: VS2-Create-Interactive-M1-final
          path: final-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34953958207

      - name: Verify final artifact identity and integrity
        shell: bash
        run: |
          set -euo pipefail
          cd final-artifact
          test -f BUILD_INFO.txt
          test -f SHA256SUMS.txt
          grep -qx 'source_commit=3224ef5f0f4d3162430d4597512a7637f0df3ea9' BUILD_INFO.txt
          grep -qx 'proven_m1_run=34943410005' BUILD_INFO.txt
          grep -qx 'bootstrap_packaging=kotlin-runtime-embedded' BUILD_INFO.txt
          grep -qx '96053e314891495fbb4bf16c446023568fed542497e083083dad7ed420dcd7ef  valkyrienskies-26-2-2.4.205+0bc19eac8f.jar' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -tq valkyrienskies-26-2-2.4.205+0bc19eac8f.jar

      - name: Require frozen-green compiled seams in final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=final-artifact/valkyrienskies-26-2-2.4.205+0bc19eac8f.jar
          jar tf "$JAR" | grep -qx 'org/valkyrienskies/mod/fabric/client/GateEClientProbe.class'
          jar tf "$JAR" | grep -qx 'org/valkyrienskies/mod/fabric/mixin/gatee/MixinContraptionColliderClientTrace.class'
          jar tf "$JAR" | grep -qx 'org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.class'
          unzip -p "$JAR" org/valkyrienskies/mod/fabric/client/GateEClientProbe.class | strings | grep -q 'vs2.createCarryCompat'
          unzip -p "$JAR" org/valkyrienskies/mod/fabric/client/GateEClientProbe.class | strings | grep -q 'GATE_E_PHASE154_FIXTURE_WALK_CONFIRMED'
          unzip -p "$JAR" org/valkyrienskies/mod/fabric/mixin/gatee/MixinContraptionColliderClientTrace.class | strings | grep -q 'GATE_E_CREATE_GROUNDED_Y_CLIP'
          unzip -p "$JAR" org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.class | strings | grep -q 'GATE_E_M1_NATIVE_JUMP_LANDED'

      - name: Require embedded Kotlin runtime chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, zipfile
          from pathlib import Path
          jar = Path('final-artifact/valkyrienskies-26-2-2.4.205+0bc19eac8f.jar')
          with zipfile.ZipFile(jar) as outer:
              meta = json.loads(outer.read('fabric.mod.json'))
              flk = [entry.get('file') for entry in meta.get('jars', []) if isinstance(entry, dict) and 'fabric-language-kotlin' in entry.get('file', '')]
              if len(flk) != 1: raise SystemExit(f'expected exactly one embedded Fabric Language Kotlin jar, found {flk}')
              with zipfile.ZipFile(io.BytesIO(outer.read(flk[0]))) as nested:
                  if json.loads(nested.read('fabric.mod.json')).get('id') != 'fabric-language-kotlin': raise SystemExit('embedded runtime mod id mismatch')
                  names = nested.namelist()
                  required = ['kotlin-stdlib-', 'kotlin-stdlib-jdk7-', 'kotlin-stdlib-jdk8-', 'kotlin-reflect-']
                  missing = [token for token in required if not any(name.startswith('META-INF/jars/') and token in name for name in names)]
                  if missing: raise SystemExit('embedded Kotlin runtime chain missing: ' + ', '.join(missing))
          print('FINAL_VERIFY selected-owner artifact identity, integrity, frozen-green seams, and Kotlin runtime chain passed.')
          PY

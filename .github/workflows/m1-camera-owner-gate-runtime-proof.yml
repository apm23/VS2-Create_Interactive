name: m1-camera-owner-gate-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-camera-owner-gate-runtime-proof.yml'
      - 'scripts/prepare_vs2_26_2_camera_owner_gate_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-owner-gate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production plus read-only camera gate trace
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_camera_owner_gate_trace.py
          grep -q 'REFERENCE_OWNER_V2_CAMERA_GATE' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinCameraExternalOwnerGateTrace.java

      - name: Compile traced composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-camera-gate
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-camera-gate

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :fabric:downloadAssets

      - name: Measure camera owner gate after external-owner acquisition
        working-directory: upstream
        timeout-minutes: 8
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../camera-owner-gate-runtime.log
          PROOF=../camera-owner-gate-proof.txt
          XVFB_LOG=../camera-owner-gate-xvfb.log
          rm -f "$LOG" "$PROOF" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-camera-gate' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() { kill "$CLIENT_PID" 2>/dev/null || true; kill "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null
          }

          READY=0
          for i in $(seq 1 300); do
            if python3 - "$LOG" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          acq=[m.start() for m in re.finditer(r'REFERENCE_OWNER_V2_ACQUIRE',text)]
          if not acq: raise SystemExit(1)
          tail=text[acq[0]:]
          gates=len(re.findall(r'REFERENCE_OWNER_V2_CAMERA_GATE ',tail))
          native=len(re.findall(r'GATE_E_PHASE170_NATIVE_CONTACT_APPLICATION',tail))
          raise SystemExit(0 if gates >= 5 and native >= 1 else 1)
          PY
            then READY=1; break; fi
            if fatal_state; then tail -300 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -300 "$LOG"; exit 1; fi
            sleep 1
          done
          if fatal_state; then tail -300 "$LOG"; exit 1; fi

          python3 - "$LOG" "$READY" <<'PY' | tee "$PROOF"
          import re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          ready=int(sys.argv[2])
          acq=list(re.finditer(r'REFERENCE_OWNER_V2_ACQUIRE',text))
          native=len(re.findall(r'GATE_E_PHASE170_NATIVE_CONTACT_APPLICATION',text))
          start=acq[0].start() if acq else 0
          tail=text[start:]
          rx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_GATE call=(\d+) player_tick=(-?\d+) player_present=(true|false) level_present=(true|false) camera_is_player=(true|false) provider_present=(true|false) external_active=(true|false) owner_id=(null|-?\d+)')
          rows=[]
          for m in rx.finditer(tail):
              rows.append({
                  'call':int(m.group(1)), 'tick':int(m.group(2)),
                  'player':m.group(3)=='true', 'level':m.group(4)=='true',
                  'camera':m.group(5)=='true', 'provider':m.group(6)=='true',
                  'external':m.group(7)=='true', 'owner':None if m.group(8)=='null' else int(m.group(8)),
              })
          transforms=re.findall(r'REFERENCE_OWNER_V2_CAMERA_TRANSFORM_GATE .*?previous_local=(true|false) current_world=(true|false)',tail)
          frames=len(re.findall(r'REFERENCE_OWNER_V2_CAMERA_GATE_FRAME ',tail))
          if not acq:
              classification='NO_EXTERNAL_OWNER_ACQUISITION'
          elif not rows:
              classification='CAMERA_HOOK_NO_GATE_SAMPLE_AFTER_ACQUIRE'
          elif not any(r['camera'] for r in rows):
              classification='CAMERA_ENTITY_NOT_LOCALPLAYER_AFTER_ACQUIRE'
          elif not any(r['provider'] for r in rows):
              classification='CAMERA_LOCALPLAYER_MISSING_DRAG_PROVIDER'
          elif not any(r['external'] for r in rows):
              classification='CAMERA_SEES_PROVIDER_BUT_EXTERNAL_OWNER_INACTIVE_AFTER_ACQUIRE'
          elif not any(r['owner'] is not None for r in rows if r['external']):
              classification='CAMERA_EXTERNAL_ACTIVE_BUT_OWNER_ID_NULL'
          elif transforms and not any(a=='true' and b=='true' for a,b in transforms):
              classification='CAMERA_OWNER_PRESENT_BUT_TRANSFORM_UNRESOLVED'
          else:
              classification='CAMERA_EXTERNAL_OWNER_GATE_REACHED'
          print('M1_CAMERA_OWNER_GATE_RUNTIME_PROOF'
                f' classification={classification} ready={ready} acquisitions={len(acq)} native_contacts={native}'
                f' gate_rows_after_first_acquire={len(rows)} camera_player_rows={sum(r["camera"] for r in rows)}'
                f' provider_rows={sum(r["provider"] for r in rows)} external_active_rows={sum(r["external"] for r in rows)}'
                f' owner_nonnull_rows={sum(r["owner"] is not None for r in rows)} transform_rows={len(transforms)} frame_rows={frames}'
                ' camera_mutated=false look_mutated=false player_mutated=false production_unchanged=true telemetry_only=true final_ready=false')
          for r in rows[:12]:
              print('M1_CAMERA_OWNER_GATE_SAMPLE'
                    f' call={r["call"]} tick={r["tick"]} camera_is_player={str(r["camera"]).lower()}'
                    f' provider={str(r["provider"]).lower()} external={str(r["external"]).lower()} owner={r["owner"]}')
          if classification in ('NO_EXTERNAL_OWNER_ACQUISITION','CAMERA_HOOK_NO_GATE_SAMPLE_AFTER_ACQUIRE'):
              raise SystemExit(2)
          PY

      - name: Upload camera owner gate proof
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: camera-owner-gate-runtime-proof
          path: |
            camera-owner-gate-runtime.log
            camera-owner-gate-proof.txt
            camera-owner-gate-xvfb.log
          if-no-files-found: warn

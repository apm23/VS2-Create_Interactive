name: m1-camera-owner-lifecycle-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-camera-owner-lifecycle-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-owner-lifecycle-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Apply read-only owner-release reason trace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt')
          s=p.read_text(encoding='utf-8')
          old='''                if (!ownerStillResolvable || groundedContactExpired || ownerExpired) {\n                    entityDraggingInformation.clearExternalReferenceOwner()\n                }\n'''
          new='''                if (!ownerStillResolvable || groundedContactExpired || ownerExpired) {\n                    println("REFERENCE_OWNER_V2_LIFECYCLE_CLEAR entity_tick=${entity.tickCount} owner_id=$ownerId owner_age=${entityDraggingInformation.ticksSinceExternalReferenceOwner} owner_resolvable=$ownerStillResolvable grounded_expired=$groundedContactExpired owner_expired=$ownerExpired on_ground=${entity.onGround()} jump_active=${entityDraggingInformation.externalReferenceOwnerJumpActive} lifetime_limit=${entityDraggingInformation.externalReferenceOwnerLifetimeLimit()} read_only=true")\n                    entityDraggingInformation.clearExternalReferenceOwner()\n                }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one final owner-clear predicate, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('OWNER_LIFECYCLE_TRACE installed=true reason_only=true control_flow_unchanged=true')
          PY
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_camera_turn_trace.py
          grep -q 'REFERENCE_OWNER_V2_LIFECYCLE_CLEAR' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt
          grep -q 'REFERENCE_OWNER_V2_CAMERA_OWNER_TIMELINE' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinCameraExternalOwnerTurnTrace.java

      - name: Compile traced composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-camera-owner-lifecycle
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-camera-owner-lifecycle

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Correlate owner release with later carriage turn
        working-directory: upstream
        timeout-minutes: 8
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../camera-owner-lifecycle-runtime.log
          XVFB_LOG=../camera-owner-lifecycle-xvfb.log
          PROOF=../camera-owner-lifecycle-proof.txt
          rm -f "$LOG" "$XVFB_LOG" "$PROOF"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-camera-owner-lifecycle' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            kill "$CLIENT_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          READY=0
          for i in $(seq 1 300); do
            if python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          clears=re.findall(r'REFERENCE_OWNER_V2_LIFECYCLE_CLEAR entity_tick=(\d+) owner_id=(-?\d+)',text)
          if not clears: raise SystemExit(1)
          ct,oid=map(int,clears[0])
          rx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_OWNER_TIMELINE player_tick=(\d+) active_external=(?:true|false) current_owner_id=.*? tracked_owner_id=(-?\d+) owner_age=\d+ on_ground=(?:true|false) transform_resolved=(true|false) owner_heading=([-+0-9.eE]+)')
          hs=[]
          for t,o,res,h in rx.findall(text):
              if int(t)>=ct and int(o)==oid and res=='true': hs.append(float(h))
          if len(hs)<2: raise SystemExit(1)
          un=[hs[0]]; prev=hs[0]
          for h in hs[1:]:
              d=(h-prev+math.pi)%(2*math.pi)-math.pi
              un.append(un[-1]+d); prev=h
          raise SystemExit(0 if max(un)-min(un)>=0.01 else 1)
          PY
            then READY=1; break; fi
            if fatal_state; then tail -360 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -360 "$LOG"; exit 1; fi
            sleep 1
          done
          if fatal_state; then tail -360 "$LOG"; exit 1; fi

          python3 - "$LOG" "$READY" <<'PY' | tee "$PROOF"
          import math,re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          ready=int(sys.argv[2])
          crx=re.compile(r'REFERENCE_OWNER_V2_LIFECYCLE_CLEAR entity_tick=(\d+) owner_id=(-?\d+) owner_age=(\d+) owner_resolvable=(true|false) grounded_expired=(true|false) owner_expired=(true|false) on_ground=(true|false) jump_active=(true|false) lifetime_limit=(\d+)')
          clears=[m.groups() for m in crx.finditer(text)]
          if not clears:
              print('M1_CAMERA_OWNER_LIFECYCLE_RUNTIME_DIAGNOSTIC classification=NO_EXTERNAL_OWNER_CLEAR_OBSERVED ready=%d behavior_green=false production_unchanged=true harness_semantics_unchanged=true telemetry_only=true final_ready=false' % ready)
              raise SystemExit(2)
          c=clears[0]
          ct,oid,age=int(c[0]),int(c[1]),int(c[2])
          resolvable,grounded_expired,owner_expired,on_ground,jump_active=c[3:8]
          limit=int(c[8])
          trx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_OWNER_TIMELINE player_tick=(\d+) active_external=(true|false) current_owner_id=.*? tracked_owner_id=(-?\d+) owner_age=\d+ on_ground=(true|false) transform_resolved=(true|false) owner_heading=([-+0-9.eE]+)')
          rows=[]
          for t,active,o,ground,res,h in trx.findall(text):
              t=int(t); o=int(o)
              if t>=ct and o==oid and res=='true': rows.append((t,float(h),active,ground))
          span=0.0; first_turn_tick=-1
          if rows:
              un=[rows[0][1]]; prev=rows[0][1]
              base=un[0]
              for t,h,active,ground in rows[1:]:
                  d=(h-prev+math.pi)%(2*math.pi)-math.pi
                  un.append(un[-1]+d); prev=h
                  if first_turn_tick<0 and abs(un[-1]-base)>=0.01: first_turn_tick=t
              span=max(un)-min(un)
          if resolvable=='false':
              classification='OWNER_CLEAR_DUE_UNRESOLVED'
          elif span>=0.01 and grounded_expired=='true':
              classification='OWNER_RELEASED_BY_GROUNDED_EXPIRY_BEFORE_TRACKED_CARRIAGE_TURN'
          elif span>=0.01 and owner_expired=='true':
              classification='OWNER_RELEASED_BY_AGE_CAP_BEFORE_TRACKED_CARRIAGE_TURN'
          elif span>=0.01:
              classification='OWNER_RELEASED_BEFORE_TRACKED_CARRIAGE_TURN_OTHER_REASON'
          else:
              classification='OWNER_CLEAR_OBSERVED_TURN_NOT_CORRELATED'
          print('M1_CAMERA_OWNER_LIFECYCLE_RUNTIME_PROOF'
                f' classification={classification} clear_tick={ct} owner={oid} owner_age={age}'
                f' owner_resolvable={resolvable} grounded_expired={grounded_expired} owner_expired={owner_expired}'
                f' on_ground={on_ground} jump_active={jump_active} lifetime_limit={limit}'
                f' post_clear_resolved_rows={len(rows)} post_clear_heading_span_rad={span:.9f}'
                f' post_clear_heading_span_deg={math.degrees(span):.6f} first_turn_tick={first_turn_tick}'
                f' ready={ready} behavior_green=false production_unchanged=true harness_semantics_unchanged=true telemetry_only=true final_ready=false')
          if span>=0.01 and resolvable=='true': raise SystemExit(0)
          raise SystemExit(2)
          PY

      - name: Upload owner lifecycle proof
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: camera-owner-lifecycle-runtime-proof
          path: |
            camera-owner-lifecycle-runtime.log
            camera-owner-lifecycle-xvfb.log
            camera-owner-lifecycle-proof.txt
          if-no-files-found: warn

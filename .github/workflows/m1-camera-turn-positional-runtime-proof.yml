name: m1-camera-turn-positional-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-camera-turn-positional-runtime-proof.yml'
      - 'scripts/prepare_vs2_26_2_camera_turn_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-turn-positional-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Apply unchanged movement harness and read-only camera trace
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_camera_turn_trace.py
          grep -q 'REFERENCE_OWNER_V2_CAMERA_TURN_FRAME' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinCameraExternalOwnerTurnTrace.java
          grep -q 'MixinCameraExternalOwnerTurnTrace' upstream/fabric/src/main/resources/vs2-create-compat.mixins.json

      - name: Compile traced composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-camera-turn
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-camera-turn

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Measure external-owner camera positional frame through carriage turn
        working-directory: upstream
        timeout-minutes: 12
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../camera-turn-positional-runtime.log
          XVFB_LOG=../camera-turn-positional-runtime-xvfb.log
          PROOF=../camera-turn-positional-proof.txt
          rm -f "$LOG" "$XVFB_LOG" "$PROOF"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-camera-turn' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            kill "$CLIENT_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }
          summary() {
            python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          rx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_TURN_FRAME sample=(\d+) call=(\d+) player_tick=(\d+) owner_id=(-?\d+) partial=([-+0-9.eE]+).*?horizontal_error=([-+0-9.eE]+) owner_heading=([-+0-9.eE]+)')
          rows=[(int(a),int(c),int(t),int(o),float(e),float(h)) for a,c,t,o,e,h in rx.findall(text)]
          span=0.0
          if rows:
              hs=[r[5] for r in rows]
              un=[hs[0]]; prev=hs[0]
              for h in hs[1:]:
                  d=(h-prev+math.pi)%(2*math.pi)-math.pi
                  un.append(un[-1]+d); prev=h
              span=max(un)-min(un)
          acq=len(re.findall(r'REFERENCE_OWNER_V2_ACQUIRE',text))
          native=len(re.findall(r'GATE_E_PHASE170_NATIVE_CONTACT_APPLICATION',text))
          jump=len(re.findall(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE',text))
          print(f'CAMERA_TURN_PROGRESS rows={len(rows)} unique_ticks={len({r[2] for r in rows})} owners={sorted({r[3] for r in rows})} heading_span={span:.9f} acquisitions={acq} native_contacts={native} jump_airborne={jump}')
          PY
          }

          READY=0
          for i in $(seq 1 420); do
            if python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          rows=[]
          rx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_TURN_FRAME sample=(\d+) call=(\d+) player_tick=(\d+) owner_id=(-?\d+) partial=([-+0-9.eE]+).*?horizontal_error=([-+0-9.eE]+) owner_heading=([-+0-9.eE]+)')
          for m in rx.finditer(text): rows.append((int(m.group(1)),int(m.group(3)),float(m.group(6)),float(m.group(7))))
          if len(rows) < 120 or len({r[1] for r in rows}) < 12: raise SystemExit(1)
          hs=[r[3] for r in rows]
          un=[hs[0]]; prev=hs[0]
          for h in hs[1:]:
              d=(h-prev+math.pi)%(2*math.pi)-math.pi
              un.append(un[-1]+d); prev=h
          raise SystemExit(0 if max(un)-min(un) >= 0.01 else 1)
          PY
            then
              READY=1
              break
            fi
            if (( i % 30 == 0 )); then summary; fi
            if fatal_state; then tail -360 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -360 "$LOG"; exit 1; fi
            sleep 1
          done
          summary
          if fatal_state; then tail -360 "$LOG"; exit 1; fi

          python3 - "$LOG" "$READY" <<'PY' | tee "$PROOF"
          import math,re,statistics,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          ready=int(sys.argv[2])
          rx=re.compile(
              r'REFERENCE_OWNER_V2_CAMERA_TURN_FRAME sample=(\d+) call=(\d+) player_tick=(\d+) owner_id=(-?\d+) partial=([-+0-9.eE]+) '
              r'camera_x=([-+0-9.eE]+) camera_y=([-+0-9.eE]+) camera_z=([-+0-9.eE]+) '
              r'expected_x=([-+0-9.eE]+) expected_y=([-+0-9.eE]+) expected_z=([-+0-9.eE]+) '
              r'horizontal_error=([-+0-9.eE]+) owner_heading=([-+0-9.eE]+)')
          rows=[]
          for m in rx.finditer(text):
              rows.append({
                  'sample':int(m.group(1)), 'call':int(m.group(2)), 'tick':int(m.group(3)), 'owner':int(m.group(4)),
                  'partial':float(m.group(5)), 'cx':float(m.group(6)), 'cy':float(m.group(7)), 'cz':float(m.group(8)),
                  'ex':float(m.group(9)), 'ey':float(m.group(10)), 'ez':float(m.group(11)),
                  'err':float(m.group(12)), 'heading':float(m.group(13)),
              })
          acquisitions=len(re.findall(r'REFERENCE_OWNER_V2_ACQUIRE',text))
          native=len(re.findall(r'GATE_E_PHASE170_NATIVE_CONTACT_APPLICATION',text))
          jump=len(re.findall(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE',text))
          owners={r['owner'] for r in rows}
          unique_ticks=len({r['tick'] for r in rows})
          span=0.0; steps=[]
          if rows:
              hs=[r['heading'] for r in rows]
              un=[hs[0]]; steps=[0.0]; prev=hs[0]
              for h in hs[1:]:
                  d=(h-prev+math.pi)%(2*math.pi)-math.pi
                  un.append(un[-1]+d); steps.append(abs(d)); prev=h
              span=max(un)-min(un)
          if not rows:
              classification='NO_CAMERA_OWNER_ROWS' if acquisitions else 'NO_EXTERNAL_OWNER_ACQUISITION'
          elif span < 0.01:
              classification='CAMERA_OWNER_SAMPLED_BUT_TURN_NOT_EXERCISED'
          elif len(owners) != 1:
              classification='CAMERA_OWNER_CHANGED_DURING_TURN'
          else:
              turning=[r['err'] for r,s in zip(rows,steps) if s >= 1.0e-4]
              all_err=[r['err'] for r in rows]
              max_err=max(all_err)
              p95=statistics.quantiles(all_err,n=20,method='inclusive')[18] if len(all_err)>1 else max_err
              med=statistics.median(all_err)
              turn_max=max(turning) if turning else float('nan')
              turn_med=statistics.median(turning) if turning else float('nan')
              if max_err > 0.25 and turn_max > 0.25:
                  classification='CAMERA_POSITIONAL_OWNER_MISMATCH_MEASURED'
              elif p95 <= 0.05:
                  classification='CAMERA_POSITIONAL_OWNER_ALIGNED_WITHIN_0_05'
              else:
                  classification='CAMERA_POSITIONAL_OWNER_DELTA_INTERMEDIATE'
              print('M1_CAMERA_TURN_POSITIONAL_RUNTIME_PROOF'
                    f' classification={classification} owner={next(iter(owners))}'
                    f' samples={len(rows)} unique_ticks={unique_ticks}'
                    f' heading_span_rad={span:.9f} heading_span_deg={math.degrees(span):.6f}'
                    f' max_horizontal_error={max_err:.9f} p95_horizontal_error={p95:.9f}'
                    f' median_horizontal_error={med:.9f} turning_rows={len(turning)}'
                    f' turning_max_error={turn_max:.9f} turning_median_error={turn_med:.9f}'
                    f' acquisitions={acquisitions} native_contacts={native} jump_airborne={jump}'
                    ' expected_path=exact_external_owner_render_algorithm'
                    ' camera_sample_point=after_vanilla_alignWithEntity'
                    ' camera_mutated=false look_mutated=false production_unchanged=true'
                    ' harness_semantics_unchanged=true telemetry_only=true final_ready=false')
              for r in sorted(rows,key=lambda x:x['err'],reverse=True)[:8]:
                  print('M1_CAMERA_TURN_WORST_SAMPLE'
                        f' sample={r["sample"]} call={r["call"]} tick={r["tick"]} partial={r["partial"]:.6f}'
                        f' heading={r["heading"]:.9f} error={r["err"]:.9f}'
                        f' camera={r["cx"]:.6f},{r["cy"]:.6f},{r["cz"]:.6f}'
                        f' expected={r["ex"]:.6f},{r["ey"]:.6f},{r["ez"]:.6f}')
              raise SystemExit(0)
          print('M1_CAMERA_TURN_POSITIONAL_RUNTIME_DIAGNOSTIC'
                f' classification={classification} samples={len(rows)} unique_ticks={unique_ticks}'
                f' owners={sorted(owners)} heading_span_rad={span:.9f} heading_span_deg={math.degrees(span):.6f}'
                f' acquisitions={acquisitions} native_contacts={native} jump_airborne={jump}'
                f' ready={ready} production_unchanged=true harness_semantics_unchanged=true telemetry_only=true final_ready=false')
          raise SystemExit(2)
          PY

      - name: Upload camera turn proof
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: camera-turn-positional-runtime-proof
          path: |
            camera-turn-positional-runtime.log
            camera-turn-positional-runtime-xvfb.log
            camera-turn-positional-proof.txt
          if-no-files-found: warn

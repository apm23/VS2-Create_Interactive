name: m1-camera-visual-close

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-camera-visual-close.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_PROOF_HEAD: 8ed60f1de4c75810073dbb7ed10bee2a89c325e9
  SOURCE_PROOF_RUN: '35135734132'
  SOURCE_PROOF_ARTIFACT: '10461944899'

jobs:
  camera-visual-close:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact source proof head
        uses: actions/checkout@v5
        with:
          ref: 8ed60f1de4c75810073dbb7ed10bee2a89c325e9
          fetch-depth: 1

      - name: Verify exact source proof head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_PROOF_HEAD"
          echo "SOURCE_PROOF_HEAD_VERIFIED=$SOURCE_PROOF_HEAD"

      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact proven camera source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_camera_fix.py
          grep -q 'REFERENCE_OWNER_V2_CAMERA_POSITIONAL_FRAME' upstream/common/src/main/java/org/valkyrienskies/mod/mixin/client/MixinCamera.java

      - name: Apply unchanged harness proof and CI-only framebuffer recorder
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_camera_external_reference_proof.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('upstream')
          java=root/'fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinVisualFramebufferCapture.java'
          mixin=root/'fabric/src/main/resources/vs2-create-compat.mixins.json'
          java.parent.mkdir(parents=True,exist_ok=True)
          java.write_text(r'''package org.valkyrienskies.mod.fabric.mixin.gatee;

          import java.nio.ByteBuffer;
          import java.nio.channels.FileChannel;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;
          import net.minecraft.client.DeltaTracker;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.renderer.GameRenderer;
          import org.apache.logging.log4j.LogManager;
          import org.apache.logging.log4j.Logger;
          import org.lwjgl.BufferUtils;
          import org.lwjgl.opengl.GL11;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Unique;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import org.valkyrienskies.mod.common.util.IEntityDraggingInformationProvider;

          /** CI-only observational recorder for headless/offscreen client rendering. */
          @Mixin(GameRenderer.class)
          public abstract class MixinVisualFramebufferCapture {
              @Unique private static final Logger VS2_CAPTURE_LOGGER = LogManager.getLogger("VS2-VisualFramebufferCapture");
              @Unique private static final long VS2_FRAME_NS = 100_000_000L; // 10 fps
              @Unique private static final long VS2_DURATION_NS = 15_000_000_000L;
              @Unique private static boolean vs2$started;
              @Unique private static boolean vs2$finished;
              @Unique private static long vs2$startNs;
              @Unique private static long vs2$lastFrameNs;
              @Unique private static int vs2$width;
              @Unique private static int vs2$height;
              @Unique private static int vs2$frames;
              @Unique private static Path vs2$rawPath;
              @Unique private static FileChannel vs2$channel;
              @Unique private static ByteBuffer vs2$buffer;

              @Inject(method = "render", at = @At("TAIL"), require = 1)
              private void vs2$captureVisualFrame(final DeltaTracker deltaTracker, final boolean renderLevel, final CallbackInfo ci) {
                  if (!Boolean.getBoolean("vs2.visualFramebufferCapture") || vs2$finished) return;
                  final Minecraft mc = Minecraft.getInstance();
                  if (mc.player == null || mc.level == null) return;
                  if (!vs2$started) {
                      if (!(mc.player instanceof IEntityDraggingInformationProvider provider)) return;
                      if (!provider.getDraggingInformation().isEntityBeingDraggedByExternalReference()) return;
                      try {
                          vs2$width = mc.getWindow().getWidth();
                          vs2$height = mc.getWindow().getHeight();
                          if (vs2$width <= 0 || vs2$height <= 0) return;
                          final String configured = System.getProperty("vs2.visualFramebufferPath");
                          if (configured == null || configured.isBlank()) return;
                          vs2$rawPath = Path.of(configured).toAbsolutePath();
                          if (vs2$rawPath.getParent() != null) Files.createDirectories(vs2$rawPath.getParent());
                          vs2$channel = FileChannel.open(vs2$rawPath,
                              StandardOpenOption.CREATE, StandardOpenOption.TRUNCATE_EXISTING, StandardOpenOption.WRITE);
                          vs2$buffer = BufferUtils.createByteBuffer(vs2$width * vs2$height * 3);
                          vs2$startNs = System.nanoTime();
                          vs2$lastFrameNs = 0L;
                          vs2$started = true;
                          VS2_CAPTURE_LOGGER.info(
                              "VS2_VISUAL_FRAME_CAPTURE_STARTED width={} height={} fps=10 duration_seconds=15 path={} read_buffer={} direct_framebuffer=true observational_only=true",
                              vs2$width, vs2$height, vs2$rawPath, GL11.glGetInteger(GL11.GL_READ_BUFFER));
                      } catch (Throwable t) {
                          VS2_CAPTURE_LOGGER.error("VS2_VISUAL_FRAME_CAPTURE_START_FAILED", t);
                          vs2$finished = true;
                          return;
                      }
                  }

                  final long now = System.nanoTime();
                  if (now - vs2$startNs >= VS2_DURATION_NS) {
                      vs2$finishCapture();
                      return;
                  }
                  if (vs2$lastFrameNs != 0L && now - vs2$lastFrameNs < VS2_FRAME_NS) return;
                  vs2$lastFrameNs = now;
                  try {
                      vs2$buffer.clear();
                      GL11.glPixelStorei(GL11.GL_PACK_ALIGNMENT, 1);
                      GL11.glReadPixels(0, 0, vs2$width, vs2$height, GL11.GL_RGB, GL11.GL_UNSIGNED_BYTE, vs2$buffer);
                      final int glError = GL11.glGetError();
                      if (glError != GL11.GL_NO_ERROR) {
                          VS2_CAPTURE_LOGGER.warn("VS2_VISUAL_FRAME_CAPTURE_GL_ERROR frame={} error={}", vs2$frames, glError);
                      }
                      vs2$buffer.position(0);
                      vs2$buffer.limit(vs2$width * vs2$height * 3);
                      while (vs2$buffer.hasRemaining()) vs2$channel.write(vs2$buffer);
                      vs2$frames++;
                  } catch (Throwable t) {
                      VS2_CAPTURE_LOGGER.error("VS2_VISUAL_FRAME_CAPTURE_FRAME_FAILED frame={}", vs2$frames, t);
                      vs2$finishCapture();
                  }
              }

              @Unique
              private static void vs2$finishCapture() {
                  if (vs2$finished) return;
                  vs2$finished = true;
                  try {
                      if (vs2$channel != null) vs2$channel.close();
                      if (vs2$rawPath != null) {
                          Files.writeString(Path.of(vs2$rawPath.toString() + ".meta"),
                              "width=" + vs2$width + "\n" +
                              "height=" + vs2$height + "\n" +
                              "fps=10\n" +
                              "frames=" + vs2$frames + "\n" +
                              "duration_seconds=15\n");
                      }
                      VS2_CAPTURE_LOGGER.info(
                          "VS2_VISUAL_FRAME_CAPTURE_FINISHED width={} height={} fps=10 frames={} path={} observational_only=true",
                          vs2$width, vs2$height, vs2$frames, vs2$rawPath);
                  } catch (Throwable t) {
                      VS2_CAPTURE_LOGGER.error("VS2_VISUAL_FRAME_CAPTURE_FINISH_FAILED", t);
                  }
              }
          }
          ''',encoding='utf-8')
          data=json.loads(mixin.read_text(encoding='utf-8'))
          client=data.setdefault('client',[])
          if 'MixinVisualFramebufferCapture' not in client: client.append('MixinVisualFramebufferCapture')
          mixin.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          grep -q 'MixinVisualFramebufferCapture' upstream/fabric/src/main/resources/vs2-create-compat.mixins.json

      - name: Compile exact proven composition plus recorder
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct pristine verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf camera-visual-pristine
          mkdir camera-visual-pristine
          unzip -q train-world-state-r0v3.zip -d camera-visual-pristine
          test -d 'camera-visual-pristine/train build 1'

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Ensure encoder dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -1

      - name: Record exact-head turn from Minecraft framebuffer
        working-directory: upstream
        timeout-minutes: 8
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../camera-visual-close-runtime.log
          XVFB_LOG=../camera-visual-close-xvfb.log
          RAW=../camera-turn-visual-close.rgb
          RAW_META=${RAW}.meta
          MP4=../camera-turn-visual-close.mp4
          META=../camera-turn-visual-close-metadata.txt
          LUMA=../camera-turn-visual-close-luma.txt
          FRAMEHASH=../camera-turn-visual-close-framemd5.txt
          rm -f "$LOG" "$XVFB_LOG" "$RAW" "$RAW_META" "$MP4" "$META" "$LUMA" "$FRAMEHASH"
          rm -rf fabric/run/crash-reports fabric/run/saves/train-v2-camera-visual-close
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          mkdir -p fabric/run/saves
          cp -a '../camera-visual-pristine/train build 1' fabric/run/saves/train-v2-camera-visual-close

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          export JAVA_TOOL_OPTIONS="-Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true -Dvs2.visualFramebufferCapture=true -Dvs2.visualFramebufferPath=$(pwd)/$RAW"
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-camera-visual-close' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() { kill "$CLIENT_PID" 2>/dev/null || true; kill "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed|VS2_VISUAL_FRAME_CAPTURE_(START|FRAME|FINISH)_FAILED' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          STARTED=0
          START_LINE=0
          for i in $(seq 1 180); do
            if grep -q 'VS2_VISUAL_FRAME_CAPTURE_STARTED' "$LOG"; then STARTED=1; START_LINE=$(grep -n 'VS2_VISUAL_FRAME_CAPTURE_STARTED' "$LOG" | tail -1 | cut -d: -f1); break; fi
            if fatal_state; then tail -240 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -240 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$STARTED" -eq 1

          FINISHED=0
          for i in $(seq 1 90); do
            if grep -q 'VS2_VISUAL_FRAME_CAPTURE_FINISHED' "$LOG"; then FINISHED=1; break; fi
            if fatal_state; then tail -240 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -240 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$FINISHED" -eq 1
          test -s "$RAW"
          test -s "$RAW_META"

          WIDTH=$(awk -F= '$1=="width"{print $2}' "$RAW_META")
          HEIGHT=$(awk -F= '$1=="height"{print $2}' "$RAW_META")
          FPS=$(awk -F= '$1=="fps"{print $2}' "$RAW_META")
          FRAMES=$(awk -F= '$1=="frames"{print $2}' "$RAW_META")
          test "$WIDTH" -gt 0
          test "$HEIGHT" -gt 0
          test "$FRAMES" -ge 20
          EXPECTED_BYTES=$((WIDTH*HEIGHT*3*FRAMES))
          ACTUAL_BYTES=$(stat -c%s "$RAW")
          test "$ACTUAL_BYTES" -eq "$EXPECTED_BYTES"

          ffmpeg -y -f rawvideo -pixel_format rgb24 -video_size "${WIDTH}x${HEIGHT}" -framerate "$FPS" -i "$RAW" \
            -vf vflip -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p "$MP4"
          test -s "$MP4"

          ffmpeg -hide_banner -loglevel error -i "$MP4" -vf "signalstats,metadata=print:file=$LUMA" -an -f null - >/dev/null 2>&1
          MAX_Y=$(grep -o 'lavfi.signalstats.YAVG=[0-9.]*' "$LUMA" | cut -d= -f2 | sort -n | tail -1 || true)
          BRIGHT_FRAMES=$(awk -F= '/lavfi.signalstats.YAVG=/{if ($2+0 > 20) n++} END{print n+0}' "$LUMA")
          ffmpeg -hide_banner -loglevel error -i "$MP4" -map 0:v:0 -f framemd5 "$FRAMEHASH"
          UNIQUE_FRAMES=$(grep -v '^#' "$FRAMEHASH" | awk -F',' '{gsub(/ /,"",$6); print $6}' | sort -u | wc -l)
          test -n "$MAX_Y"
          awk -v y="$MAX_Y" 'BEGIN{exit !(y>20)}'
          test "$BRIGHT_FRAMES" -ge 10
          test "$UNIQUE_FRAMES" -ge 10

          python3 - "$LOG" "$START_LINE" <<'PY'
          import math,re,sys
          text='\n'.join(open(sys.argv[1],encoding='utf-8',errors='replace').read().splitlines()[max(0,int(sys.argv[2])-1):])
          rx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_REFERENCE_FRAME_PROOF sample=(\d+) player_tick=(\d+) owner_id=(-?\d+).*?horizontal_error=([-+0-9.eE]+) owner_heading=([-+0-9.eE]+)')
          groups={}
          for s,t,o,e,h in rx.findall(text): groups.setdefault(int(o),[]).append((int(t),float(e),float(h)))
          valid=[]
          for owner,rows in groups.items():
              if len({t for t,_,_ in rows}) < 2: continue
              hs=[h for _,_,h in rows]; un=[hs[0]]; prev=hs[0]
              for h in hs[1:]:
                  d=(h-prev+math.pi)%(2*math.pi)-math.pi
                  un.append(un[-1]+d); prev=h
              span=max(un)-min(un); maxerr=max(e for _,e,_ in rows)
              if span>=0.01 and maxerr<=0.05: valid.append((span,maxerr,owner,len(rows)))
          if not valid: raise SystemExit('framebuffer capture interval did not contain proven active-owner turn')
          span,maxerr,owner,count=max(valid)
          print(f'CAMERA_VISUAL_CLOSE_INTERVAL_OK owner={owner} rows={count} heading_span_rad={span:.9f} max_horizontal_error={maxerr:.9f}')
          PY

          MP4_SHA=$(sha256sum "$MP4" | awk '{print $1}')
          {
            echo 'subsystem=camera'
            echo "source_proof_head=$SOURCE_PROOF_HEAD"
            echo "source_proof_run=$SOURCE_PROOF_RUN"
            echo "source_proof_artifact=$SOURCE_PROOF_ARTIFACT"
            echo "visual_run=$GITHUB_RUN_ID"
            echo "workflow_definition_head=$GITHUB_SHA"
            echo 'scenario=active_external_owner_real_carriage_turn'
            echo 'capture_source=opengl_framebuffer_direct'
            echo 'source_checkout_verified=true'
            echo 'visual_nonblack_verified=true'
            echo 'visual_dynamic_verified=true'
            echo "width=$WIDTH"
            echo "height=$HEIGHT"
            echo "fps=$FPS"
            echo "frames=$FRAMES"
            echo "max_luma=$MAX_Y"
            echo "bright_frames=$BRIGHT_FRAMES"
            echo "unique_frames=$UNIQUE_FRAMES"
            echo 'jar_sha256=n/a_not_final_candidate'
            echo "mp4_sha256=$MP4_SHA"
          } > "$META"
          rm -f "$RAW"

      - name: Upload camera closure video
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: camera-visual-close
          path: |
            camera-turn-visual-close.mp4
            camera-turn-visual-close-metadata.txt
            camera-turn-visual-close-luma.txt
            camera-turn-visual-close-framemd5.txt
            camera-turn-visual-close.rgb.meta
            camera-visual-close-runtime.log
            camera-visual-close-xvfb.log
          if-no-files-found: warn

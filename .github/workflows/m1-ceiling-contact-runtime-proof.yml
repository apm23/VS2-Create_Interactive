name: m1-ceiling-contact-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_vs2_26_2_ceiling_contact_trace.py'
      - '.github/workflows/m1-ceiling-contact-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling-contact-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Record proof head
        shell: bash
        run: |
          set -euo pipefail
          echo "CEILING_PROOF_HEAD=$(git rev-parse HEAD)"

      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose current production plus read-only ceiling trace
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_camera_fix.py
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_ceiling_contact_trace.py
          grep -q 'GATE_E_CREATE_COLLIDE_MANY_RESULT' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinContinuousOBBColliderTrace.java
          grep -q 'GATE_E_CLIENT_STATE player_tick={}' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'GATE_E_CREATE_LOCALPLAYER_COLLIDE_RESULT index={} player_tick={}' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinContraptionColliderTrace.java
          grep -q 'GATE_E_LOCALPLAYER_SET_POS index={} player_tick={}' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinEntityLocalPlayerSetPosTrace.java

      - name: Compile proof composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct pristine verified r0v3 save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf ceiling-world
          mkdir ceiling-world
          unzip -q train-world-state-r0v3.zip -d ceiling-world
          rm -rf upstream/fabric/run/saves/train-v2-ceiling-proof
          mkdir -p upstream/fabric/run/saves
          mv 'ceiling-world/train build 1' upstream/fabric/run/saves/train-v2-ceiling-proof

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Exercise unchanged native jump across pristine launches and classify ceiling contact
        working-directory: upstream
        timeout-minutes: 8
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG_BASE=../m1-ceiling-contact-runtime
          LOG=../m1-ceiling-contact-runtime.log
          XVFB_LOG=../m1-ceiling-contact-xvfb.log
          PROOF=../m1-ceiling-contact-proof.txt
          rm -f "$LOG" "$XVFB_LOG" "$PROOF" ${LOG_BASE}-attempt-*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          CLIENT_PID=''
          cleanup() {
            if [ -n "$CLIENT_PID" ]; then kill "$CLIENT_PID" 2>/dev/null || true; wait "$CLIENT_PID" 2>/dev/null || true; fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          restore_pristine_save() {
            rm -rf fabric/run/saves/train-v2-ceiling-proof ../ceiling-world-retry
            mkdir -p ../ceiling-world-retry fabric/run/saves
            unzip -q ../train-world-state-r0v3.zip -d ../ceiling-world-retry
            mv '../ceiling-world-retry/train build 1' fabric/run/saves/train-v2-ceiling-proof
            rm -rf ../ceiling-world-retry
          }

          WINNER=''
          ATTEMPT_SUMMARY=../m1-ceiling-contact-attempts.txt
          : > "$ATTEMPT_SUMMARY"
          for attempt in 1 2 3; do
            restore_pristine_save
            ATTEMPT_LOG="${LOG_BASE}-attempt-${attempt}.log"
            rm -rf fabric/run/crash-reports
            rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log "$ATTEMPT_LOG"
            ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-ceiling-proof' > "$ATTEMPT_LOG" 2>&1 &
            CLIENT_PID=$!

            fatal_state() {
              grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$ATTEMPT_LOG" \
                || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
                || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
                || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
            }

            STATE=WAIT
            for i in $(seq 1 240); do
              STATE=$(python3 - "$ATTEMPT_LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          ticks=[int(x) for x in re.findall(r'GATE_E_CLIENT_STATE player_tick=(\d+)',text)]
          if air and ticks and max(ticks) >= int(air.group(1))+25:
              air_tick=int(air.group(1))
              finite_overhead=False
              for line in text.splitlines():
                  m=re.search(r'GATE_E_CLIENT_STATE player_tick=(\d+).*?ceiling_head_gap=([-+0-9.eE]+|NaN)',line)
                  if not m: continue
                  tick=int(m.group(1))
                  if not (air_tick-4 <= tick <= air_tick+25): continue
                  try: gap=float(m.group(2))
                  except ValueError: continue
                  if math.isfinite(gap):
                      finite_overhead=True
                      break
              print('READY_OVERHEAD' if finite_overhead else 'READY_NO_OVERHEAD')
          elif ticks and max(ticks) >= 180:
              print('EXHAUSTED')
          else:
              print('WAIT')
          PY
              )
              if [ "$STATE" = READY_OVERHEAD ] || [ "$STATE" = READY_NO_OVERHEAD ]; then break; fi
              if [ "$STATE" = EXHAUSTED ]; then break; fi
              if fatal_state; then tail -260 "$ATTEMPT_LOG"; exit 1; fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -260 "$ATTEMPT_LOG"; exit 1; fi
              sleep 1
            done

            python3 - "$ATTEMPT_LOG" "$attempt" "$STATE" >> "$ATTEMPT_SUMMARY" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          ticks=[int(x) for x in re.findall(r'GATE_E_CLIENT_STATE player_tick=(\d+)',text)]
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          finite=False
          if air:
              air_tick=int(air.group(1))
              for line in text.splitlines():
                  m=re.search(r'GATE_E_CLIENT_STATE player_tick=(\d+).*?ceiling_head_gap=([-+0-9.eE]+|NaN)',line)
                  if not m: continue
                  tick=int(m.group(1))
                  if not (air_tick-4 <= tick <= air_tick+25): continue
                  try: gap=float(m.group(2))
                  except ValueError: continue
                  if math.isfinite(gap):
                      finite=True
                      break
          print('CEILING_PRISTINE_ATTEMPT attempt={} state={} max_tick={} airborne={} finite_overhead={} backward_confirmed={} strafe_confirmed={}'.format(
              sys.argv[2], sys.argv[3], max(ticks) if ticks else -1,
              'GATE_E_M1_NATIVE_JUMP_AIRBORNE' in text, finite,
              'GATE_E_M1_NATIVE_BACKWARD_CONFIRMED' in text,
              'GATE_E_M1_NATIVE_STRAFE_CONFIRMED' in text))
          PY

            kill "$CLIENT_PID" 2>/dev/null || true
            wait "$CLIENT_PID" 2>/dev/null || true
            CLIENT_PID=''
            if [ "$STATE" = READY_OVERHEAD ]; then
              WINNER="$ATTEMPT_LOG"
              cp "$ATTEMPT_LOG" "$LOG"
              break
            fi
          done

          cat "$ATTEMPT_SUMMARY"
          if [ -z "$WINNER" ]; then
            cp "${LOG_BASE}-attempt-3.log" "$LOG"
            cat "$ATTEMPT_SUMMARY" | tee "$PROOF"
            echo 'M1_CEILING_CONTACT_RUNTIME_PROOF classification=CEILING_NOT_EXERCISED reason=no_native_jump_with_finite_overhead_across_3_pristine_launches unchanged_input_sequence=true unchanged_fixture_geometry=true unchanged_train_route_timing=true no_gameplay_patch_authorized=true' | tee -a "$PROOF"
            exit 0
          fi
          if fatal_state; then tail -260 "$LOG"; exit 1; fi

          python3 - "$LOG" <<'PY' | tee "$PROOF"
          import math,re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)[^\n]*delta_y=([-+0-9.eE]+)',text)
          if not air: raise SystemExit('CEILING_PROOF missing native airborne marker')
          air_tick=int(air.group(1)); rise=float(air.group(2))
          num=r'[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?'

          state={}
          overhead=[]
          for line in text.splitlines():
              m=re.search(r'GATE_E_CLIENT_STATE player_tick=(\d+).*?simplified_colliders=(.*)$',line)
              if not m: continue
              t=int(m.group(1)); payload=m.group(2); state[t]=payload
              lm=re.search(r'local_feet=('+num+'),('+num+'),('+num+')',payload)
              cm=re.search(r'ceiling_head_gap=('+num+r'|NaN)',payload)
              bm=re.search(r'lowest_bottom_over_head=('+num+r'|NaN)',payload)
              if lm and cm:
                  gap=float(cm.group(1)) if cm.group(1)!='NaN' else math.nan
                  bottom=float(bm.group(1)) if bm and bm.group(1)!='NaN' else math.nan
                  overhead.append((t,tuple(map(float,lm.groups())),gap,bottom))

          obb=[]
          for line in text.splitlines():
              if 'GATE_E_CREATE_COLLIDE_MANY_RESULT' not in line or ' normal=' not in line: continue
              tm=re.search(r'player_tick=(-?\d+)',line); sm=re.search(r'surface=(true|false)',line); tem=re.search(r'temporal=('+num+')',line)
              rm=re.search(r'response=(.*?) normal=',line); nm=re.search(r'normal=(.*?) location=',line); lm=re.search(r'location=(.*?) player_tick=',line)
              if not (tm and sm and tem and rm and nm and lm): continue
              vals=[float(x) for x in re.findall(num,nm.group(1))]
              if len(vals)<3: continue
              obb.append((int(tm.group(1)),sm.group(1)=='true',float(tem.group(1)),rm.group(1),tuple(vals[:3]),lm.group(1),line))

          ceiling=[r for r in obb if air_tick-2 <= r[0] <= air_tick+25 and r[4][1] <= -0.75]
          collide={}
          setpos={}
          for line in text.splitlines():
              if 'GATE_E_CREATE_LOCALPLAYER_COLLIDE_RESULT' in line or 'GATE_E_CREATE_LOCALPLAYER_ZERO_COLLIDE_RESULT' in line:
                  m=re.search(r'player_tick=(\d+)',line)
                  if m: collide.setdefault(int(m.group(1)),[]).append(line)
              if 'GATE_E_LOCALPLAYER_SET_POS' in line:
                  m=re.search(r'player_tick=(\d+)',line)
                  if m: setpos.setdefault(int(m.group(1)),[]).append(line)

          finite_over=[x for x in overhead if math.isfinite(x[2]) and air_tick-4 <= x[0] <= air_tick+25]
          print(f'M1_CEILING_CONTACT_RUNTIME_PROOF airborne_tick={air_tick} rise_delta={rise:.9f} obb_rows={len(obb)} ceiling_normal_rows={len(ceiling)} finite_overhead_rows={len(finite_over)} telemetry_only=true gameplay_mutated=false collision_mutated=false')
          if finite_over:
              best=min(finite_over,key=lambda x: abs(x[2]))
              print(f'CEILING_GEOMETRY_NEAREST tick={best[0]} local_pos={best[1]} ceiling_head_gap={best[2]:.9f} ceiling_bottom={best[3]}')
          if not ceiling:
              print('M1_CEILING_CONTACT_RUNTIME_PROOF classification=CEILING_NOT_EXERCISED no_gameplay_patch_authorized=true')
              raise SystemExit(0)

          complete=0
          for t,surface,temporal,response,normal,location,line in ceiling:
              geometry=state.get(t)
              crows=collide.get(t,[])
              srows=setpos.get(t,[])
              create_writers=[x for x in srows if 'zurrtum.create' in x]
              if geometry is not None and crows and create_writers: complete+=1
              local='none'
              if geometry:
                  m=re.search(r'local_feet=('+num+'),('+num+'),('+num+')',geometry)
                  if m: local=','.join(m.groups())
              print(f'CEILING_CONTACT_ROW tick={t} local_pos={local} normal={normal} response={response} surface={str(surface).lower()} temporal={temporal:.9f} collide_rows={len(crows)} create_setpos_rows={len(create_writers)} location={location}')
              for row in crows[:3]: print('CEILING_COLLIDE_CORRELATION '+row)
              for row in create_writers[:3]: print('CEILING_CREATE_WRITER_CORRELATION '+row)
          if complete:
              print(f'M1_CEILING_CONTACT_RUNTIME_PROOF classification=CEILING_CONTACT_CORRELATED complete_ticks={complete} no_gameplay_failure_inferred=true')
          else:
              print('M1_CEILING_CONTACT_RUNTIME_PROOF classification=CEILING_CONTACT_OBSERVED_CORRELATION_INCOMPLETE no_gameplay_patch_authorized=true')
          PY

      - name: Upload ceiling proof evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-ceiling-contact-runtime-proof
          path: |
            m1-ceiling-contact-runtime.log
            m1-ceiling-contact-runtime-attempt-*.log
            m1-ceiling-contact-attempts.txt
            m1-ceiling-contact-xvfb.log
            m1-ceiling-contact-proof.txt
          if-no-files-found: warn
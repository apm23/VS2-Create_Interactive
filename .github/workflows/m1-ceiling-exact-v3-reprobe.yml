name: m1-ceiling-exact-v3-reprobe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-ceiling-exact-v3-reprobe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_PROOF_HEAD: 61bc52795a7a812873cf7aa9d21b73a6c0a88bc9
  PRISTINE_SHA256: e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556

jobs:
  ceiling-exact-v3-reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact V3 source proof head
        uses: actions/checkout@v5
        with:
          ref: 61bc52795a7a812873cf7aa9d21b73a6c0a88bc9
          fetch-depth: 1

      - name: Verify exact source proof head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_PROOF_HEAD"
          echo "CEILING_EXACT_V3_SOURCE_HEAD=$SOURCE_PROOF_HEAD"

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V3 plus read-only ceiling trace
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_camera_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v3_continuous_pose.py
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_ceiling_contact_trace.py
          grep -q 'REFERENCE_OWNER_V3_CONTINUOUS_POSE' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt
          grep -q 'create_client_collision_head_gap=' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'GATE_E_CREATE_COLLIDE_MANY_RESULT' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinContinuousOBBColliderTrace.java
          echo 'CEILING_EXACT_V3_COMPOSITION continuous_owner_v3=true contracted_create_gap=true read_only_trace=true gameplay_mutated=false collision_mutated=false input_mutated=false fixture_mutated=false route_mutated=false video_recorded=false'

      - name: Compile proof composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct pristine verified r0v3 save
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$PRISTINE_SHA256"

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Exercise unchanged native jump and classify exact V3 ceiling boundary
        working-directory: upstream
        timeout-minutes: 8
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true -Dvs2.referenceOwnerV3Trace=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG_BASE=../m1-ceiling-exact-v3
          LOG=../m1-ceiling-exact-v3.log
          PROOF=../m1-ceiling-exact-v3-proof.txt
          ATTEMPTS=../m1-ceiling-exact-v3-attempts.txt
          XVFB_LOG=../m1-ceiling-exact-v3-xvfb.log
          rm -f "$LOG" "$PROOF" "$ATTEMPTS" "$XVFB_LOG" ${LOG_BASE}-attempt-*.log
          : > "$ATTEMPTS"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          CLIENT_PID=''
          cleanup() {
            if [ -n "$CLIENT_PID" ]; then kill "$CLIENT_PID" 2>/dev/null || true; wait "$CLIENT_PID" 2>/dev/null || true; fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          restore_save() {
            rm -rf fabric/run/saves/train-v3-ceiling-exact ../ceiling-v3-retry
            mkdir -p fabric/run/saves ../ceiling-v3-retry
            unzip -q ../train-world-state-r0v3.zip -d ../ceiling-v3-retry
            mv '../ceiling-v3-retry/train build 1' fabric/run/saves/train-v3-ceiling-exact
            rm -rf ../ceiling-v3-retry
          }

          WINNER=''
          for attempt in 1 2 3; do
            restore_save
            ATTEMPT_LOG="${LOG_BASE}-attempt-${attempt}.log"
            rm -rf fabric/run/crash-reports
            rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log "$ATTEMPT_LOG"
            ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v3-ceiling-exact' > "$ATTEMPT_LOG" 2>&1 &
            CLIENT_PID=$!

            fatal_state() {
              grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$ATTEMPT_LOG" \
                || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
                || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
                || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
            }

            STATE=WAIT
            for i in $(seq 1 240); do
              STATE=$(python3 - "$ATTEMPT_LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          owner_ticks={int(x) for x in re.findall(r'REFERENCE_OWNER_V3_CONTINUOUS_POSE player_tick=(\d+)',text)}
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          state_ticks=[int(x) for x in re.findall(r'GATE_E_CLIENT_STATE player_tick=(\d+)',text)]
          if air and state_ticks and max(state_ticks) >= int(air.group(1))+25:
              air_tick=int(air.group(1)); overlap=False
              for line in text.splitlines():
                  m=re.search(r'GATE_E_CLIENT_STATE player_tick=(\d+).*?create_client_collision_head_gap=([-+0-9.eE]+|NaN)',line)
                  if not m: continue
                  tick=int(m.group(1))
                  if tick not in owner_ticks or not (air_tick-4 <= tick <= air_tick+25): continue
                  try: gap=float(m.group(2))
                  except ValueError: continue
                  if math.isfinite(gap) and gap <= 0.0:
                      overlap=True; break
              print('READY_OVERLAP' if overlap else 'READY_NO_OVERLAP')
          elif state_ticks and max(state_ticks) >= 180:
              print('EXHAUSTED')
          else:
              print('WAIT')
          PY
              )
              if [ "$STATE" = READY_OVERLAP ] || [ "$STATE" = READY_NO_OVERLAP ] || [ "$STATE" = EXHAUSTED ]; then break; fi
              if fatal_state; then tail -260 "$ATTEMPT_LOG"; exit 1; fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -260 "$ATTEMPT_LOG"; exit 1; fi
              sleep 1
            done

            python3 - "$ATTEMPT_LOG" "$attempt" "$STATE" >> "$ATTEMPTS" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          owner_ticks={int(x) for x in re.findall(r'REFERENCE_OWNER_V3_CONTINUOUS_POSE player_tick=(\d+)',text)}
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          state_ticks=[int(x) for x in re.findall(r'GATE_E_CLIENT_STATE player_tick=(\d+)',text)]
          finite=False; overlap=False
          if air:
              air_tick=int(air.group(1))
              for line in text.splitlines():
                  m=re.search(r'GATE_E_CLIENT_STATE player_tick=(\d+).*?create_client_collision_head_gap=([-+0-9.eE]+|NaN)',line)
                  if not m: continue
                  tick=int(m.group(1))
                  if tick not in owner_ticks or not (air_tick-4 <= tick <= air_tick+25): continue
                  try: gap=float(m.group(2))
                  except ValueError: continue
                  if math.isfinite(gap):
                      finite=True
                      if gap <= 0.0: overlap=True; break
          print('CEILING_EXACT_V3_ATTEMPT attempt={} state={} max_tick={} airborne={} owner_pose_ticks={} finite_contracted_overhead={} contracted_overlap={}'.format(
              sys.argv[2],sys.argv[3],max(state_ticks) if state_ticks else -1,bool(air),len(owner_ticks),finite,overlap))
          PY

            kill "$CLIENT_PID" 2>/dev/null || true
            wait "$CLIENT_PID" 2>/dev/null || true
            CLIENT_PID=''
            if [ "$STATE" = READY_OVERLAP ]; then
              WINNER="$ATTEMPT_LOG"
              cp "$ATTEMPT_LOG" "$LOG"
              break
            fi
          done

          cat "$ATTEMPTS"
          if [ -z "$WINNER" ]; then
            cp "${LOG_BASE}-attempt-3.log" "$LOG"
            cat "$ATTEMPTS" | tee "$PROOF"
            echo 'M1_CEILING_EXACT_V3_REPROBE classification=CEILING_NOT_EXERCISED exact_v3_source=true active_owner_required=true create_contracted_gap=true unchanged_input_sequence=true unchanged_fixture_geometry=true unchanged_train_route_timing=true no_gameplay_patch_authorized=true video_recorded=false' | tee -a "$PROOF"
            exit 0
          fi

          python3 - "$LOG" <<'PY' | tee "$PROOF"
          import math,re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          num=r'[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?'
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)[^\n]*delta_y=('+num+')',text)
          if not air: raise SystemExit('missing native airborne marker')
          air_tick=int(air.group(1)); rise=float(air.group(2))
          owner_ticks={int(x) for x in re.findall(r'REFERENCE_OWNER_V3_CONTINUOUS_POSE player_tick=(\d+)',text)}
          if not owner_ticks: raise SystemExit('missing active V3 owner pose rows')

          state={}; overhead=[]
          for line in text.splitlines():
              m=re.search(r'GATE_E_CLIENT_STATE player_tick=(\d+).*?simplified_colliders=(.*)$',line)
              if not m: continue
              t=int(m.group(1)); payload=m.group(2); state[t]=payload
              lm=re.search(r'local_feet=('+num+'),('+num+'),('+num+')',payload)
              gm=re.search(r'create_client_collision_head_gap=('+num+r'|NaN)',payload)
              bm=re.search(r'lowest_bottom_over_head=('+num+r'|NaN)',payload)
              if lm and gm:
                  gap=float(gm.group(1)) if gm.group(1)!='NaN' else math.nan
                  bottom=float(bm.group(1)) if bm and bm.group(1)!='NaN' else math.nan
                  overhead.append((t,tuple(map(float,lm.groups())),gap,bottom))

          obb=[]
          for line in text.splitlines():
              if 'GATE_E_CREATE_COLLIDE_MANY_RESULT' not in line or ' normal=' not in line: continue
              tm=re.search(r'player_tick=(-?\d+)',line); sm=re.search(r'surface=(true|false)',line); tem=re.search(r'temporal=('+num+')',line)
              rm=re.search(r'response=(.*?) normal=',line); nm=re.search(r'normal=(.*?) location=',line); lm=re.search(r'location=(.*?) player_tick=',line)
              if not (tm and sm and tem and rm and nm and lm): continue
              vals=[float(x) for x in re.findall(num,nm.group(1))]
              if len(vals)<3: continue
              obb.append((int(tm.group(1)),sm.group(1)=='true',float(tem.group(1)),rm.group(1),tuple(vals[:3]),lm.group(1),line))

          collide={}; setpos={}
          for line in text.splitlines():
              if 'GATE_E_CREATE_LOCALPLAYER_COLLIDE_RESULT' in line or 'GATE_E_CREATE_LOCALPLAYER_ZERO_COLLIDE_RESULT' in line:
                  m=re.search(r'player_tick=(\d+)',line)
                  if m: collide.setdefault(int(m.group(1)),[]).append(line)
              if 'GATE_E_LOCALPLAYER_SET_POS' in line:
                  m=re.search(r'player_tick=(\d+)',line)
                  if m: setpos.setdefault(int(m.group(1)),[]).append(line)

          finite=[x for x in overhead if x[0] in owner_ticks and math.isfinite(x[2]) and air_tick-4 <= x[0] <= air_tick+25]
          overlap=[x for x in finite if x[2] <= 0.0]
          ceiling=[r for r in obb if r[0] in owner_ticks and air_tick-2 <= r[0] <= air_tick+25 and r[4][1] <= -0.75]
          print(f'M1_CEILING_EXACT_V3_REPROBE airborne_tick={air_tick} rise_delta={rise:.9f} owner_pose_ticks={len(owner_ticks)} finite_contracted_rows={len(finite)} contracted_overlap_rows={len(overlap)} ceiling_normal_rows={len(ceiling)} telemetry_only=true gameplay_mutated=false collision_mutated=false input_mutated=false video_recorded=false')
          for t,local,gap,bottom in overlap:
              crows=collide.get(t,[]); srows=setpos.get(t,[])
              create_writers=[x for x in srows if 'zurrtum.create' in x]
              print(f'CEILING_EXACT_V3_OVERLAP tick={t} local_pos={local} create_contracted_head_gap={gap:.9f} ceiling_bottom={bottom} collide_rows={len(crows)} create_setpos_rows={len(create_writers)} owner_active=true')
              for row in crows[:3]: print('CEILING_EXACT_V3_COLLIDE '+row)
              for row in create_writers[:3]: print('CEILING_EXACT_V3_CREATE_WRITER '+row)
          for t,surface,temporal,response,normal,location,line in ceiling:
              print(f'CEILING_EXACT_V3_NORMAL tick={t} normal={normal} response={response} surface={str(surface).lower()} temporal={temporal:.9f} location={location}')

          if not overlap:
              print('M1_CEILING_EXACT_V3_REPROBE classification=CEILING_NOT_EXERCISED no_gameplay_patch_authorized=true')
          elif not ceiling:
              print('M1_CEILING_EXACT_V3_REPROBE classification=CONTRACTED_OVERLAP_WITHOUT_CEILING_NORMAL application_order_inspection_required=true no_gameplay_patch_authorized=true')
          else:
              correlated=sum(1 for r in ceiling if collide.get(r[0]) and any('zurrtum.create' in x for x in setpos.get(r[0],[])))
              print(f'M1_CEILING_EXACT_V3_REPROBE classification=CEILING_CONTACT_CORRELATED correlated_ticks={correlated} no_gameplay_failure_inferred=true')
          PY

      - name: Upload exact V3 ceiling evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1-ceiling-exact-v3-reprobe
          path: |
            m1-ceiling-exact-v3.log
            m1-ceiling-exact-v3-attempt-*.log
            m1-ceiling-exact-v3-attempts.txt
            m1-ceiling-exact-v3-proof.txt
            m1-ceiling-exact-v3-xvfb.log
          if-no-files-found: warn

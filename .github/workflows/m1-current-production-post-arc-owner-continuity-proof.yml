name: m1-current-production-post-arc-owner-continuity-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-current-production-post-arc-owner-continuity-proof.yml'
      - 'scripts/prepare_vs2_26_2_natural_landing_post_arc_owner_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-arc-owner-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Apply same natural-landing harness and read-only traces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_natural_landing_candidate_support_trace.py
          python3 scripts/prepare_vs2_26_2_natural_landing_post_arc_owner_trace.py
          grep -q 'REFERENCE_OWNER_V2_POST_ARC_STATE' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'GATE_E_CANDIDATE_NATIVE_SUPPORT' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java

      - name: Compile traced composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-post-arc-owner
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-post-arc-owner

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove current-production post-arc owner lifecycle
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../current-production-post-arc-owner.log
          XVFB_LOG=../current-production-post-arc-owner-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-post-arc-owner' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            kill "$CLIENT_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }
          READY=0
          for i in $(seq 1 900); do
            if python3 - "$LOG" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          states=[int(x) for x in re.findall(r'REFERENCE_OWNER_V2_POST_ARC_STATE player_tick=(\d+)',text)]
          if not air or not states: raise SystemExit(1)
          a=int(air.group(1)); latest=max(states)
          refresh=[int(x) for x in re.findall(r'REFERENCE_OWNER_V2_NATIVE_GROUNDED_REFRESH player_tick=(\d+)',text) if int(x)>=a]
          target=(min(refresh)+5) if refresh else (a+40)
          raise SystemExit(0 if latest >= target else 1)
          PY
            then
              READY=1
              break
            fi
            if fatal_state; then tail -360 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -360 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          if fatal_state; then tail -360 "$LOG"; exit 1; fi

          python3 - "$LOG" <<'PY'
          import math,re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          req=re.search(r'GATE_E_M1_NATIVE_JUMP_REQUESTED[^\n]*player_tick=(\d+)',text)
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)[^\n]*delta_y=([-+0-9.eE]+)',text)
          if not (req and air): raise SystemExit('POST_ARC_PROOF missing valid jump markers')
          r_tick=int(req.group(1)); a_tick=int(air.group(1)); rise=float(air.group(2))
          acquisitions=[(int(t),int(c)) for t,c in re.findall(r'REFERENCE_OWNER_V2_ACQUIRE[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)',text)]
          prior=[x for x in acquisitions if x[0] <= r_tick]
          if not prior: raise SystemExit('POST_ARC_PROOF no owner before jump')
          _,owner=max(prior)

          state_re=re.compile(
              r'REFERENCE_OWNER_V2_POST_ARC_STATE player_tick=(\d+) owner_id=(-?\d+) owner_age=(\d+) '
              r'jump_active=(true|false) lifetime_limit=(\d+) age_within_lifetime=(true|false) '
              r'on_ground=(true|false) delta_y=([-+0-9.eE]+) owner_entity_present=(true|false) owner_local=([^ ]+) read_only=true')
          states=[]
          for m in state_re.finditer(text):
              local=None
              if ',' in m.group(10) and not m.group(10).startswith('error='):
                  try: local=tuple(float(v) for v in m.group(10).split(','))
                  except ValueError: local=None
              states.append((int(m.group(1)),int(m.group(2)),int(m.group(3)),m.group(4)=='true',int(m.group(5)),m.group(6)=='true',m.group(7)=='true',float(m.group(8)),m.group(9)=='true',local))
          states=[s for s in states if s[0] >= a_tick]
          if not states: raise SystemExit('POST_ARC_PROOF no post-arc owner states')

          refresh_re=re.compile(
              r'REFERENCE_OWNER_V2_NATIVE_GROUNDED_REFRESH player_tick=(\d+) carriage_id=(\d+) '
              r'jump_landing_after_ordinary_cap=(true|false) settled_same_owner_contact=(true|false)')
          refresh=[(int(t),int(c),j=='true',s=='true') for t,c,j,s in refresh_re.findall(text) if int(t)>=a_tick and int(c)==owner]
          first_refresh=refresh[0] if refresh else None
          end_tick=(first_refresh[0]+5) if first_refresh else (a_tick+40)
          window=[s for s in states if s[0] <= end_tick]
          if not window or max(s[0] for s in window) < end_tick:
              raise SystemExit(f'POST_ARC_PROOF incomplete observation end_tick={end_tick} latest={max(s[0] for s in states)}')

          pre_end=first_refresh[0]-1 if first_refresh else end_tick
          pre=[s for s in window if s[0] <= pre_end]
          wrong=[s for s in pre if s[1] != owner]
          dead=[s for s in pre if not s[5]]
          jump_off=[s for s in pre if not s[3]]
          if wrong: raise SystemExit(f'POST_ARC_PROOF owner changed before landing refresh owner={owner} samples={wrong[:6]}')
          if dead: raise SystemExit(f'POST_ARC_PROOF owner lifetime inactive before landing refresh owner={owner} samples={dead[:6]}')
          if jump_off: raise SystemExit(f'POST_ARC_PROOF jump latch cleared before landing refresh owner={owner} samples={jump_off[:6]}')

          if first_refresh is None:
              raise SystemExit(f'CURRENT_PRODUCTION_VALID_JUMP_NO_SAME_OWNER_NATIVE_REFRESH_BY_HORIZON owner={owner} airborne_tick={a_tick} horizon={end_tick}')
          f_tick,_,after_cap,settled=first_refresh
          if not after_cap:
              raise SystemExit(f'POST_ARC_PROOF first same-owner refresh did not cross ordinary cap tick={f_tick} owner={owner} settled={settled}')

          post=[s for s in window if f_tick <= s[0] <= f_tick+5]
          if len({s[0] for s in post}) < 5:
              raise SystemExit(f'POST_ARC_PROOF insufficient settled owner samples after refresh count={len(post)}')
          if any(s[1] != owner or not s[5] for s in post):
              raise SystemExit(f'POST_ARC_PROOF owner not stable after refresh samples={post[:8]}')
          if any(s[0] > f_tick and s[3] for s in post):
              raise SystemExit(f'POST_ARC_PROOF jump latch remained armed after refresh samples={post[:8]}')

          native=[(int(t),int(c)) for t,c in re.findall(r'GATE_E_PHASE170_NATIVE_CONTACT_APPLICATION player_tick=(\d+) carriage_id=(\d+)',text)]
          native_near=[t for t,c in native if c==owner and f_tick-1 <= t <= f_tick+1]
          grounded=[int(t) for t in re.findall(r'GATE_E_CREATE_SET_ON_GROUND_SEAM player_tick=(\d+)[^\n]*requested_on_ground=true[^\n]*applied_on_ground=true',text)]
          grounded_near=[t for t in grounded if f_tick-1 <= t <= f_tick+1]
          if not native_near: raise SystemExit(f'POST_ARC_PROOF no same-owner native contact near refresh tick={f_tick}')
          if not grounded_near: raise SystemExit(f'POST_ARC_PROOF no applied Create grounding near refresh tick={f_tick}')

          coords=[(s[0],s[9]) for s in window if s[9] is not None]
          max_step=0.0
          max_step_pair=None
          for (ta,a),(tb,b) in zip(coords,coords[1:]):
              if tb != ta+1: continue
              step=math.hypot(b[0]-a[0],b[2]-a[2])
              if step>max_step: max_step,max_step_pair=step,(ta,tb)
          false_support=[int(t) for t,c,p in re.findall(r'GATE_E_PHASE131_SUPPORT_SOURCE player_tick=(\d+) carriage_id=(\d+) physical_support=(true|false)',text) if int(c)==owner and p=='false' and int(t)>=a_tick]

          print('CURRENT_PRODUCTION_VALID_JUMP_POST_ARC_OWNER_CONTINUITY_PROOF'
                f' conclusion=same_owner_native_landing_refresh_green owner={owner}'
                f' request_tick={r_tick} airborne_tick={a_tick} rise_delta={rise}'
                f' refresh_tick={f_tick} jump_landing_after_ordinary_cap={after_cap}'
                f' settled_same_owner_contact={settled} native_contact_near_refresh={native_near}'
                f' create_ground_near_refresh={grounded_near} max_owner_local_xz_step={max_step:.9f}'
                f' max_owner_local_step_pair={max_step_pair} phase131_false_support_ticks={false_support[:24]}'
                ' production_unchanged=true harness_semantics_unchanged=true telemetry_only=true final_ready=false')
          PY

      - name: Upload exact post-arc proof log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: current-production-post-arc-owner-log
          path: |
            current-production-post-arc-owner.log
            current-production-post-arc-owner-xvfb.log
          if-no-files-found: warn

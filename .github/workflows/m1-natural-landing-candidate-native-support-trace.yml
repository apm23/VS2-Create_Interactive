name: m1-natural-landing-candidate-native-support-trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-natural-landing-candidate-native-support-trace.yml'
      - 'scripts/prepare_vs2_26_2_natural_landing_candidate_support_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-native-support-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Apply exact natural-landing harness plus read-only candidate support trace
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_natural_landing_candidate_support_trace.py
          grep -q 'GATE_E_CANDIDATE_NATIVE_SUPPORT' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'read_only=true' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java

      - name: Compile traced composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-candidate-support
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-candidate-support

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Capture candidate native support through fixture baseline and walk start
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../natural-landing-candidate-native-support.log
          XVFB_LOG=../natural-landing-candidate-native-support-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-candidate-support' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            kill "$CLIENT_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 600); do
            if grep -q 'GATE_E_CLIENT_CARRY_BASELINE' "$LOG" \
              && grep -q 'GATE_F_NATIVE_PLACEMENT_TARGET_PUBLISHED' "$LOG" \
              && grep -q 'GATE_E_PHASE154_FIXTURE_WALK_START' "$LOG" \
              && grep -q 'GATE_E_CANDIDATE_NATIVE_SUPPORT' "$LOG"; then
              READY=1
              break
            fi
            if grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Game crashed' "$LOG"; then
              tail -300 "$LOG"
              exit 1
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              wait "$CLIENT_PID" || true
              tail -300 "$LOG"
              exit 1
            fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 2
          python3 - "$LOG" <<'PY'
          import re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          baseline=re.search(r'GATE_E_CLIENT_CARRY_BASELINE carriage_id=(\d+)',text)
          target=re.search(r'GATE_F_NATIVE_PLACEMENT_TARGET_PUBLISHED carriage_id=(\d+) player_tick=(\d+)',text)
          walk=re.search(r'GATE_E_PHASE154_FIXTURE_WALK_START player_tick=(\d+) carriage_id=(\d+)',text)
          rows=re.findall(r'GATE_E_CANDIDATE_NATIVE_SUPPORT player_tick=(\d+) candidate_id=(\d+)[^\n]*strict_support=(true|false)[^\n]*',text)
          if not (baseline and target and walk and rows): raise SystemExit('missing candidate-support fixture markers')
          walk_tick=int(walk.group(1))
          window=[row for row in rows if max(12,walk_tick-5) <= int(row[0]) <= walk_tick]
          print('M1_NATURAL_LANDING_CANDIDATE_NATIVE_SUPPORT_TRACE'
                f' baseline_id={baseline.group(1)} target_id={target.group(1)} target_tick={target.group(2)}'
                f' walk_id={walk.group(2)} walk_tick={walk_tick} support_rows={len(rows)}'
                f' prewalk_window={window} selector_unchanged=true telemetry_only=true final_ready=false')
          PY

      - name: Upload exact trace
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: natural-landing-candidate-native-support-log
          path: |
            natural-landing-candidate-native-support.log
            natural-landing-candidate-native-support-xvfb.log
          if-no-files-found: warn

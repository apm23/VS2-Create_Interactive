name: m1-natural-landing-grounding-source-map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-natural-landing-grounding-source-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grounding-source-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Locate exact grounding seam generators
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ground_files < <(grep -R -l --include='*.py' 'GATE_E_CREATE_SET_ON_GROUND_SEAM' scripts | sort)
          mapfile -t final_files < <(grep -R -l --include='*.py' 'GATE_E_CREATE_FINAL_MOTION_SEAM' scripts | sort)
          printf 'GROUND_FILES=%s\n' "${ground_files[*]}"
          printf 'FINAL_FILES=%s\n' "${final_files[*]}"
          test "${#ground_files[@]}" -eq 1
          test "${#final_files[@]}" -eq 1
          python3 - "${ground_files[0]}" "${final_files[0]}" <<'PY'
          from pathlib import Path
          import sys
          for raw in dict.fromkeys(sys.argv[1:]):
              path=Path(raw)
              text=path.read_text(encoding='utf-8')
              print(f'=== SOURCE_MAP {path} sha_text_len={len(text)} ===')
              for token in ['GATE_E_CREATE_SET_ON_GROUND_SEAM','GATE_E_CREATE_FINAL_MOTION_SEAM']:
                  pos=text.find(token)
                  if pos < 0: continue
                  start=max(0, text.rfind('\n',0,max(0,pos-3500)))
                  end=text.find('\n', min(len(text),pos+5000))
                  if end < 0: end=len(text)
                  print(text[start:end])
              print('SOURCE_MAP_TOKENS',
                    'rising_guard=' + str('rising_guard' in text),
                    'setOnGround=' + str('setOnGround' in text),
                    'cancel=' + str('.cancel(' in text or 'ci.cancel(' in text),
                    'setReturnValue=' + str('setReturnValue(' in text))
          PY

      - name: Locate original airborne-preservation guard composition
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t origin_files < <(grep -R -l --include='*.py' 'preserveVanillaAirborneDuringCreateCarry' scripts | sort)
          printf 'GROUND_GUARD_ORIGIN_FILES=%s\n' "${origin_files[*]}"
          test "${#origin_files[@]}" -ge 1
          for f in "${origin_files[@]}"; do
            echo "=== GROUND_GUARD_ORIGIN $f ==="
            grep -n -B 18 -A 45 'preserveVanillaAirborneDuringCreateCarry' "$f" || true
          done

      - name: Classify source-map boundary
        shell: bash
        run: |
          set -euo pipefail
          TRACE=scripts/prepare_vs2_26_2_m1_jump_arm_trace.py
          grep -Fq 'entity.setOnGround(onGround && !risingLocalPlayer);' "$TRACE"
          grep -Fq 'boolean risingLocalPlayer = compatLocalPlayer && deltaYAtCall > 0.05;' "$TRACE"
          grep -Fq 'boolean appliedOnGround = onGround && !risingLocalPlayer;' "$TRACE"
          grep -Fq 'entity.setDeltaMovement(appliedMotion);' "$TRACE"
          grep -Fq 'The collider replacements preserve the exact existing writes.' "$TRACE"
          echo 'GROUNDING_SOURCE_MAP classification=EXISTING_GROUNDING_GUARD_AND_FINAL_MOTION_WRITES_LOCATED verifier_only=true production_unchanged=true harness_unchanged=true final_ready=false'

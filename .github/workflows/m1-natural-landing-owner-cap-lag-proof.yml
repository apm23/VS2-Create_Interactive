name: m1-natural-landing-owner-cap-lag-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-natural-landing-owner-cap-lag-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  owner-cap-lag-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream-pinned

      - name: Verify exact attempt3 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actual="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/apm23/VS2-Create_Interactive/actions/artifacts/10434807961 | jq -r '.digest')"
          test "$actual" = 'sha256:ee7da59e8eebd01e017c023175e1845db04ed5ffd0dca8ab8d4720c98d4a236a'
          mkdir -p evidence
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/apm23/VS2-Create_Interactive/actions/artifacts/10434807961/zip \
            -o evidence/artifact.zip
          unzip -q evidence/artifact.zip -d evidence
          test -f evidence/reference-owner-v2-natural-landing-v2.log

      - name: Prove owner cap creates exact pre-landing frame lag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math, re

          log = Path('evidence/reference-owner-v2-natural-landing-v2.log').read_text(encoding='utf-8', errors='replace')
          log = re.sub(r'\x1b\[[0-9;]*[mK]', '', log)
          pinned = Path('upstream-pinned/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDraggingInformation.kt').read_text(encoding='utf-8')
          compose = Path('scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py').read_text(encoding='utf-8')
          v2 = Path('scripts/prepare_vs2_26_2_reference_owner_v2.py').read_text(encoding='utf-8')

          cap_m = re.search(r'const val TICKS_TO_DRAG_ENTITIES\s*=\s*(\d+)', pinned)
          if not cap_m or int(cap_m.group(1)) != 25:
              raise SystemExit('unexpected pinned owner cap')
          cap = int(cap_m.group(1))
          for token in [
              'externalReferenceOwnerJumpActive: Boolean = false',
              'externalReferenceOwnerJumpActive = true',
              '!entityDraggingInformation.externalReferenceOwnerJumpActive',
          ]:
              if token not in compose:
                  raise SystemExit('jump-latch source lost anchor: ' + token)
          for token in [
              'entityDraggingInformation.ticksSinceExternalReferenceOwner += 1',
              'ticksSinceExternalReferenceOwner >= EntityDraggingInformation.TICKS_TO_DRAG_ENTITIES',
          ]:
              if token not in v2:
                  raise SystemExit('owner lifetime source lost anchor: ' + token)

          def one(pattern, label):
              m = re.search(pattern, log)
              if not m:
                  raise SystemExit('missing ' + label)
              return m

          req = one(r'GATE_E_M1_NATIVE_JUMP_REQUESTED player_tick=(\d+)', 'jump request')
          air = one(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE player_tick=(\d+)[^\n]*delta_y=([-+0-9.eE]+)', 'airborne')
          if int(req.group(1)) != 45 or int(air.group(1)) != 45 or float(air.group(2)) <= 0.05:
              raise SystemExit('attempt3 jump evidence changed')

          acquisitions=[(int(t),int(c)) for t,c in re.findall(r'REFERENCE_OWNER_V2_ACQUIRE player_tick=(\d+) carriage_id=(\d+)',log)]
          prior=[x for x in acquisitions if x[0] <= 45]
          if not prior:
              raise SystemExit('missing pre-jump owner acquisition')
          refresh_tick, owner_id=max(prior)
          if (refresh_tick, owner_id) != (43,8):
              raise SystemExit(f'unexpected pre-jump refresh {(refresh_tick,owner_id)}')
          expiry_tick=refresh_tick+cap
          if expiry_tick != 68:
              raise SystemExit(f'unexpected derived expiry tick {expiry_tick}')

          suppress=[int(t) for t,o in re.findall(r'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_SUPPRESSED player_tick=(\d+)[^\n]*owner_id=(\d+)',log) if int(o)==owner_id]
          if not suppress or max(suppress) != 67:
              raise SystemExit(f'unexpected last owner authority tick {max(suppress) if suppress else None}')
          if re.search(r'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_SUPPRESSED player_tick=(68|69|70)\b',log):
              raise SystemExit('owner authority unexpectedly survives cap boundary')

          support_re=re.compile(
              r'GATE_E_PHASE131_SUPPORT_SOURCE player_tick=(\d+) carriage_id=8 physical_support=(true|false) '
              r'vertical_gap=([-+0-9.eE]+)[^\n]*local_feet=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+);')
          support={}
          for m in support_re.finditer(log):
              support[int(m.group(1))]=(m.group(2)=='true',float(m.group(3)),float(m.group(4)),float(m.group(5)),float(m.group(6)))
          for t in (67,68,69,70):
              if t not in support:
                  raise SystemExit(f'missing owner8 support row tick{t}')

          frame={}
          for t,x in re.findall(r'GATE_E_PHASE171_CARRIAGE_FRAME_STEP player_tick=(\d+) carriage_id=8 previous_player_tick=\d+ frame_step=\(([-+0-9.eE]+), 0\.0, 0\.0\)',log):
              t=int(t); x=float(x)
              if t not in frame or abs(x) > abs(frame[t]):
                  frame[t]=x
          for t in (68,69,70):
              if t not in frame:
                  raise SystemExit(f'missing carriage8 frame step tick{t}')

          x67=support[67][2]; x69=support[69][2]
          observed_lag=x67-x69
          missed_frame=frame[68]+frame[69]
          residual=abs(observed_lag-missed_frame)
          if observed_lag <= 0.25:
              raise SystemExit(f'pre-landing local lag not material: {observed_lag}')
          if residual > 1.0e-6:
              raise SystemExit(f'local lag does not match missed carriage frame residual={residual}')

          native70=one(r'GATE_E_PHASE170_NATIVE_CONTACT_APPLICATION player_tick=70 carriage_id=8 motion=\(([-+0-9.eE]+), 0\.0, 0\.0\) application_call=true source=ContraptionColliderClient', 'tick70 native contact')
          obb70=one(r'GATE_E_CREATE_COLLIDE_MANY_RESULT[^\n]*surface=true[^\n]*player_tick=70[^\n]*player_on_ground=true', 'tick70 Create OBB landing')
          ground70=one(r'GATE_E_CREATE_SET_ON_GROUND_SEAM player_tick=70[^\n]*requested_on_ground=true[^\n]*applied_on_ground=true', 'tick70 grounded seam')
          native_x=float(native70.group(1))
          if abs(native_x-frame[70]) > 1.0e-6:
              raise SystemExit(f'tick70 native contact does not match frame step native={native_x} frame={frame[70]}')
          if support[70][0]:
              raise SystemExit('Phase131 unexpectedly reports strict support at native landing')
          if not (0.05 < support[70][1] < 0.07):
              raise SystemExit(f'unexpected Phase131 landing gap {support[70][1]}')

          print('M1_NATURAL_LANDING_OWNER_CAP_LAG_PROOF classification=OWNER_CAP_EXPIRES_BEFORE_NATIVE_CREATE_LANDING_AND_CAUSES_EXACT_FRAME_RELATIVE_LAG'
                f' source_run=35062245886 source_attempt=3 source_head=cb03574bd11d39ba21ef07e18ddfe7fc87c714ce'
                f' artifact_id=10434807961 artifact_digest=sha256:ee7da59e8eebd01e017c023175e1845db04ed5ffd0dca8ab8d4720c98d4a236a'
                f' owner={owner_id} refresh_tick={refresh_tick} cap={cap} expiry_tick={expiry_tick} last_authority_tick=67'
                f' missed_frame_ticks=68,69 missed_frame_x={missed_frame:.9f} observed_owner_local_lag_x={observed_lag:.9f} residual={residual:.9f}'
                f' native_landing_tick=70 native_contact_x={native_x:.9f} phase131_gap={support[70][1]:.15f}'
                ' verifier_only=true production_unchanged=true harness_unchanged=true production_physics_green=false final_ready=false')
          PY

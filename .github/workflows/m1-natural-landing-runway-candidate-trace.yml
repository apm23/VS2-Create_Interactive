name: m1-natural-landing-runway-candidate-trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-natural-landing-runway-candidate-trace.yml'
      - 'scripts/prepare_vs2_26_2_natural_landing_runway_selection_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runway-candidate-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          grep -q 'nativeUpwardMotion = entity.deltaMovement.y > 1.0E-5' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt

      - name: Add read-only runway candidate trace
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_runway_selection_trace.py
          PROBE=upstream/fabric/src/main/kotlin/org/valkyrienskies/mod/fabric/common/GateDProbe.kt
          grep -q 'REFERENCE_OWNER_V2_RUNWAY_SELECTION_TRACE_COMPLETE' "$PROBE"
          grep -q 'source=level_allEntities_firstOrNull read_only=true' "$PROBE"
          grep -q 'val carriage = level.allEntities.firstOrNull' "$PROBE"

      - name: Compile traced fixture
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileKotlin :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-runway-candidate-trace
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-runway-candidate-trace

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Capture exact carriage candidates before fixture normalization
        working-directory: upstream
        timeout-minutes: 7
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-runway-candidate-trace.log
          XVFB_LOG=../reference-owner-v2-runway-candidate-trace-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-runway-candidate-trace' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          FOUND=0
          for i in $(seq 1 300); do
            if grep -q 'REFERENCE_OWNER_V2_RUNWAY_SELECTION_TRACE_COMPLETE' "$LOG"; then FOUND=1; break; fi
            if grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG"; then
              tail -260 "$LOG"
              exit 1
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              wait "$CLIENT_PID" || true
              tail -260 "$LOG"
              exit 1
            fi
            sleep 1
          done
          test "$FOUND" -eq 1
          grep 'REFERENCE_OWNER_V2_RUNWAY_SELECTION' "$LOG"
          grep 'REFERENCE_OWNER_V2_RUNWAY_CANDIDATE' "$LOG"
          python3 - "$LOG" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          header=re.search(r'REFERENCE_OWNER_V2_RUNWAY_SELECTION candidate_count=(\d+) current_first_id=(\d+)[^\n]*read_only=true',text)
          if not header: raise SystemExit('missing runway selection header')
          count=int(header.group(1)); first=int(header.group(2))
          rows=re.findall(r'REFERENCE_OWNER_V2_RUNWAY_CANDIDATE candidate_id=(\d+) uuid=([^ ]+) selected_by_current_first=(true|false) block_count=(-?\d+) local_bounds=([^ ]+) local_span=([^ ]+) nearest_world_top_d2=([^ ]+) geometry_state=([^ ]+)',text)
          if len(rows) != count: raise SystemExit(f'candidate row mismatch expected={count} got={len(rows)}')
          selected=[r for r in rows if r[2]=='true']
          if len(selected)!=1 or int(selected[0][0])!=first: raise SystemExit(f'invalid first selector rows={selected} first={first}')
          if count < 2: raise SystemExit(f'need multiple carriage candidates, got {count}')
          mapped=[r for r in rows if r[7]=='blocks_mapped' and int(r[3])>0]
          if len(mapped) < 2: raise SystemExit(f'insufficient mapped candidate geometry count={len(mapped)}')
          print('REFERENCE_OWNER_V2_RUNWAY_CANDIDATE_TRACE_PROOF conclusion=first_hit_selector_enumerated'
                f' candidate_count={count} current_first_id={first} mapped_candidates={len(mapped)}'
                ' selector_unchanged=true player_mutation=false train_mutation=false collision_mutation=false'
                ' production_physics_inference=false verifier_only=true final_ready=false')
          PY

      - name: Upload exact runway candidate trace
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reference-owner-v2-runway-candidate-trace-log
          path: |
            reference-owner-v2-runway-candidate-trace.log
            reference-owner-v2-runway-candidate-trace-xvfb.log
          if-no-files-found: warn

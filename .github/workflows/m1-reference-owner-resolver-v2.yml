name: m1-reference-owner-resolver-v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_vs2_26_2_reference_owner_v2.py'
      - '.github/workflows/m1-reference-owner-resolver-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-reference-owner-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Reconstruct M1 plus resolver v1 and v2
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2.py

      - name: Prove single external reference-owner core slice
        shell: python
        run: |
          from pathlib import Path

          root = Path('upstream')
          state = (root / 'common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDraggingInformation.kt').read_text(errors='replace')
          dragger = (root / 'common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt').read_text(errors='replace')
          resolver = (root / 'common/src/main/kotlin/org/valkyrienskies/mod/common/util/ExternalReferenceFrameResolver.kt').read_text(errors='replace')
          local_packet = (root / 'common/src/main/java/org/valkyrienskies/mod/mixin/feature/entity_movement_packets/MixinLocalPlayer.java').read_text(errors='replace')
          packet = (root / 'common/src/main/kotlin/org/valkyrienskies/mod/common/networking/PacketPlayerReferenceMotion.kt').read_text(errors='replace')
          network = (root / 'common/src/main/kotlin/org/valkyrienskies/mod/common/networking/VSGamePackets.kt').read_text(errors='replace')
          render = (root / 'common/src/main/java/org/valkyrienskies/mod/mixin/client/renderer/MixinGameRenderer.java').read_text(errors='replace')
          lerper = (root / 'common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityLerper.kt').read_text(errors='replace')
          probe = (root / 'fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java').read_text(errors='replace')
          collider = (root / 'fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinContraptionColliderClientTrace.java').read_text(errors='replace')

          checks = {
              'external_owner_has_bounded_lifetime': (
                  'ticksSinceExternalReferenceOwner' in state
                  and 'refreshExternalReferenceOwner' in state
                  and 'clearExternalReferenceOwner' in state
                  and 'groundedContactExpired' in dragger
              ),
              'selected_create_contact_acquires_owner': (
                  'REFERENCE_OWNER_V2_ACQUIRE' in probe
                  and 'phase83ExactBaselineCarriage' in probe
                  and 'phase81PhysicalSupport' in probe
                  and 'phase83RecentNativeApplication' in probe
                  and 'refreshExternalReferenceOwner(carriage.getId())' in probe
              ),
              'old_phase83_authority_removed': (
                  'GATE_E_PHASE83_CONTACT_REFRESH' not in probe
                  and 'EntityDragger.reanchorEntityWithExternalFrame' not in probe
              ),
              'old_phase205_authority_removed': (
                  'GATE_E_PHASE205_PRE_COLLISION_REANCHOR' not in collider
                  and 'GATE_E_PHASE205_DUPLICATE_CONTACT_CARRY_SUPPRESSED' not in collider
              ),
              'dedicated_non_ship_packet': (
                  'ownerEntityId: Int' in packet
                  and 'shipID' not in packet
                  and 'PacketPlayerReferenceMotion' in local_packet
              ),
              'local_packet_uses_same_owner_and_current_frame': (
                  'getExternalReferenceOwnerEntityId()' in local_packet
                  and 'ExternalReferenceFrameResolver.currentWorldToLocal' in local_packet
                  and 'yawToExternalReference' in local_packet
              ),
              'server_resolves_same_owner': (
                  'PacketPlayerReferenceMotion::class.registerServerHandler' in network
                  and 'motion.ownerEntityId' in network
                  and 'ExternalReferenceFrameResolver.currentLocalToWorld' in network
                  and 'yawFromExternalReference' in network
              ),
              'standing_render_uses_same_owner_prev_current': (
                  'isEntityBeingDraggedByExternalReference()' in render
                  and 'ExternalReferenceFrameResolver.previousWorldToLocal' in render
                  and 'ExternalReferenceFrameResolver.currentLocalToWorld' in render
              ),
              'yaw_is_transform_only': (
                  'yawToExternalReference' in lerper
                  and 'yawFromExternalReference' in lerper
                  and 'currentWorldYawToLocal' in resolver
                  and 'currentLocalYawToWorld' in resolver
              ),
              'no_fake_vs2_ship': (
                  'lastShipStoodOn = ownerEntityId' not in state
                  and 'shipObjectWorld.allShips.getById(ownerEntityId' not in resolver
                  and 'PacketPlayerReferenceMotion(val shipID' not in packet
              ),
          }
          for key, value in checks.items():
              print(f'REFERENCE_OWNER_V2_PROOF {key}={str(value).lower()}')
          missing = [k for k, v in checks.items() if not v]
          if missing:
              raise SystemExit('reference-owner v2 architecture proof failed: ' + ','.join(missing))

          for token in ['setDeltaMovement(', 'getContactPointMotion(', 'setNoGravity(', 'setOnGround(', 'setupWithShipMounted(']:
              if token in resolver:
                  raise SystemExit('resolver contains forbidden gameplay/camera API: ' + token)

          external_render_start = render.index('entityShouldBeHere == null && entityDraggingInformation.isEntityBeingDraggedByExternalReference')
          external_render_end = render.index('// Apply entityShouldBeHere', external_render_start)
          external_render = render[external_render_start:external_render_end]
          for token in ['setDeltaMovement(', 'setupWithShipMounted(', 'mainCamera', 'getContactPointMotion(']:
              if token in external_render:
                  raise SystemExit('external render branch contains forbidden camera/physics API: ' + token)

          print('REFERENCE_OWNER_V2_PROOF conclusion=single_owner_acquisition_packet_server_render_yaw_slice=true old_lease_reanchor_authority=false')

      - name: Compile Fabric with resolver v2
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :fabric:compileJava

      - name: Report v2 gate
        shell: bash
        run: |
          set -euo pipefail
          echo 'REFERENCE_OWNER_V2 compile_green=true runtime_user_gate_required=true final_ready=false'

name: m1-reference-owner-v2-airborne-drag-boundary-proof-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-airborne-drag-boundary-proof-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airborne-drag-boundary-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          grep -Fq 'vs2$applyExternalReferenceOwnerBeforeCreateCollision' upstream/common/src/main/java/org/valkyrienskies/mod/mixin/client/MixinMinecraft.java

      - name: Install read-only external-owner scheduler and transform telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('upstream/common/src/main/java/org/valkyrienskies/mod/mixin/client/MixinMinecraft.java')
          s=p.read_text(encoding='utf-8')

          entry_anchor='''        final LocalPlayer referencePlayer = Minecraft.getInstance().player;
        if (referencePlayer instanceof IEntityDraggingInformationProvider referenceProvider
            && referenceProvider.getDraggingInformation().isEntityBeingDraggedByExternalReference()) {'''
          if s.count(entry_anchor) != 1:
              raise SystemExit(f'expected one external-owner scheduler entry anchor, found {s.count(entry_anchor)}')
          entry_new='''        final LocalPlayer referencePlayer = Minecraft.getInstance().player;
        if (referencePlayer instanceof IEntityDraggingInformationProvider vs2$entryProvider) {
            System.out.println("REFERENCE_OWNER_V2_AIRBORNE_DRAG_ENTRY player_tick=" + referencePlayer.tickCount
                + " owner_id=" + vs2$entryProvider.getDraggingInformation().getExternalReferenceOwnerEntityId()
                + " owner_age=" + vs2$entryProvider.getDraggingInformation().getTicksSinceExternalReferenceOwner()
                + " active=" + vs2$entryProvider.getDraggingInformation().isEntityBeingDraggedByExternalReference()
                + " world=(" + referencePlayer.getX() + "," + referencePlayer.getY() + "," + referencePlayer.getZ() + ")"
                + " read_only=true");
        }
        if (referencePlayer instanceof IEntityDraggingInformationProvider referenceProvider
            && referenceProvider.getDraggingInformation().isEntityBeingDraggedByExternalReference()) {'''
          s=s.replace(entry_anchor,entry_new,1)

          call_re=re.compile(
              r'(?m)^[ \t]*EntityDragger\.INSTANCE\.dragEntitiesWithShips\(\s*'
              r'java\.util\.Collections\.singletonList\(referencePlayer\),\s*false\s*\);'
          )
          matches=list(call_re.finditer(s))
          if len(matches) != 1:
              raise SystemExit(f'expected one external-owner singleton drag call, found {len(matches)}')
          m=matches[0]
          new='''            final Integer vs2$traceOwnerId = referenceProvider.getDraggingInformation().getExternalReferenceOwnerEntityId();
            final int vs2$traceOwnerAge = referenceProvider.getDraggingInformation().getTicksSinceExternalReferenceOwner();
            final org.joml.Vector3d vs2$traceBefore = new org.joml.Vector3d(
                referencePlayer.getX(), referencePlayer.getY(), referencePlayer.getZ());
            final org.joml.Vector3d vs2$tracePreviousLocal = vs2$traceOwnerId == null ? null :
                org.valkyrienskies.mod.common.util.ExternalReferenceFrameResolver.previousWorldToLocal(
                    level, vs2$traceOwnerId, vs2$traceBefore);
            final org.joml.Vector3d vs2$traceExpected =
                vs2$traceOwnerId == null || vs2$tracePreviousLocal == null ? null :
                org.valkyrienskies.mod.common.util.ExternalReferenceFrameResolver.currentLocalToWorld(
                    level, vs2$traceOwnerId, vs2$tracePreviousLocal);
            final double vs2$expectedX = vs2$traceExpected == null ? Double.NaN : vs2$traceExpected.x;
            final double vs2$expectedY = vs2$traceExpected == null ? Double.NaN : vs2$traceExpected.y;
            final double vs2$expectedZ = vs2$traceExpected == null ? Double.NaN : vs2$traceExpected.z;
            System.out.println("REFERENCE_OWNER_V2_AIRBORNE_DRAG_PRE player_tick=" + referencePlayer.tickCount
                + " owner_id=" + vs2$traceOwnerId + " owner_age=" + vs2$traceOwnerAge
                + " before=(" + vs2$traceBefore.x + "," + vs2$traceBefore.y + "," + vs2$traceBefore.z + ")"
                + " expected=(" + vs2$expectedX + "," + vs2$expectedY + "," + vs2$expectedZ + ")"
                + " read_only=true");
            EntityDragger.INSTANCE.dragEntitiesWithShips(
                java.util.Collections.singletonList(referencePlayer),
                false
            );
            final org.joml.Vector3d vs2$traceAfter = new org.joml.Vector3d(
                referencePlayer.getX(), referencePlayer.getY(), referencePlayer.getZ());
            final org.joml.Vector3d vs2$traceActualDelta = new org.joml.Vector3d(vs2$traceAfter).sub(vs2$traceBefore);
            final double vs2$expectedDx = Double.isNaN(vs2$expectedX) ? Double.NaN : vs2$expectedX - vs2$traceBefore.x;
            final double vs2$expectedDy = Double.isNaN(vs2$expectedY) ? Double.NaN : vs2$expectedY - vs2$traceBefore.y;
            final double vs2$expectedDz = Double.isNaN(vs2$expectedZ) ? Double.NaN : vs2$expectedZ - vs2$traceBefore.z;
            System.out.println("REFERENCE_OWNER_V2_AIRBORNE_DRAG_POST player_tick=" + referencePlayer.tickCount
                + " owner_id=" + vs2$traceOwnerId + " owner_age=" + vs2$traceOwnerAge
                + " after=(" + vs2$traceAfter.x + "," + vs2$traceAfter.y + "," + vs2$traceAfter.z + ")"
                + " actual_delta=(" + vs2$traceActualDelta.x + "," + vs2$traceActualDelta.y + "," + vs2$traceActualDelta.z + ")"
                + " expected_delta=(" + vs2$expectedDx + "," + vs2$expectedDy + "," + vs2$expectedDz + ")"
                + " read_only=true");'''
          for token in ['setPos(', 'setDeltaMovement(', 'teleportTo(', 'setNoGravity(', 'setOnGround(', 'getContactPointMotion(']:
              if token in entry_new + new:
                  raise SystemExit('read-only telemetry introduced forbidden mutation token: '+token)
          s=s[:m.start()]+new+s[m.end():]
          p.write_text(s,encoding='utf-8')
          print('REFERENCE_OWNER_V2_AIRBORNE_DRAG_BOUNDARY_V2_INSTRUMENTATION read_only=true gameplay_mutation=false')
          PY

      - name: Narrow fixture jump admission to fresh proven support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.java')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'    @Unique\n    private boolean vs2\$jumpArmReady\(LocalPlayer self\) \{.*?\n    \}', re.S)
          m=pattern.search(s)
          if not m:
              raise SystemExit('could not locate jumpArmReady fixture method')
          old=m.group(0)
          if 'vs2.productionFixtureJumpFloorSupportNow' not in old or 'vs2.phase170NativeContactApplicationTick' not in old:
              raise SystemExit('unexpected jump admission boundary')
          new="\n".join([
              '    @Unique',
              '    private boolean vs2$jumpArmReady(LocalPlayer self) {',
              '        if (vs2$jumpStartTick != Integer.MIN_VALUE) return !vs2$jumpLandedLogged;',
              '        if (!vs2$fixtureWalkSeen(self) || !self.onGround()) return false;',
              '        if (!Boolean.getBoolean("vs2.productionFixtureJumpFloorSupportNow")) return false;',
              '        String floorTickRaw = System.getProperty("vs2.productionFixtureJumpFloorSupportTick");',
              '        String nativeTickRaw = System.getProperty("vs2.phase170NativeContactApplicationTick");',
              '        if (floorTickRaw == null || nativeTickRaw == null) return false;',
              '        try {',
              '            int floorTick = Integer.parseInt(floorTickRaw);',
              '            int nativeTick = Integer.parseInt(nativeTickRaw);',
              '            boolean floorFresh = floorTick == self.tickCount || floorTick == self.tickCount - 1;',
              '            boolean nativeFresh = nativeTick == self.tickCount || nativeTick == self.tickCount - 1;',
              '            return floorFresh && nativeFresh;',
              '        } catch (NumberFormatException ignored) {',
              '            return false;',
              '        }',
              '    }',
          ])
          for token in ['setPos(', 'setDeltaMovement(', '.move(', '.teleport(', 'setVelocity(', 'cir.setReturnValue(']:
              if token in new:
                  raise SystemExit('fixture admission introduced forbidden movement mutation: '+token)
          p.write_text(s[:m.start()]+new+s[m.end():],encoding='utf-8')
          print('REFERENCE_OWNER_V2_AIRBORNE_DRAG_BOUNDARY_V2_FIXTURE fixture_only=true gameplay_physics_mutation=false')
          PY

      - name: Compile exact composition plus read-only telemetry
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-airborne-drag-boundary-v2
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-airborne-drag-boundary-v2

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove scheduler and transform boundary at reproduced jump
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-airborne-drag-boundary-v2.log
          XVFB_LOG=../reference-owner-v2-airborne-drag-boundary-v2-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-airborne-drag-boundary-v2' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }
          READY=0
          for i in $(seq 1 700); do
            if grep -q 'GATE_E_M1_NATIVE_JUMP_REQUESTED' "$LOG" \
              && grep -Eq 'REFERENCE_OWNER_V2_AIRBORNE_DRAG_ENTRY player_tick=(34|35)' "$LOG"; then
              READY=1; break
            fi
            if fatal_state; then tail -320 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -320 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 2

          python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          num=r'([-+0-9.eE]+|NaN)'
          entry_re=re.compile(r'REFERENCE_OWNER_V2_AIRBORNE_DRAG_ENTRY player_tick=(\d+) owner_id=(\d+|null) owner_age=(\d+) active=(true|false)')
          post_re=re.compile(
              r'REFERENCE_OWNER_V2_AIRBORNE_DRAG_POST player_tick=(\d+) owner_id=(\d+|null) owner_age=(\d+) '
              r'after=\('+num+r','+num+r','+num+r'\) actual_delta=\('+num+r','+num+r','+num+r'\) '
              r'expected_delta=\('+num+r','+num+r','+num+r'\)')
          entries={}
          posts={}
          for line in text.splitlines():
            m=entry_re.search(line)
            if m:
              entries[int(m.group(1))]=(m.group(2),int(m.group(3)),m.group(4)=='true')
            m=post_re.search(line)
            if m:
              tick=int(m.group(1)); owner=m.group(2); age=int(m.group(3))
              actual=tuple(float(x) for x in m.group(7,8,9))
              expected=tuple(float(x) for x in m.group(10,11,12))
              posts[tick]=(owner,age,actual,expected)

          focus=34 if 34 in entries else (35 if 35 in entries else None)
          if focus is None:
            classification='EXTERNAL_OWNER_SCHEDULER_ENTRY_MISSING_AT_TURN'
          else:
            owner,age,active=entries[focus]
            if not active:
              classification='EXTERNAL_OWNER_LIFECYCLE_DROPPED_AT_TURN'
            elif focus not in posts:
              classification='EXTERNAL_OWNER_ACTIVE_BUT_DRAG_CALL_MISSED_AT_TURN'
            else:
              _,_,actual,expected=posts[focus]
              amag=math.sqrt(sum(x*x for x in actual))
              if any(math.isnan(x) for x in expected):
                classification='EXTERNAL_OWNER_EXPECTED_TRANSFORM_UNRESOLVED_AT_TURN'
              else:
                emag=math.sqrt(sum(x*x for x in expected))
                err=math.sqrt(sum((a-e)*(a-e) for a,e in zip(actual,expected)))
                if emag > 5.0 and err <= 1.0:
                  classification='EXTERNAL_OWNER_DRAG_APPLIED_OWNER_TRANSFORM_DISCONTINUITY'
                elif emag > 5.0 and amag < 1.0:
                  classification='EXTERNAL_OWNER_DRAG_CALL_EXECUTED_BUT_BODY_STEP_MISSED'
                elif emag <= 1.0 and amag > 5.0:
                  classification='EXTERNAL_OWNER_DRAG_APPLIED_UNEXPECTED_BODY_DISPLACEMENT'
                elif err > 1.0:
                  classification='EXTERNAL_OWNER_DRAG_APPLIED_BUT_DIVERGES_FROM_OWNER_TRANSFORM'
                else:
                  classification='EXTERNAL_OWNER_DRAG_CONTINUOUS_BOUNDARY_NOT_REPRODUCED'
          candidates=[(int(t),int(c)) for t,c in re.findall(r'GATE_E_CARRIAGE_LOCAL_CONTINUITY[^\n]*player_tick=(3[2-5])[^\n]*carriage_id=(\d+)',text)]
          print('REFERENCE_OWNER_V2_AIRBORNE_DRAG_BOUNDARY_V2_PROOF '
                f'classification={classification} focus_tick={focus} entry_ticks={sorted(entries)} post_ticks={sorted(posts)} candidate_rows={candidates[:20]} '
                'source_run=35042299917 production_unchanged=true read_only=true final_ready=false')
          for tick in sorted(set(entries)|set(posts)):
            if 31 <= tick <= 36:
              print(f'REFERENCE_OWNER_V2_AIRBORNE_DRAG_BOUNDARY_V2_ROW tick={tick} entry={entries.get(tick)} post={posts.get(tick)}')
          if classification in {
              'EXTERNAL_OWNER_SCHEDULER_ENTRY_MISSING_AT_TURN',
              'EXTERNAL_OWNER_EXPECTED_TRANSFORM_UNRESOLVED_AT_TURN'
          }:
              raise SystemExit('airborne drag boundary unresolved: '+classification)
          PY
          grep -E 'GATE_E_M1_NATIVE_JUMP_(REQUESTED|AIRBORNE)|REFERENCE_OWNER_V2_AIRBORNE_DRAG_(ENTRY|PRE|POST)|GATE_E_CARRIAGE_LOCAL_CONTINUITY' "$LOG" | tail -300 || true

      - name: Upload airborne drag boundary v2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-airborne-drag-boundary-v2-log
          path: |
            reference-owner-v2-airborne-drag-boundary-v2.log
            reference-owner-v2-airborne-drag-boundary-v2-xvfb.log
          if-no-files-found: warn

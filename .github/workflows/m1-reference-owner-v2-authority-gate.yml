name: m1-reference-owner-v2-authority-gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-authority-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-body-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V2 plus scheduler and authority arbitration
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

          MIXIN=upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinExternalReferenceOwnerCreateCarry.java
          test -f "$MIXIN"
          grep -q 'ordinal = 1' "$MIXIN"
          grep -q 'ownerEntityId.intValue() == carriageEntity.getId()' "$MIXIN"
          grep -q 'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_SUPPRESSED' "$MIXIN"
          ! grep -q 'reanchorEntityWithExternalFrame' "$MIXIN"

      - name: Add read-only VS2 body telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt')
          s = p.read_text(encoding='utf-8')
          needle = 'addedMovement = currentWorld.sub(entityReferencePos, Vector3d())'
          if s.count(needle) != 1:
              raise SystemExit(f'authority gate expected one external-owner addedMovement token, found {s.count(needle)}')
          insert = '''addedMovement = currentWorld.sub(entityReferencePos, Vector3d())
                        if (entity.level().isClientSide && entity.javaClass.simpleName == "LocalPlayer") {
                            println(
                                "REFERENCE_OWNER_V2_AUTHORITY_BODY player_tick=${entity.tickCount} pre_tick=$preTick " +
                                "owner=$externalReferenceOwnerEntityId age=${entityDraggingInformation.ticksSinceExternalReferenceOwner} " +
                                "added_x=${addedMovement.x()} added_y=${addedMovement.y()} added_z=${addedMovement.z()}"
                            )
                        }'''
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          print('AUTHORITY_GATE instrumentation=read_only body_mutation=false')
          PY

      - name: Compile authority hypothesis
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-authority-gate
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-authority-gate

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove one body carry writer for exact external owner
        working-directory: upstream
        timeout-minutes: 10
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-authority-gate.log
          XVFB_LOG=../reference-owner-v2-authority-gate-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-authority-gate' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          READY=0
          for i in $(seq 1 360); do
            if grep -q 'GATE_D_TRAIN_MOVED' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_AUTHORITY_BODY' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_SUPPRESSED' "$LOG"; then
              READY=1
              break
            fi
            if fatal_state; then tail -320 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -320 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 1

          python3 - "$LOG" <<'PY'
          import math, re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          lines = text.splitlines()
          body_re = re.compile(r'REFERENCE_OWNER_V2_AUTHORITY_BODY player_tick=(\d+).*?owner=(\d+).*?added_x=([-+0-9.eE]+).*?added_y=([-+0-9.eE]+).*?added_z=([-+0-9.eE]+)')
          suppress_re = re.compile(r'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_SUPPRESSED player_tick=(\d+) carriage_id=(\d+) owner_id=(\d+).*?requested_delta=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)')
          bodies = [(int(m.group(1)), int(m.group(2)), float(m.group(3)), float(m.group(4)), float(m.group(5))) for line in lines if (m := body_re.search(line))]
          suppress = [(int(m.group(1)), int(m.group(2)), int(m.group(3)), float(m.group(4)), float(m.group(5)), float(m.group(6))) for line in lines if (m := suppress_re.search(line))]
          if not bodies or not suppress:
              raise SystemExit('missing authority body/suppression telemetry')
          body_ticks = {(t, owner) for t, owner, *_ in bodies}
          exact = [row for row in suppress if (row[0], row[1]) in body_ticks and row[1] == row[2]]
          if not exact:
              raise SystemExit('no same-tick exact-owner body/suppression pair')

          material_duplicate_ticks = set()
          zero_motion_ticks = set()
          max_passthrough_horizontal = 0.0
          setpos_re = re.compile(r'GATE_E_LOCALPLAYER_SET_POS[^\n]*player_tick=(\d+).*?delta=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)')
          for line in lines:
              if 'GATE_E_LOCALPLAYER_SET_POS' not in line or 'ContraptionColliderClient#collideEntities:330' not in line:
                  continue
              m = setpos_re.search(line)
              if not m:
                  continue
              tick = int(m.group(1))
              dx, dy, dz = (float(m.group(2)), float(m.group(3)), float(m.group(4)))
              horizontal = math.hypot(dx, dz)
              max_passthrough_horizontal = max(max_passthrough_horizontal, horizontal)
              if horizontal > 1.0e-8:
                  material_duplicate_ticks.add(tick)
              else:
                  zero_motion_ticks.add(tick)
          paired_ticks = {row[0] for row in exact}
          overlap = sorted(paired_ticks & material_duplicate_ticks)
          if overlap:
              raise SystemExit(f'material Create second contact-carry displacement still present on VS2 body ticks: {overlap}')

          max_body = max(math.sqrt(x*x+y*y+z*z) for _,_,x,y,z in bodies)
          max_requested = max(math.sqrt(x*x+y*y+z*z) for *_,x,y,z in suppress)
          paired_zero_motion = sorted(paired_ticks & zero_motion_ticks)
          print(f'AUTHORITY_GATE body_count={len(bodies)} suppression_count={len(suppress)} exact_pairs={len(exact)} paired_ticks={sorted(paired_ticks)} material_duplicate_overlap={overlap} paired_zero_motion_calls={paired_zero_motion}')
          print(f'AUTHORITY_GATE max_vs2_body_delta={max_body:.6f} max_suppressed_create_delta={max_requested:.6f} max_line330_passthrough_horizontal={max_passthrough_horizontal:.6f}')
          print('AUTHORITY_GATE conclusion=single_external_reference_body_writer_proven_on_real_train collision_response_preserved=true zero_motion_invocation_is_not_movement_authority=true')
          PY

          grep -E 'REFERENCE_OWNER_V2_(ACQUIRE|AUTHORITY_BODY|CREATE_CONTACT_CARRY_SUPPRESSED)|GATE_E_LOCALPLAYER_SET_POS|GATE_D_TRAIN_MOVED' "$LOG" | tail -220 || true

      - name: Upload authority proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-authority-gate-log
          path: |
            reference-owner-v2-authority-gate.log
            reference-owner-v2-authority-gate-xvfb.log
          if-no-files-found: warn

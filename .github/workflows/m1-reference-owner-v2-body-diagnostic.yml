name: m1-reference-owner-v2-body-diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-body-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  body-reference-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V2 source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py

      - name: Add read-only body-frame telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt')
          s = p.read_text(encoding='utf-8')
          needle = 'addedMovement = currentWorld.sub(entityReferencePos, Vector3d())'
          if s.count(needle) != 1:
              raise SystemExit(f'body diagnostic expected one V2 addedMovement token, found {s.count(needle)}')
          insert = '''addedMovement = currentWorld.sub(entityReferencePos, Vector3d())
                        if (entity.level().isClientSide && entity.javaClass.simpleName == "LocalPlayer" && entity.tickCount >= 15 && entity.tickCount <= 60) {
                            val ownerEntity = ExternalReferenceFrameResolver.resolveOwner(entity.level(), externalReferenceOwnerEntityId)
                            val currentLocal = ExternalReferenceFrameResolver.currentWorldToLocal(
                                entity.level(), externalReferenceOwnerEntityId, entityReferencePos
                            )
                            val currentRoundTrip = currentLocal?.let {
                                ExternalReferenceFrameResolver.currentLocalToWorld(
                                    entity.level(), externalReferenceOwnerEntityId, it
                                )
                            }
                            println(
                                "REFERENCE_OWNER_V2_BODY_TRACE player_tick=${entity.tickCount} pre_tick=$preTick " +
                                "owner=$externalReferenceOwnerEntityId age=${entityDraggingInformation.ticksSinceExternalReferenceOwner} " +
                                "on_ground=${entity.onGround()} pos=${entity.position()} old=(${entity.xo},${entity.yo},${entity.zo}) " +
                                "reference=$entityReferencePos prev_local=$localPosition current_world=$currentWorld " +
                                "added_x=${addedMovement.x()} added_y=${addedMovement.y()} added_z=${addedMovement.z()} " +
                                "current_local=$currentLocal current_roundtrip=$currentRoundTrip " +
                                "owner_pos=${ownerEntity?.position()} owner_old=(${ownerEntity?.xo},${ownerEntity?.yo},${ownerEntity?.zo})"
                            )
                        }'''
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          print('BODY_DIAGNOSTIC instrumentation=read_only owner_transform_mutation=false robust_token_anchor=true')
          PY
          grep -q 'REFERENCE_OWNER_V2_BODY_TRACE' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-body-diagnostic
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-body-diagnostic

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Capture grounded-to-airborne body timing
        working-directory: upstream
        timeout-minutes: 10
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-body-diagnostic.log
          XVFB_LOG=../reference-owner-v2-body-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-body-diagnostic' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          LANDED=0
          for i in $(seq 1 360); do
            grep -q 'GATE_E_M1_NATIVE_JUMP_LANDED' "$LOG" && LANDED=1 || true
            if [ "$LANDED" -eq 1 ]; then break; fi
            if fatal_state; then tail -300 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -300 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$LANDED" -eq 1
          sleep 2

          python3 - "$LOG" <<'PY'
          import math, re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          airborne = re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)', text)
          landed = re.search(r'GATE_E_M1_NATIVE_JUMP_LANDED[^\n]*player_tick=(\d+)', text)
          if not airborne or not landed:
              raise SystemExit('missing jump interval')
          a, l = int(airborne.group(1)), int(landed.group(1))
          body = [line for line in text.splitlines() if 'REFERENCE_OWNER_V2_BODY_TRACE' in line]
          create_carry = [
              line for line in text.splitlines()
              if 'GATE_E_LOCALPLAYER_SET_POS' in line and 'ContraptionColliderClient#collideEntities' in line
          ]
          acquire = [line for line in text.splitlines() if 'REFERENCE_OWNER_V2_ACQUIRE' in line]
          print(
              f'BODY_DIAGNOSTIC jump_interval={a}-{l} body_trace_count={len(body)} '
              f'create_collide_setpos_count={len(create_carry)} acquire_count={len(acquire)}'
          )
          if not body:
              print('BODY_DIAGNOSTIC external_owner_body_branch_invoked=false')
              print('BODY_DIAGNOSTIC conclusion=external_owner_state_acquired_but_entitydragger_body_branch_not_observed read_only=true gameplay_mutation=false')
              sys.exit(0)

          trace_re = re.compile(
              r'REFERENCE_OWNER_V2_BODY_TRACE player_tick=(\d+) pre_tick=(true|false).*?'
              r'added_x=([-+0-9.eE]+) added_y=([-+0-9.eE]+) added_z=([-+0-9.eE]+)'
          )
          rows = []
          for m in trace_re.finditer(text):
              tick = int(m.group(1))
              if a - 3 <= tick <= l + 1:
                  rows.append((tick, m.group(2), *(float(m.group(i)) for i in range(3, 6))))
          if not rows:
              print('BODY_DIAGNOSTIC external_owner_body_branch_invoked=true rows_near_jump=false')
              print('BODY_DIAGNOSTIC conclusion=body_branch_timing_does_not_cover_jump_interval read_only=true gameplay_mutation=false')
              sys.exit(0)
          pre = [r for r in rows if r[1] == 'true']
          post = [r for r in rows if r[1] == 'false']
          max_pre = max((math.sqrt(x*x+y*y+z*z) for _,_,x,y,z in pre), default=0.0)
          max_post = max((math.sqrt(x*x+y*y+z*z) for _,_,x,y,z in post), default=0.0)
          print(
              f'BODY_DIAGNOSTIC external_owner_body_branch_invoked=true rows={len(rows)} '
              f'pre_rows={len(pre)} post_rows={len(post)} max_pre_added={max_pre:.6f} max_post_added={max_post:.6f}'
          )
          for row in rows:
              print('BODY_DIAGNOSTIC_ROW', row)
          print('BODY_DIAGNOSTIC conclusion=body_branch_timing_trace_complete read_only=true gameplay_mutation=false')
          PY

          grep -E 'REFERENCE_OWNER_V2_BODY_TRACE|REFERENCE_OWNER_V2_ACQUIRE|GATE_E_M1_NATIVE_JUMP_(REQUESTED|AIRBORNE|LANDED)|GATE_E_LOCALPLAYER_SET_POS|GATE_E_CARRIAGE_LOCAL_CONTINUITY' "$LOG" | tail -320 || true

      - name: Upload body diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-body-diagnostic-log
          path: |
            reference-owner-v2-body-diagnostic.log
            reference-owner-v2-body-xvfb.log
          if-no-files-found: warn

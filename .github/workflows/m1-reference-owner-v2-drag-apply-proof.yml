name: m1-reference-owner-v2-drag-apply-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-drag-apply-proof.yml'
      - 'scripts/prepare_vs2_26_2_reference_owner_v2_drag_apply_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drag-apply-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact production plus read-only drag-apply trace
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_drag_apply_trace.py
          grep -Fq 'REFERENCE_OWNER_V2_DRAG_APPLY_POST' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt

      - name: Narrow fixture jump admission to fresh native support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.java')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'    @Unique\n    private boolean vs2\$jumpArmReady\(LocalPlayer self\) \{.*?\n    \}', re.S)
          m=pattern.search(s)
          if not m:
              raise SystemExit('could not locate jumpArmReady fixture method')
          old=m.group(0)
          if 'vs2.productionFixtureJumpFloorSupportNow' not in old or 'vs2.phase170NativeContactApplicationTick' not in old:
              raise SystemExit('unexpected jump admission boundary')
          new="\n".join([
              '    @Unique',
              '    private boolean vs2$jumpArmReady(LocalPlayer self) {',
              '        if (vs2$jumpStartTick != Integer.MIN_VALUE) return !vs2$jumpLandedLogged;',
              '        if (!vs2$fixtureWalkSeen(self) || !self.onGround()) return false;',
              '        if (!Boolean.getBoolean("vs2.productionFixtureJumpFloorSupportNow")) return false;',
              '        String floorTickRaw = System.getProperty("vs2.productionFixtureJumpFloorSupportTick");',
              '        String nativeTickRaw = System.getProperty("vs2.phase170NativeContactApplicationTick");',
              '        if (floorTickRaw == null || nativeTickRaw == null) return false;',
              '        try {',
              '            int floorTick = Integer.parseInt(floorTickRaw);',
              '            int nativeTick = Integer.parseInt(nativeTickRaw);',
              '            boolean floorFresh = floorTick == self.tickCount || floorTick == self.tickCount - 1;',
              '            boolean nativeFresh = nativeTick == self.tickCount || nativeTick == self.tickCount - 1;',
              '            return floorFresh && nativeFresh;',
              '        } catch (NumberFormatException ignored) {',
              '            return false;',
              '        }',
              '    }',
          ])
          for forbidden in ['setPos(', 'setDeltaMovement(', '.move(', '.teleport(', 'setVelocity(', 'cir.setReturnValue(']:
              if forbidden in new:
                  raise SystemExit('fixture admission introduced forbidden movement mutation: '+forbidden)
          p.write_text(s[:m.start()]+new+s[m.end():],encoding='utf-8')
          print('REFERENCE_OWNER_V2_DRAG_APPLY_FIXTURE fixture_only=true gameplay_physics_mutation=false')
          PY

      - name: Compile exact composition plus trace
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-drag-apply-proof
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-drag-apply-proof

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove external-owner calculated step reaches VS2 body writer
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-drag-apply-proof.log
          XVFB_LOG=../reference-owner-v2-drag-apply-proof-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-drag-apply-proof' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }
          READY=0
          for i in $(seq 1 700); do
            if grep -q 'GATE_E_M1_NATIVE_JUMP_REQUESTED' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_DRAG_APPLY_POST' "$LOG"; then
              sleep 4
              READY=1
              break
            fi
            if fatal_state; then tail -320 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -320 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1

          python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          num=r'([-+0-9.eE]+)'
          pre_re=re.compile(
              r'REFERENCE_OWNER_V2_DRAG_APPLY_PRE player_tick=(\d+) pre_tick=(true|false) drag=(true|false) movement_nonnull=(true|false)'
              r' movement_x='+num+r' movement_y='+num+r' movement_z='+num+
              r' pos_x='+num+r' pos_y='+num+r' pos_z='+num+r' on_ground=(true|false) read_only=true')
          post_re=re.compile(
              r'REFERENCE_OWNER_V2_DRAG_APPLY_POST player_tick=(\d+) pre_tick=(true|false)'
              r' movement_x='+num+r' movement_y='+num+r' movement_z='+num+
              r' pos_x='+num+r' pos_y='+num+r' pos_z='+num+r' on_ground=(true|false) read_only=true')
          events=[]
          for m in pre_re.finditer(text):
              events.append((m.start(),'pre',m))
          for m in post_re.finditer(text):
              events.append((m.start(),'post',m))
          events.sort(key=lambda x:x[0])
          pending={}
          pairs=[]
          for _,kind,m in events:
              tick=int(m.group(1)); pre_tick=m.group(2)
              key=(tick,pre_tick)
              if kind=='pre':
                  vals=[float(m.group(i)) for i in range(5,11)]
                  pending.setdefault(key,[]).append((vals,m.group(11)))
              else:
                  vals=[float(m.group(i)) for i in range(3,9)]
                  q=pending.get(key,[])
                  if q:
                      pv,pre_ground=q.pop(0)
                      mv=pv[0:3]; p0=pv[3:6]; p1=vals[3:6]
                      actual=[p1[i]-p0[i] for i in range(3)]
                      residual=math.sqrt(sum((actual[i]-mv[i])**2 for i in range(3)))
                      mag=math.sqrt(sum(v*v for v in mv))
                      pairs.append((tick,pre_tick,pre_ground,mag,residual))
          airborne=[p for p in pairs if p[2]=='false' and p[3] > 1e-4]
          missed=0
          for key,items in pending.items():
              for pv,ground in items:
                  mag=math.sqrt(sum(v*v for v in pv[:3]))
                  if ground=='false' and mag>1e-4:
                      missed += 1
          if missed:
              classification='EXTERNAL_OWNER_BODY_WRITER_MISSES_CALCULATED_STEP'
          elif airborne and max(p[4] for p in airborne) <= 1e-6:
              classification='EXTERNAL_OWNER_BODY_WRITER_APPLIES_CALCULATED_STEP'
          elif airborne:
              classification='EXTERNAL_OWNER_BODY_WRITER_DIVERGES_FROM_CALCULATED_STEP'
          else:
              classification='EXTERNAL_OWNER_BODY_WRITER_RUNTIME_UNRESOLVED'
          max_res=max((p[4] for p in airborne),default=float('nan'))
          max_mag=max((p[3] for p in airborne),default=float('nan'))
          print('REFERENCE_OWNER_V2_DRAG_APPLY_PROOF classification='+classification+
                ' pairs='+str(len(pairs))+' airborne_material_pairs='+str(len(airborne))+
                ' missed_airborne_material='+str(missed)+
                ' max_airborne_movement='+str(max_mag)+' max_writer_residual='+str(max_res)+
                ' read_only=true gameplay_mutation=false final_ready=false')
          for p in airborne[-12:]:
              print('REFERENCE_OWNER_V2_DRAG_APPLY_PAIR tick=%d pre_tick=%s movement_mag=%.9f residual=%.12f' %
                    (p[0],p[1],p[3],p[4]))
          if classification=='EXTERNAL_OWNER_BODY_WRITER_RUNTIME_UNRESOLVED':
              raise SystemExit(1)
          PY

      - name: Upload drag-apply proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-drag-apply-proof-log
          path: |
            reference-owner-v2-drag-apply-proof.log
            reference-owner-v2-drag-apply-proof-xvfb.log
          if-no-files-found: warn

name: m1-reference-owner-v2-lifecycle-authority-trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-lifecycle-authority-trace.yml'
      - 'scripts/prepare_vs2_26_2_reference_owner_v2_lifecycle_authority_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-authority-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5
      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compose production plus read-only lifecycle trace
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_lifecycle_authority_trace.py
          grep -q 'REFERENCE_OWNER_V2_LIFECYCLE_TRACE' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt
          grep -q 'REFERENCE_OWNER_V2_AUTHORITY_STATE' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinExternalReferenceOwnerCreateCarry.java
      - name: Compile exact composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava
      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture upstream/fabric/run/saves/train-v2-lifecycle-authority-trace
          mkdir -p world-fixture upstream/fabric/run/saves
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-lifecycle-authority-trace
      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Trace lifecycle clear into Create carry writer
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-lifecycle-authority-trace.log
          XVFB_LOG=../reference-owner-v2-lifecycle-authority-trace-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-lifecycle-authority-trace' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() { kill "$CLIENT_PID" "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 900); do
            if grep -q 'GATE_E_M1_NATIVE_JUMP_AIRBORNE' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_LIFECYCLE_TRACE.*will_clear=true' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_AUTHORITY_STATE.*active_external_owner=false' "$LOG" \
              && grep -q 'GATE_E_LOCALPLAYER_SET_POS.*singleReferenceOwnerCarryWriter' "$LOG"; then READY=1; break; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -300 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 2
          python3 - "$LOG" <<'PY'
          import re,sys,math
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          jump=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          if not jump: raise SystemExit('missing airborne jump')
          jt=int(jump.group(1))
          life=[]
          for m in re.finditer(r'REFERENCE_OWNER_V2_LIFECYCLE_TRACE entity_tick=(\d+) owner_id=(\d+) age=(\d+) on_ground=(true|false) delta_y=([-+0-9.eE]+) upward=(true|false) owner_resolvable=(true|false) grounded_expired=(true|false) owner_expired=(true|false) will_clear=(true|false)',text):
            life.append((int(m.group(1)),int(m.group(2)),int(m.group(3)),m.group(4)=='true',float(m.group(5)),m.group(6)=='true',m.group(7)=='true',m.group(8)=='true',m.group(9)=='true',m.group(10)=='true'))
          clears=[x for x in life if x[0]>=jt and x[-1]]
          if not clears: raise SystemExit('no lifecycle clear after jump')
          clear=clears[0]; ct,owner=clear[0],clear[1]
          if not (clear[3] and not clear[5] and clear[6] and clear[7] and not clear[8]):
            raise SystemExit('first clear is not false-grounded grounded-expiry-only')
          authority=[]
          for m in re.finditer(r'REFERENCE_OWNER_V2_AUTHORITY_STATE player_tick=(\d+) carriage_id=(\d+) owner_id=([^ ]+) owner_age=(\d+) active_external_owner=(true|false) requested_delta=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)',text):
            authority.append((int(m.group(1)),int(m.group(2)),m.group(3),int(m.group(4)),m.group(5)=='true',float(m.group(6)),float(m.group(7)),float(m.group(8))))
          leaked=[x for x in authority if x[0]==ct and not x[4] and math.sqrt(x[5]**2+x[6]**2+x[7]**2)>0.75]
          if not leaked: raise SystemExit('no material inactive-authority carry on lifecycle clear tick')
          writers=[]
          for line in text.splitlines():
            if 'GATE_E_LOCALPLAYER_SET_POS' not in line or 'singleReferenceOwnerCarryWriter' not in line: continue
            mt=re.search(r'player_tick=(\d+)',line); md=re.search(r'delta=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)',line)
            if mt and md and int(mt.group(1))==ct:
              d=tuple(float(md.group(i)) for i in range(1,4)); writers.append(d)
          material=[d for d in writers if math.sqrt(sum(v*v for v in d))>0.75]
          if not material: raise SystemExit('no material Create carry writer setPos on clear tick')
          print('REFERENCE_OWNER_V2_LIFECYCLE_AUTHORITY_PROOF classification=FALSE_GROUNDED_LIFECYCLE_CLEAR_REOPENS_CREATE_CARRY'
                f' jump_tick={jt} clear_tick={ct} owner={owner} age={clear[2]} on_ground={str(clear[3]).lower()}'
                f' delta_y={clear[4]} grounded_expired={str(clear[7]).lower()} owner_expired={str(clear[8]).lower()}'
                f' leaked_authority={leaked[:4]} material_writer_delta={material[:4]}'
                ' read_only=true production_unchanged=true final_ready=false')
          PY
      - name: Upload trace log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reference-owner-v2-lifecycle-authority-trace-log
          path: |
            reference-owner-v2-lifecycle-authority-trace.log
            reference-owner-v2-lifecycle-authority-trace-xvfb.log
          if-no-files-found: warn

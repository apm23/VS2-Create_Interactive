name: m1-reference-owner-v2-natural-landing-dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-natural-landing-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch natural landing proof at current main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/apm23/VS2-Create_Interactive/actions/workflows/m1-reference-owner-v2-natural-landing-proof.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'REFERENCE_OWNER_V2_NATURAL_LANDING_DISPATCH dispatched=true'

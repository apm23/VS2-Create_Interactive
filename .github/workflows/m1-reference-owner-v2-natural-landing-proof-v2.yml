name: m1-reference-owner-v2-natural-landing-proof-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-natural-landing-proof-v2.yml'
      - 'scripts/prepare_vs2_26_2_natural_landing_harness_v2.py'
      - 'scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-landing-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact current production source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          grep -q 'nativeUpwardMotion = entity.deltaMovement.y > 1.0E-5' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt

      - name: Apply fixture-only natural landing harness v2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          FIXTURE=upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.java
          grep -q 'self.tickCount <= vs2\$jumpStartTick + 40' "$FIXTURE"
          grep -q 'boolean floorFresh = floorTick == self.tickCount || floorTick == self.tickCount - 1;' "$FIXTURE"
          ! grep -q 'self.setPos(' "$FIXTURE"
          ! grep -q 'self.setDeltaMovement(' "$FIXTURE"

      - name: Compile exact composition plus fixture-only harness
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-natural-landing-v2
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-natural-landing-v2

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove real-support natural landing continuity
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-natural-landing-v2.log
          XVFB_LOG=../reference-owner-v2-natural-landing-v2-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-natural-landing-v2' > "$LOG" 2>&1 &
          CLIENT_PID=$!
          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }
          READY=0
          for i in $(seq 1 900); do
            CARRIAGE=0; MOVED=0; ACQUIRED=0; WALK=0; REQUESTED=0; AIRBORNE=0
            grep -q 'GATE_D_CARRIAGE_PRESENT' "$LOG" && CARRIAGE=1 || true
            grep -q 'GATE_D_TRAIN_MOVED' "$LOG" && MOVED=1 || true
            grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" && ACQUIRED=1 || true
            grep -Eq 'GATE_E_PHASE154_FIXTURE_WALK_CONFIRMED.*confirmed=true' "$LOG" && WALK=1 || true
            grep -q 'GATE_E_M1_NATIVE_JUMP_REQUESTED' "$LOG" && REQUESTED=1 || true
            grep -q 'GATE_E_M1_NATIVE_JUMP_AIRBORNE' "$LOG" && AIRBORNE=1 || true
            if [ "$CARRIAGE" -eq 1 ] && [ "$MOVED" -eq 1 ] && [ "$ACQUIRED" -eq 1 ] && [ "$WALK" -eq 1 ] \
              && [ "$REQUESTED" -eq 1 ] && [ "$AIRBORNE" -eq 1 ]; then READY=1; break; fi
            if fatal_state; then tail -360 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -360 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 6
          if fatal_state; then tail -360 "$LOG"; exit 1; fi
          if grep -q 'GATE_E_PHASE83_CONTACT_REFRESH' "$LOG"; then echo 'legacy Phase83 reanchor executed'; exit 1; fi
          if grep -q 'GATE_E_PHASE205_PRE_COLLISION_REANCHOR' "$LOG"; then echo 'legacy Phase205 reanchor executed'; exit 1; fi
          if grep -q 'GATE_E_PHASE205_DUPLICATE_CONTACT_CARRY_SUPPRESSED' "$LOG"; then echo 'legacy Phase205 suppression executed'; exit 1; fi

          python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          req=re.search(r'GATE_E_M1_NATIVE_JUMP_REQUESTED[^\n]*player_tick=(\d+)',text)
          air=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)[^\n]*delta_y=([-+0-9.eE]+)',text)
          if not (req and air): raise SystemExit('missing jump request/airborne markers')
          r_tick=int(req.group(1)); a_tick=int(air.group(1)); rise_delta=float(air.group(2))
          if a_tick < r_tick: raise SystemExit(f'invalid jump ordering request={r_tick} airborne={a_tick}')

          acquisitions=[(int(t),int(c)) for t,c in re.findall(r'REFERENCE_OWNER_V2_ACQUIRE[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)',text)]
          prior=[x for x in acquisitions if x[0] <= r_tick]
          if not prior: raise SystemExit('no external owner acquisition before jump')
          owner_tick,owner_id=max(prior)

          support_re=re.compile(
              r'GATE_E_PHASE131_SUPPORT_SOURCE player_tick=(\d+) carriage_id=(\d+) physical_support=(true|false) '
              r'vertical_gap=([-+0-9.eE]+)[^\n]*local_feet=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+);')
          rows=[]
          for m in support_re.finditer(text):
              t,cid=int(m.group(1)),int(m.group(2))
              if cid!=owner_id: continue
              rows.append((t,m.group(3)=='true',float(m.group(4)),float(m.group(5)),float(m.group(6)),float(m.group(7))))
          rows.sort()
          if not rows: raise SystemExit(f'no Phase131 rows for owner={owner_id}')

          before=[x for x in rows if x[0] <= r_tick and x[1]]
          if not before: raise SystemExit(f'no supported owner baseline before jump owner={owner_id}')
          baseline=max(before,key=lambda x:x[0])

          post_false=[x for x in rows if x[0] >= a_tick and not x[1]]
          if not post_false: raise SystemExit('jump never left strict physical support')
          landing_candidates=[x for x in rows if x[0] >= a_tick+3 and x[1]]
          if not landing_candidates:
              raise SystemExit(f'no genuine Create support reacquisition owner={owner_id}')
          landing=landing_candidates[0]
          l_tick=landing[0]
          if l_tick-r_tick > 40: raise SystemExit(f'genuine landing took too long: {l_tick-r_tick} ticks')

          changed=[(t,c) for t,c in acquisitions if r_tick <= t <= l_tick and c != owner_id]
          if changed: raise SystemExit(f'external owner changed during jump owner={owner_id} changes={changed[:8]}')

          jump_rows=[x for x in rows if r_tick <= x[0] <= l_tick]
          if len(jump_rows)<5: raise SystemExit(f'insufficient owner-frame jump rows owner={owner_id} count={len(jump_rows)}')
          x0,z0=jump_rows[0][3],jump_rows[0][5]
          max_drift=max(math.hypot(x-x0,z-z0) for _,_,_,x,_,z in jump_rows)
          max_step=max([math.hypot(b[3]-a[3],b[5]-a[5]) for a,b in zip(jump_rows,jump_rows[1:])] or [0.0])
          if max_drift>1.5: raise SystemExit(f'owner-relative airborne drift too large: {max_drift:.6f}')
          if max_step>0.75: raise SystemExit(f'owner-relative one-tick step too large: {max_step:.6f}')

          baseline_y=baseline[4]
          peak=max(x[4] for x in jump_rows)
          final_y=landing[4]
          if peak < baseline_y+0.10 and rise_delta <= 0.05:
              raise SystemExit(f'no natural upward arc baseline={baseline_y:.6f} peak={peak:.6f} delta={rise_delta:.6f}')
          if abs(final_y-baseline_y)>0.35:
              raise SystemExit(f'genuine landing local Y did not return near floor baseline={baseline_y:.6f} final={final_y:.6f}')

          false_marker=re.search(r'GATE_E_M1_NATIVE_JUMP_LANDED[^\n]*player_tick=(\d+)',text)
          false_marker_tick=int(false_marker.group(1)) if false_marker else -1
          fallback_ticks=[int(t) for t in re.findall(r'GATE_E_PHASE198_HEADLESS_NATIVE_AISTEP_FALLBACK[^\n]*player_tick=(\d+)',text)]
          fallback_after_false=[t for t in fallback_ticks if false_marker_tick>=0 and t>false_marker_tick]
          if false_marker_tick>=0 and false_marker_tick<l_tick and not fallback_after_false:
              raise SystemExit('headless native aiStep fallback still stopped at false landing marker')

          print('REFERENCE_OWNER_V2_NATURAL_LANDING_V2_PROOF conclusion=natural_landing_real_support_green'
                f' owner={owner_id} request_tick={r_tick} airborne_tick={a_tick} genuine_landing_tick={l_tick}'
                f' false_landed_marker_tick={false_marker_tick} max_owner_relative_drift={max_drift:.6f}'
                f' max_owner_relative_step={max_step:.6f} baseline_y={baseline_y:.6f} peak_y={peak:.6f}'
                f' final_y={final_y:.6f} fallback_after_false_marker={fallback_after_false[:16]}'
                ' fixture_only_airstep_repair=true production_physics_unchanged=true final_ready=false')
          PY

      - name: Upload exact natural landing v2 log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reference-owner-v2-natural-landing-v2-log
          path: |
            reference-owner-v2-natural-landing-v2.log
            reference-owner-v2-natural-landing-v2-xvfb.log
          if-no-files-found: warn

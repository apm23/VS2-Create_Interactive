name: m1-reference-owner-v2-point-timing-microproof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-point-timing-microproof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  point-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact authority-fixed V2
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Add read-only same-point transform telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt')
          s = p.read_text(encoding='utf-8')
          needle = 'addedMovement = currentWorld.sub(entityReferencePos, Vector3d())'
          if s.count(needle) != 1:
              raise SystemExit(f'point-timing proof expected one addedMovement anchor, found {s.count(needle)}')
          insert = needle + r'''
                        if (entity.level().isClientSide && entity.javaClass.simpleName == "LocalPlayer") {
                            val owner = ExternalReferenceFrameResolver.resolveOwner(entity.level(), externalReferenceOwnerEntityId)
                            var nativeReference: net.minecraft.world.phys.Vec3? = null
                            var nativeCurrent: net.minecraft.world.phys.Vec3? = null
                            var previousYaw = Double.NaN
                            var currentYaw = Double.NaN
                            try {
                                val motionMethod = owner?.javaClass?.getMethod(
                                    "getContactPointMotion",
                                    net.minecraft.world.phys.Vec3::class.java
                                )
                                nativeReference = motionMethod?.invoke(
                                    owner,
                                    net.minecraft.world.phys.Vec3(
                                        entityReferencePos.x(), entityReferencePos.y(), entityReferencePos.z()
                                    )
                                ) as? net.minecraft.world.phys.Vec3
                                nativeCurrent = motionMethod?.invoke(
                                    owner,
                                    net.minecraft.world.phys.Vec3(entity.x, entity.y, entity.z)
                                ) as? net.minecraft.world.phys.Vec3
                                val yawMethod = owner?.javaClass?.getMethod(
                                    "getViewYRot",
                                    java.lang.Float.TYPE
                                )
                                previousYaw = (yawMethod?.invoke(owner, 0.0f) as? Number)?.toDouble() ?: Double.NaN
                                currentYaw = (yawMethod?.invoke(owner, 1.0f) as? Number)?.toDouble() ?: Double.NaN
                            } catch (_: ReflectiveOperationException) {
                            } catch (_: RuntimeException) {
                            }
                            val referenceMismatch = if (nativeReference != null) {
                                kotlin.math.sqrt(
                                    (addedMovement.x() - nativeReference!!.x) * (addedMovement.x() - nativeReference!!.x) +
                                    (addedMovement.y() - nativeReference!!.y) * (addedMovement.y() - nativeReference!!.y) +
                                    (addedMovement.z() - nativeReference!!.z) * (addedMovement.z() - nativeReference!!.z)
                                )
                            } else Double.NaN
                            val currentMismatch = if (nativeCurrent != null) {
                                kotlin.math.sqrt(
                                    (addedMovement.x() - nativeCurrent!!.x) * (addedMovement.x() - nativeCurrent!!.x) +
                                    (addedMovement.y() - nativeCurrent!!.y) * (addedMovement.y() - nativeCurrent!!.y) +
                                    (addedMovement.z() - nativeCurrent!!.z) * (addedMovement.z() - nativeCurrent!!.z)
                                )
                            } else Double.NaN
                            println(
                                "REFERENCE_OWNER_V2_POINT_TIMING player_tick=${entity.tickCount} pre_tick=$preTick " +
                                "owner=$externalReferenceOwnerEntityId age=${entityDraggingInformation.ticksSinceExternalReferenceOwner} " +
                                "ref=(${entityReferencePos.x()},${entityReferencePos.y()},${entityReferencePos.z()}) " +
                                "current=(${entity.x},${entity.y},${entity.z}) xo=(${entity.xo},${entity.yo},${entity.zo}) " +
                                "local=(${localPosition?.x()},${localPosition?.y()},${localPosition?.z()}) " +
                                "v2=(${addedMovement.x()},${addedMovement.y()},${addedMovement.z()}) " +
                                "native_ref=(${nativeReference?.x},${nativeReference?.y},${nativeReference?.z}) " +
                                "native_current=(${nativeCurrent?.x},${nativeCurrent?.y},${nativeCurrent?.z}) " +
                                "same_point_mismatch=$referenceMismatch current_point_mismatch=$currentMismatch " +
                                "prev_yaw=$previousYaw current_yaw=$currentYaw read_only=true"
                            )
                        }'''
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile exact diagnostic composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:compileJava; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-point-timing-proof
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-point-timing-proof

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove same-point transform boundary on moving train
        working-directory: upstream
        timeout-minutes: 10
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-point-timing.log
          XVFB_LOG=../reference-owner-v2-point-timing-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-point-timing-proof' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          READY=0
          for i in $(seq 1 360); do
            if grep -q 'GATE_D_TRAIN_MOVED' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_POINT_TIMING' "$LOG"; then
              READY=1
              break
            fi
            if fatal_state; then tail -300 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -300 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 8

          python3 - "$LOG" <<'PY'
          import math, re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()

          point = re.compile(
              r'REFERENCE_OWNER_V2_POINT_TIMING player_tick=(\d+).*?pre_tick=(true|false).*?owner=(\d+).*?age=(\d+).*?'
              r'v2=\(([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)\).*?'
              r'native_ref=\(([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)\).*?'
              r'native_current=\(([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)\).*?'
              r'same_point_mismatch=([-+0-9.eE]+).*?current_point_mismatch=([-+0-9.eE]+).*?'
              r'prev_yaw=([-+0-9.eE]+).*?current_yaw=([-+0-9.eE]+)'
          )
          samples = []
          for m in point.finditer(text):
              vals = m.groups()
              samples.append({
                  'tick': int(vals[0]),
                  'pre': vals[1] == 'true',
                  'owner': int(vals[2]),
                  'age': int(vals[3]),
                  'same': float(vals[13]),
                  'current': float(vals[14]),
                  'prev_yaw': float(vals[15]),
                  'cur_yaw': float(vals[16]),
              })
          if len(samples) < 5:
              raise SystemExit(f'insufficient point-timing samples: {len(samples)}')

          frame = re.compile(
              r'GATE_E_PHASE171_CARRIAGE_FRAME_STEP player_tick=(\d+) carriage_id=(\d+).*?'
              r'frame_step=\(([-+0-9.eE]+), ([-+0-9.eE]+), ([-+0-9.eE]+)\).*?'
              r'contact_motion=\(([-+0-9.eE]+), ([-+0-9.eE]+), ([-+0-9.eE]+)\).*?'
              r'motion_minus_frame_step=\(([-+0-9.eE]+), ([-+0-9.eE]+), ([-+0-9.eE]+)\)'
          )
          turn_ticks = set()
          for m in frame.finditer(text):
              diff = tuple(map(float, m.groups()[8:11]))
              if math.sqrt(sum(v*v for v in diff)) > 5.0:
                  turn_ticks.add(int(m.group(1)))
          if not turn_ticks:
              raise SystemExit('fixture did not expose a material turn/frame transition')

          turn_samples = [s for s in samples if s['tick'] in turn_ticks]
          if not turn_samples:
              raise SystemExit(f'no point-timing sample on turn ticks {sorted(turn_ticks)}')

          worst_same = max(samples, key=lambda s: s['same'])
          worst_current = max(samples, key=lambda s: s['current'])
          turn_worst = max(turn_samples, key=lambda s: s['same'])

          if turn_worst['same'] <= 0.05:
              classification = 'SAME_POINT_TRANSFORM_MATCHES_NATIVE_POINT_TIMING_DIFFERS'
          else:
              classification = 'SAME_POINT_TRANSFORM_DIVERGES_FROM_CREATE_NATIVE'

          print(
              'REFERENCE_OWNER_V2_POINT_TIMING_PROOF '
              f'classification={classification} sample_count={len(samples)} '
              f'turn_ticks={sorted(turn_ticks)} '
              f'turn_tick={turn_worst["tick"]} turn_same_point_mismatch={turn_worst["same"]:.6f} '
              f'turn_current_point_mismatch={turn_worst["current"]:.6f} '
              f'turn_prev_yaw={turn_worst["prev_yaw"]:.6f} turn_current_yaw={turn_worst["cur_yaw"]:.6f} '
              f'max_same_point_mismatch={worst_same["same"]:.6f}@{worst_same["tick"]} '
              f'max_current_point_mismatch={worst_current["current"]:.6f}@{worst_current["tick"]} '
              'read_only=true final_ready=false'
          )
          PY

          grep -E 'REFERENCE_OWNER_V2_POINT_TIMING|GATE_E_PHASE171_CARRIAGE_FRAME_STEP|GATE_E_CARRIAGE_LOCAL_CONTINUITY' "$LOG" | tail -220 || true

      - name: Upload point-timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-point-timing-log
          path: |
            reference-owner-v2-point-timing.log
            reference-owner-v2-point-timing-xvfb.log
          if-no-files-found: warn

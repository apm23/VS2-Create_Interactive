name: m1-reference-owner-v2-precollision-order-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-precollision-order-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precollision-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact authority-fixed V2 with precollision scheduler
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Add read-only scheduler order telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('upstream')
          helper = root / 'common/src/main/java/org/valkyrienskies/mod/common/util/ReferenceOwnerPrecollisionProbe.java'
          helper.parent.mkdir(parents=True, exist_ok=True)
          helper.write_text(r'''package org.valkyrienskies.mod.common.util;

          import java.util.concurrent.atomic.AtomicLong;
          import net.minecraft.world.entity.Entity;
          import org.apache.logging.log4j.LogManager;
          import org.apache.logging.log4j.Logger;
          import org.joml.Vector3d;

          public final class ReferenceOwnerPrecollisionProbe {
              private static final Logger LOGGER = LogManager.getLogger("VS2-ReferenceOwner-Precollision");
              private static final AtomicLong SEQUENCE = new AtomicLong();
              private ReferenceOwnerPrecollisionProbe() {}

              public static void mark(String phase, Entity player, Entity carriage) {
                  if (!(player instanceof IEntityDraggingInformationProvider provider)) return;
                  var dragging = provider.getDraggingInformation();
                  Integer ownerId = dragging.getExternalReferenceOwnerEntityId();
                  if (ownerId == null || !dragging.isEntityBeingDraggedByExternalReference()) return;
                  Vector3d local = ExternalReferenceFrameResolver.currentWorldToLocal(
                      player.level(), ownerId, new Vector3d(player.getX(), player.getY(), player.getZ())
                  );
                  LOGGER.info(
                      "REFERENCE_OWNER_V2_PRECOLLISION_ORDER seq={} player_tick={} phase={} owner_id={} carriage_id={} owner_age={} " +
                          "local=({},{},{}) on_ground={} read_only=true",
                      SEQUENCE.incrementAndGet(), player.tickCount, phase, ownerId,
                      carriage == null ? -1 : carriage.getId(),
                      dragging.getTicksSinceExternalReferenceOwner(),
                      local == null ? Double.NaN : local.x(),
                      local == null ? Double.NaN : local.y(),
                      local == null ? Double.NaN : local.z(),
                      player.onGround()
                  );
              }
          }
          ''', encoding='utf-8')

          mixin = root / 'common/src/main/java/org/valkyrienskies/mod/mixin/client/MixinMinecraft.java'
          source = mixin.read_text(encoding='utf-8')
          anchor = '''            EntityDragger.INSTANCE.dragEntitiesWithShips(
                          java.util.Collections.singletonList(referencePlayer),
                          false
                      );'''
          if source.count(anchor) != 1:
              raise SystemExit(f'precollision proof expected one external singleton drag anchor, found {source.count(anchor)}')
          replacement = '''            org.valkyrienskies.mod.common.util.ReferenceOwnerPrecollisionProbe.mark(
                          "VS2_PRE_DRAG_BEFORE", referencePlayer, null
                      );
                      EntityDragger.INSTANCE.dragEntitiesWithShips(
                          java.util.Collections.singletonList(referencePlayer),
                          false
                      );
                      org.valkyrienskies.mod.common.util.ReferenceOwnerPrecollisionProbe.mark(
                          "VS2_PRE_DRAG_AFTER", referencePlayer, null
                      );'''
          source = source.replace(anchor, replacement, 1)
          mixin.write_text(source, encoding='utf-8')

          java = root / 'fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinReferenceOwnerPrecollisionProbe.java'
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text(r'''package org.valkyrienskies.mod.fabric.mixin.gatee;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.world.entity.Entity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Coerce;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import org.valkyrienskies.mod.common.util.ReferenceOwnerPrecollisionProbe;

          @Mixin(targets = "com.zurrtum.create.client.content.contraptions.ContraptionColliderClient", remap = false)
          public abstract class MixinReferenceOwnerPrecollisionProbe {
              @Inject(method = "collideEntities", at = @At("HEAD"), remap = false, require = 1)
              private static void vs2$head(@Coerce Object carriage, CallbackInfo ci) {
                  LocalPlayer player = Minecraft.getInstance().player;
                  if (player != null && carriage instanceof Entity carriageEntity) {
                      ReferenceOwnerPrecollisionProbe.mark("CREATE_COLLISION_HEAD", player, carriageEntity);
                  }
              }

              @Inject(method = "collideEntities", at = @At("RETURN"), remap = false, require = 1)
              private static void vs2$return(@Coerce Object carriage, CallbackInfo ci) {
                  LocalPlayer player = Minecraft.getInstance().player;
                  if (player != null && carriage instanceof Entity carriageEntity) {
                      ReferenceOwnerPrecollisionProbe.mark("CREATE_COLLISION_RETURN", player, carriageEntity);
                  }
              }
          }
          ''', encoding='utf-8')

          mixin_json = root / 'fabric/src/main/resources/vs2-create-compat.mixins.json'
          metadata = json.loads(mixin_json.read_text(encoding='utf-8'))
          client = metadata.setdefault('client', [])
          entry = 'MixinReferenceOwnerPrecollisionProbe'
          if entry not in client:
              client.append(entry)
          mixin_json.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')

          combined = helper.read_text(encoding='utf-8') + java.read_text(encoding='utf-8')
          for forbidden in ['setPos(', 'setDeltaMovement(', 'teleport', 'setOnGround(', 'setNoGravity(', 'getContactPointMotion(']:
              if forbidden in combined:
                  raise SystemExit('precollision proof introduced forbidden mutation token: ' + forbidden)
          print('REFERENCE_OWNER_V2_PRECOLLISION_INSTRUMENTATION read_only=true')
          PY

      - name: Compile exact diagnostic composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:compileJava; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-precollision-proof
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-precollision-proof

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove external owner drag precedes Create collision
        working-directory: upstream
        timeout-minutes: 10
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-precollision-order.log
          XVFB_LOG=../reference-owner-v2-precollision-order-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-precollision-proof' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            kill "$CLIENT_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 360); do
            if grep -q 'GATE_D_TRAIN_MOVED' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" \
              && grep -q 'phase=VS2_PRE_DRAG_AFTER' "$LOG" \
              && grep -q 'phase=CREATE_COLLISION_HEAD' "$LOG"; then
              READY=1
              break
            fi
            if grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG"; then
              tail -300 "$LOG"
              exit 1
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              wait "$CLIENT_PID" || true
              tail -300 "$LOG"
              exit 1
            fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 7

          python3 - "$LOG" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          pat = re.compile(
              r'REFERENCE_OWNER_V2_PRECOLLISION_ORDER seq=(\d+) player_tick=(\d+) phase=([A-Z0-9_]+) '
              r'owner_id=(\d+) carriage_id=(-?\d+) owner_age=(\d+) '
              r'local=\(([-+0-9.eENa]+),([-+0-9.eENa]+),([-+0-9.eENa]+)\) on_ground=(true|false)'
          )
          rows=[]
          for m in pat.finditer(text):
              g=m.groups()
              rows.append({
                  'seq':int(g[0]), 'tick':int(g[1]), 'phase':g[2], 'owner':int(g[3]),
                  'carriage':int(g[4]), 'age':int(g[5]), 'lx':float(g[6]), 'ly':float(g[7]),
                  'lz':float(g[8]), 'ground':g[9]=='true'
              })
          if len(rows) < 12:
              raise SystemExit(f'insufficient precollision rows: {len(rows)}')

          patterns=[]
          afters=[r for r in rows if r['phase']=='VS2_PRE_DRAG_AFTER']
          for after in afters:
              before_candidates=[r for r in rows if r['phase']=='VS2_PRE_DRAG_BEFORE' and r['owner']==after['owner'] and r['seq'] < after['seq']]
              if not before_candidates:
                  continue
              before=max(before_candidates, key=lambda r:r['seq'])
              heads=[r for r in rows if r['phase']=='CREATE_COLLISION_HEAD' and r['owner']==after['owner'] and r['carriage']==after['owner'] and r['seq'] > after['seq']]
              if not heads:
                  continue
              head=min(heads, key=lambda r:r['seq'])
              returns=[r for r in rows if r['phase']=='CREATE_COLLISION_RETURN' and r['owner']==after['owner'] and r['carriage']==after['owner'] and r['seq'] > head['seq']]
              if not returns:
                  continue
              ret=min(returns, key=lambda r:r['seq'])
              next_pre=[r for r in rows if r['phase']=='VS2_PRE_DRAG_BEFORE' and r['seq'] > after['seq']]
              next_pre_seq=min((r['seq'] for r in next_pre), default=10**18)
              if ret['seq'] < next_pre_seq:
                  patterns.append((before, after, head, ret))

          if len(patterns) < 3:
              raise SystemExit(f'insufficient complete precollision patterns: {len(patterns)}')
          bad=[p for p in patterns if not (p[0]['seq'] < p[1]['seq'] < p[2]['seq'] < p[3]['seq'])]
          if bad:
              raise SystemExit(f'non-precollision ordering observed: {[(p[0]["seq"],p[1]["seq"],p[2]["seq"],p[3]["seq"]) for p in bad]}')

          max_gap=max(p[2]['seq']-p[1]['seq'] for p in patterns)
          print(
              'REFERENCE_OWNER_V2_PRECOLLISION_ORDER_PROOF '
              f'classification=EXTERNAL_DRAG_PRECEDES_CREATE_COLLISION patterns={len(patterns)} '
              f'max_sequence_gap={max_gap} read_only=true final_ready=false'
          )
          PY

          grep -E 'REFERENCE_OWNER_V2_PRECOLLISION_ORDER|REFERENCE_OWNER_V2_ACQUIRE|GATE_E_CARRIAGE_LOCAL_CONTINUITY' "$LOG" | tail -220 || true

      - name: Upload precollision diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-precollision-order-log
          path: |
            reference-owner-v2-precollision-order.log
            reference-owner-v2-precollision-order-xvfb.log
          if-no-files-found: warn

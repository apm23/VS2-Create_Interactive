name: m1-reference-owner-v2-real-train

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-real-train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-real-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V2 M1 source
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py

          PROBE=upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          COLLIDER=upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinContraptionColliderClientTrace.java
          grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$PROBE"
          grep -q 'refreshExternalReferenceOwner(carriage.getId())' "$PROBE"
          ! grep -q 'GATE_E_PHASE83_CONTACT_REFRESH' "$PROBE"
          ! grep -q 'EntityDragger.reanchorEntityWithExternalFrame' "$PROBE"
          ! grep -q 'GATE_E_PHASE205_PRE_COLLISION_REANCHOR' "$COLLIDER"
          ! grep -q 'GATE_E_PHASE205_DUPLICATE_CONTACT_CARRY_SUPPRESSED' "$COLLIDER"
          grep -q 'GATE_E_PHASE154_FIXTURE_WALK_CONFIRMED' "$PROBE"
          grep -q 'GATE_E_CARRIAGE_LOCAL_CONTINUITY' "$PROBE"
          grep -q 'GATE_E_M1_NATIVE_JUMP_AIRBORNE' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.java
          grep -q 'GATE_E_M1_NATIVE_JUMP_LANDED' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinLocalPlayerFixtureInput.java

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          test -f 'world-fixture/train build 1/level.dat'
          test -f 'world-fixture/train build 1/data/create/tracks.dat'
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-reference-owner-smoke
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-reference-owner-smoke

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Run V2 on real moving train
        working-directory: upstream
        timeout-minutes: 18
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-real-train.log
          XVFB_LOG=../reference-owner-v2-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-reference-owner-smoke' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          MODE_READY=0
          WORLD_READY=0
          for i in $(seq 1 900); do
            grep -q 'VS2_CREATE_CARRY_COMPAT_MODE ci_harness=false explicit_opt_in=true' "$LOG" && MODE_READY=1 || true
            if grep -Eq 'Starting integrated minecraft server|Starting integrated server' "$LOG" \
              && grep -Eq 'Preparing level|Preparing spawn area|Time elapsed|Loaded [0-9]+ advancements' "$LOG" \
              && grep -Eq '(^|[[:space:]])- create 6\.0\.9-1([[:space:]]|$)' "$LOG" \
              && grep -Eq '(^|[[:space:]])- railways ' "$LOG" \
              && grep -Eq '(^|[[:space:]])- copycats ' "$LOG" \
              && grep -q 'Initialized VSCore on Fabric!' "$LOG"; then WORLD_READY=1; fi
            if [ "$MODE_READY" -eq 1 ] && [ "$WORLD_READY" -eq 1 ]; then break; fi
            if fatal_state; then tail -260 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -260 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$MODE_READY" -eq 1
          test "$WORLD_READY" -eq 1

          CARRIAGE=0
          MOVED=0
          ACQUIRED=0
          WALK=0
          AIRBORNE=0
          LANDED=0
          for i in $(seq 1 420); do
            grep -q 'GATE_D_CARRIAGE_PRESENT' "$LOG" && CARRIAGE=1 || true
            grep -q 'GATE_D_TRAIN_MOVED' "$LOG" && MOVED=1 || true
            grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" && ACQUIRED=1 || true
            grep -Eq 'GATE_E_PHASE154_FIXTURE_WALK_CONFIRMED[^\n]*confirmed=true' "$LOG" && WALK=1 || true
            grep -q 'GATE_E_M1_NATIVE_JUMP_AIRBORNE' "$LOG" && AIRBORNE=1 || true
            grep -q 'GATE_E_M1_NATIVE_JUMP_LANDED' "$LOG" && LANDED=1 || true
            if [ "$CARRIAGE" -eq 1 ] && [ "$MOVED" -eq 1 ] && [ "$ACQUIRED" -eq 1 ] \
              && [ "$WALK" -eq 1 ] && [ "$AIRBORNE" -eq 1 ] && [ "$LANDED" -eq 1 ]; then break; fi
            if fatal_state; then tail -300 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -300 "$LOG"; exit 1; fi
            sleep 1
          done

          test "$CARRIAGE" -eq 1
          test "$MOVED" -eq 1
          test "$ACQUIRED" -eq 1
          test "$WALK" -eq 1
          test "$AIRBORNE" -eq 1
          test "$LANDED" -eq 1

          if grep -q 'GATE_E_PHASE83_CONTACT_REFRESH' "$LOG"; then
            echo 'Legacy Phase83 reanchor executed in V2 runtime.'
            exit 1
          fi
          if grep -q 'GATE_E_PHASE205_PRE_COLLISION_REANCHOR' "$LOG"; then
            echo 'Legacy Phase205 reanchor executed in V2 runtime.'
            exit 1
          fi
          if grep -q 'GATE_E_PHASE205_DUPLICATE_CONTACT_CARRY_SUPPRESSED' "$LOG"; then
            echo 'Legacy Phase205 contact-motion suppression executed in V2 runtime.'
            exit 1
          fi

          python3 - "$LOG" <<'PY'
          import math, re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()

          airborne = re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)', text)
          landed = re.search(r'GATE_E_M1_NATIVE_JUMP_LANDED[^\n]*player_tick=(\d+)', text)
          if not airborne or not landed:
              raise SystemExit('V2 runtime missing airborne/landed jump markers')
          a_tick = int(airborne.group(1))
          l_tick = int(landed.group(1))
          if l_tick <= a_tick:
              raise SystemExit(f'invalid jump interval airborne={a_tick} landed={l_tick}')

          acquisitions = [
              (int(t), int(cid))
              for t, cid in re.findall(r'REFERENCE_OWNER_V2_ACQUIRE[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)', text)
              if int(t) <= a_tick
          ]
          if not acquisitions:
              raise SystemExit('no V2 owner acquisition before airborne interval')
          owner_tick, owner_id = max(acquisitions)

          pattern = re.compile(
              r'GATE_E_CARRIAGE_LOCAL_CONTINUITY[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)'
              r'[^\n]*local_feet=\(([-+0-9.eE]+), ([-+0-9.eE]+), ([-+0-9.eE]+)\)'
          )
          samples = []
          for m in pattern.finditer(text):
              tick, cid = int(m.group(1)), int(m.group(2))
              if a_tick <= tick <= l_tick and cid == owner_id:
                  samples.append((tick, float(m.group(3)), float(m.group(4)), float(m.group(5))))
          samples.sort()
          if len(samples) < 2:
              raise SystemExit(f'insufficient carriage-local airborne samples owner={owner_id} interval={a_tick}-{l_tick} count={len(samples)}')

          x0, z0 = samples[0][1], samples[0][3]
          max_horizontal = max(math.hypot(x - x0, z - z0) for _, x, _, z in samples)
          max_step = max(
              [math.hypot(b[1] - a[1], b[3] - a[3]) for a, b in zip(samples, samples[1:])]
              or [0.0]
          )
          if max_horizontal > 1.5:
              raise SystemExit(f'airborne owner-relative horizontal drift too large: {max_horizontal:.4f} blocks owner={owner_id}')
          if max_step > 0.75:
              raise SystemExit(f'airborne owner-relative one-tick discontinuity too large: {max_step:.4f} blocks owner={owner_id}')

          print(
              'REFERENCE_OWNER_V2_REAL_TRAIN '
              f'owner={owner_id} acquired_tick={owner_tick} airborne_tick={a_tick} landed_tick={l_tick} '
              f'airborne_samples={len(samples)} max_horizontal_drift={max_horizontal:.6f} max_horizontal_step={max_step:.6f} '
              'legacy_reanchor=false real_train=true result=PASS'
          )
          PY

          echo 'REFERENCE_OWNER_V2_REAL_TRAIN_GATE result=PASS final_ready=false user_runtime_gate_required=true'
          grep -E 'REFERENCE_OWNER_V2_ACQUIRE|GATE_E_PHASE154_FIXTURE_WALK_CONFIRMED|GATE_E_M1_NATIVE_JUMP_(REQUESTED|AIRBORNE|LANDED)|REFERENCE_OWNER_V2_REAL_TRAIN' "$LOG" | tail -160 || true

      - name: Upload V2 real-train diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-real-train-log
          path: |
            reference-owner-v2-real-train.log
            reference-owner-v2-xvfb.log
          if-no-files-found: warn

name: m1-reference-owner-v2-schedule-gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-schedule-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-owner-drag-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V2 plus scheduler fix
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py

          MIXIN=upstream/common/src/main/java/org/valkyrienskies/mod/mixin/client/MixinMinecraft.java
          grep -q 'shipObjectWorld.getAllShips().size() > 0 || hasExternalReferenceOwner' "$MIXIN"
          grep -q 'isEntityBeingDraggedByExternalReference()' "$MIXIN"

      - name: Add scheduler body telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt')
          s = p.read_text(encoding='utf-8')
          needle = 'addedMovement = currentWorld.sub(entityReferencePos, Vector3d())'
          if s.count(needle) != 1:
              raise SystemExit(f'schedule gate expected one external-owner addedMovement token, found {s.count(needle)}')
          insert = '''addedMovement = currentWorld.sub(entityReferencePos, Vector3d())
                        if (entity.level().isClientSide && entity.javaClass.simpleName == "LocalPlayer") {
                            println(
                                "REFERENCE_OWNER_V2_SCHEDULE_BODY player_tick=${entity.tickCount} pre_tick=$preTick " +
                                "owner=$externalReferenceOwnerEntityId age=${entityDraggingInformation.ticksSinceExternalReferenceOwner} " +
                                "added_x=${addedMovement.x()} added_y=${addedMovement.y()} added_z=${addedMovement.z()}"
                            )
                        }'''
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          print('SCHEDULE_GATE instrumentation=read_only body_mutation=false')
          PY

      - name: Compile scheduler hypothesis
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-schedule-gate
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-schedule-gate

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove external owner reaches VS2 body lifecycle
        working-directory: upstream
        timeout-minutes: 10
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-schedule-gate.log
          XVFB_LOG=../reference-owner-v2-schedule-gate-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-schedule-gate' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          ACQUIRED=0
          BODY=0
          MOVED=0
          for i in $(seq 1 360); do
            grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" && ACQUIRED=1 || true
            grep -q 'REFERENCE_OWNER_V2_SCHEDULE_BODY' "$LOG" && BODY=1 || true
            grep -q 'GATE_D_TRAIN_MOVED' "$LOG" && MOVED=1 || true
            if [ "$ACQUIRED" -eq 1 ] && [ "$BODY" -eq 1 ] && [ "$MOVED" -eq 1 ]; then break; fi
            if fatal_state; then tail -300 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -300 "$LOG"; exit 1; fi
            sleep 1
          done

          test "$MOVED" -eq 1
          test "$ACQUIRED" -eq 1
          test "$BODY" -eq 1

          python3 - "$LOG" <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          acquire = [x for x in text.splitlines() if 'REFERENCE_OWNER_V2_ACQUIRE' in x]
          body = [x for x in text.splitlines() if 'REFERENCE_OWNER_V2_SCHEDULE_BODY' in x]
          create_carry = [x for x in text.splitlines() if 'GATE_E_LOCALPLAYER_SET_POS' in x and 'ContraptionColliderClient#collideEntities' in x]
          print(f'SCHEDULE_GATE acquire_count={len(acquire)} body_count={len(body)} create_collide_setpos_count={len(create_carry)}')
          print('SCHEDULE_GATE conclusion=external_owner_reaches_existing_vs2_body_lifecycle runtime=true')
          PY
          grep -E 'REFERENCE_OWNER_V2_(ACQUIRE|SCHEDULE_BODY)|GATE_D_TRAIN_MOVED|GATE_E_LOCALPLAYER_SET_POS' "$LOG" | tail -180 || true

      - name: Upload scheduler proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-schedule-gate-log
          path: |
            reference-owner-v2-schedule-gate.log
            reference-owner-v2-schedule-gate-xvfb.log
          if-no-files-found: warn

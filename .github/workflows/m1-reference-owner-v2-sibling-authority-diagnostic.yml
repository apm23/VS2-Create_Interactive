name: m1-reference-owner-v2-sibling-authority-diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-reference-owner-v2-sibling-authority-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sibling-authority-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V2 authority state
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py

      - name: Add read-only sibling writer telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinExternalReferenceOwnerCreateCarry.java')
          s = p.read_text(encoding='utf-8')
          needle = '''        if (!exactExternalOwner) {
                      entity.setPos(x, y, z);
                      return;
                  }'''
          if needle not in s:
              # Generated indentation is normally 8 spaces; keep a structural fallback independent of indentation.
              needle = '''        if (!exactExternalOwner) {
            entity.setPos(x, y, z);
            return;
        }'''
          if s.count(needle) != 1:
              raise SystemExit(f'sibling diagnostic expected one !exactExternalOwner pass-through block, found {s.count(needle)}')
          replacement = '''        if (!exactExternalOwner) {
            double vs2$dx = x - entity.getX();
            double vs2$dy = y - entity.getY();
            double vs2$dz = z - entity.getZ();
            if (ownerEntityId != null && Math.hypot(vs2$dx, vs2$dz) > 1.0e-8) {
                VS2_REFERENCE_OWNER_AUTHORITY.info(
                    "REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_PASSTHROUGH player_tick={} carriage_id={} owner_id={} requested_delta={},{},{} material_horizontal=true diagnostic_only=true",
                    player.tickCount,
                    carriageEntity.getId(),
                    ownerEntityId,
                    vs2$dx,
                    vs2$dy,
                    vs2$dz
                );
            }
            entity.setPos(x, y, z);
            return;
        }'''
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          print('SIBLING_AUTHORITY_DIAGNOSTIC instrumentation=read_only movement_semantics_unchanged=true')
          PY

      - name: Add read-only VS2 body telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt')
          s = p.read_text(encoding='utf-8')
          needle = 'addedMovement = currentWorld.sub(entityReferencePos, Vector3d())'
          if s.count(needle) != 1:
              raise SystemExit(f'sibling diagnostic expected one external-owner addedMovement token, found {s.count(needle)}')
          insert = '''addedMovement = currentWorld.sub(entityReferencePos, Vector3d())
                        if (entity.level().isClientSide && entity.javaClass.simpleName == "LocalPlayer") {
                            println("REFERENCE_OWNER_V2_SIBLING_BODY player_tick=${entity.tickCount} pre_tick=$preTick owner=$externalReferenceOwnerEntityId age=${entityDraggingInformation.ticksSinceExternalReferenceOwner} added_x=${addedMovement.x()} added_y=${addedMovement.y()} added_z=${addedMovement.z()}")
                        }'''
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile diagnostic composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-v2-sibling-authority
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-v2-sibling-authority

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Identify material non-owner contact-carry writer
        working-directory: upstream
        timeout-minutes: 10
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          LOG=../reference-owner-v2-sibling-authority.log
          XVFB_LOG=../reference-owner-v2-sibling-authority-xvfb.log
          rm -f "$LOG" "$XVFB_LOG"
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v2-sibling-authority' > "$LOG" 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          READY=0
          for i in $(seq 1 360); do
            if grep -q 'GATE_D_TRAIN_MOVED' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_ACQUIRE' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_SIBLING_BODY' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_SUPPRESSED' "$LOG" \
              && grep -q 'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_PASSTHROUGH' "$LOG"; then
              READY=1
              break
            fi
            if fatal_state; then tail -320 "$LOG"; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -320 "$LOG"; exit 1; fi
            sleep 1
          done
          test "$READY" -eq 1
          sleep 1

          python3 - "$LOG" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          body_re = re.compile(r'REFERENCE_OWNER_V2_SIBLING_BODY player_tick=(\d+).*?owner=(\d+)')
          pass_re = re.compile(r'REFERENCE_OWNER_V2_CREATE_CONTACT_CARRY_PASSTHROUGH player_tick=(\d+) carriage_id=(\d+) owner_id=(\d+).*?requested_delta=([-+0-9.eE]+),([-+0-9.eE]+),([-+0-9.eE]+)')
          bodies = [(int(m.group(1)), int(m.group(2))) for m in body_re.finditer(text)]
          rows = [(int(m.group(1)), int(m.group(2)), int(m.group(3)), float(m.group(4)), float(m.group(5)), float(m.group(6))) for m in pass_re.finditer(text)]
          if not bodies or not rows:
              raise SystemExit('missing body or material pass-through telemetry')
          body_ticks = set(bodies)
          correlated = [r for r in rows if (r[0], r[2]) in body_ticks]
          if not correlated:
              raise SystemExit('no material pass-through correlated with active VS2 body owner tick')
          same_owner = [r for r in correlated if r[1] == r[2]]
          sibling = [r for r in correlated if r[1] != r[2]]
          if same_owner:
              raise SystemExit(f'exact-owner pass-through escaped authority gate: {same_owner}')
          if not sibling:
              raise SystemExit('material writer exists but sibling identity was not proven')
          ids = sorted({(r[1], r[2]) for r in sibling})
          print(f'SIBLING_AUTHORITY_DIAGNOSTIC correlated_count={len(correlated)} sibling_pairs={ids} same_owner_passthrough_count={len(same_owner)}')
          print('SIBLING_AUTHORITY_DIAGNOSTIC conclusion=material_non_owner_carriage_contact_carry_overlaps_vs2_external_owner_body=true broad_suppression_not_authorized=true')
          PY

          grep -E 'REFERENCE_OWNER_V2_(ACQUIRE|SIBLING_BODY|CREATE_CONTACT_CARRY_SUPPRESSED|CREATE_CONTACT_CARRY_PASSTHROUGH)|GATE_D_TRAIN_MOVED' "$LOG" | tail -240 || true

      - name: Upload sibling authority diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v2-sibling-authority-log
          path: |
            reference-owner-v2-sibling-authority.log
            reference-owner-v2-sibling-authority-xvfb.log
          if-no-files-found: warn

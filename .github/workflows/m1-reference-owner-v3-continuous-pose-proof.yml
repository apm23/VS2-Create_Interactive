name: m1-reference-owner-v3-continuous-pose-proof

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_vs2_26_2_reference_owner_v3_continuous_pose.py'
      - '.github/workflows/m1-reference-owner-v3-continuous-pose-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-pose-root-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose V3 continuous reference-owner hypothesis
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_camera_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v3_continuous_pose.py

          STATE=upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDraggingInformation.kt
          DRAGGER=upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt
          RESOLVER=upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/ExternalReferenceFrameResolver.kt
          AUTH=upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/mixin/gatee/MixinExternalReferenceOwnerCreateCarry.java
          grep -q 'externalReferenceOwnerEntityId != null && !mountedToEntity' "$STATE"
          ! grep -q 'externalReferenceOwnerLifetimeLimit' "$STATE"
          ! grep -q 'externalReferenceOwnerJumpActive' "$STATE"
          ! grep -q 'externalReferenceOwnerJumpActive' "$DRAGGER"
          grep -q 'previousWorldYawToLocal' "$RESOLVER"
          grep -q 'REFERENCE_OWNER_V3_CONTINUOUS_POSE' "$DRAGGER"
          grep -q 'REFERENCE_OWNER_V3_GROUNDED_OWNER_CONFIRMED' "$AUTH"
          ! grep -R -q 'getExternalReferenceOwnerJumpActive' upstream/common/src upstream/fabric/src
          echo 'REFERENCE_OWNER_V3_SOURCE_CONTRACT continuous_owner=true fixed_ttl=false jump_lease=false atomic_pose=true'

      - name: Apply unchanged fixture and read-only turn telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_camera_external_reference_proof.py

      - name: Compile exact V3 proof composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct pristine verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf v3-pristine
          mkdir v3-pristine
          unzip -q train-world-state-r0v3.zip -d v3-pristine
          test -d 'v3-pristine/train build 1'

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Prove continuous owner through jump and real turn
        working-directory: upstream
        timeout-minutes: 16
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true -Dvs2.referenceOwnerV3Trace=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          FINAL_LOG=../reference-owner-v3-continuous-pose.log
          PROOF=../reference-owner-v3-continuous-pose-proof.txt
          XVFB_LOG=../reference-owner-v3-xvfb.log
          rm -f "$FINAL_LOG" "$PROOF" "$XVFB_LOG" ../reference-owner-v3-attempt-*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          CLIENT_PID=''
          cleanup() {
            if [ -n "$CLIENT_PID" ]; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          WINNER=0
          for ATTEMPT in 1 2 3; do
            LOG=../reference-owner-v3-attempt-${ATTEMPT}.log
            rm -rf fabric/run/crash-reports fabric/run/saves/train-v3-continuous-pose
            rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log "$LOG"
            mkdir -p fabric/run/saves
            cp -a '../v3-pristine/train build 1' fabric/run/saves/train-v3-continuous-pose

            ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v3-continuous-pose' > "$LOG" 2>&1 &
            CLIENT_PID=$!

            fatal_state() {
              grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
                || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
                || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
                || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
            }

            ATTEMPT_READY=0
            for i in $(seq 1 210); do
              if grep -q 'GATE_E_M1_NATIVE_JUMP_AIRBORNE' "$LOG" \
                && grep -q 'GATE_E_M1_NATIVE_JUMP_LANDED' "$LOG" \
                && grep -q 'REFERENCE_OWNER_V3_CONTINUOUS_POSE' "$LOG" \
                && python3 - "$LOG" <<'PY'
          import math,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          rx=re.compile(r'REFERENCE_OWNER_V2_CAMERA_REFERENCE_FRAME_PROOF sample=\d+ player_tick=(\d+) owner_id=(-?\d+).*?owner_heading=([-+0-9.eE]+)')
          groups={}
          for t,o,h in rx.findall(text):
              groups.setdefault(int(o),[]).append((int(t),float(h)))
          for rows in groups.values():
              if len({t for t,_ in rows}) < 2:
                  continue
              hs=[h for _,h in rows]
              un=[hs[0]]
              prev=hs[0]
              for h in hs[1:]:
                  d=(h-prev+math.pi)%(2*math.pi)-math.pi
                  un.append(un[-1]+d)
                  prev=h
              if max(un)-min(un) >= 0.01:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
              then
                ATTEMPT_READY=1
                READY=1
                WINNER=$ATTEMPT
                break
              fi
              if fatal_state; then tail -280 "$LOG"; exit 1; fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
                wait "$CLIENT_PID" || true
                CLIENT_PID=''
                break
              fi
              sleep 1
            done

            if [ -n "$CLIENT_PID" ]; then
              kill "$CLIENT_PID" 2>/dev/null || true
              wait "$CLIENT_PID" 2>/dev/null || true
              CLIENT_PID=''
            fi
            if [ "$ATTEMPT_READY" -eq 1 ]; then
              cp "$LOG" "$FINAL_LOG"
              break
            fi
          done

          if [ "$READY" -ne 1 ]; then
            cat ../reference-owner-v3-attempt-*.log > "$FINAL_LOG"
          fi

          python3 - "$FINAL_LOG" "$READY" "$WINNER" <<'PY' | tee "$PROOF"
          import math,re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          ready=int(sys.argv[2]); winner=int(sys.argv[3])

          airborne=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          landed=re.search(r'GATE_E_M1_NATIVE_JUMP_LANDED[^\n]*player_tick=(\d+)',text)
          if not airborne or not landed:
              print(f'REFERENCE_OWNER_V3_ROOT_PROOF classification=JUMP_NOT_EXERCISED ready={ready} attempt={winner} video_recorded=false')
              raise SystemExit(2)
          a_tick=int(airborne.group(1)); l_tick=int(landed.group(1))
          if l_tick <= a_tick:
              raise SystemExit(f'invalid jump interval {a_tick}-{l_tick}')

          pose_rx=re.compile(
              r'REFERENCE_OWNER_V3_CONTINUOUS_POSE player_tick=(\d+) owner_id=(\d+) owner_age=(\d+) '
              r'on_ground=(true|false) yaw_delta=([-+0-9.eE]+)'
          )
          poses=[(int(t),int(o),int(age),g=='true',float(y)) for t,o,age,g,y in pose_rx.findall(text)]
          airborne_poses=[r for r in poses if a_tick <= r[0] <= l_tick and not r[3]]
          if len(airborne_poses) < 3:
              raise SystemExit(f'insufficient V3 pose rows during airborne interval: {len(airborne_poses)}')
          owner_counts={}
          for r in airborne_poses:
              owner_counts[r[1]]=owner_counts.get(r[1],0)+1
          jump_owner=max(owner_counts,key=owner_counts.get)
          jump_rows=[r for r in airborne_poses if r[1]==jump_owner]
          unique_jump_ticks=len({r[0] for r in jump_rows})
          jump_span=max(r[0] for r in jump_rows)-min(r[0] for r in jump_rows)
          max_air_age=max(r[2] for r in jump_rows)

          continuity_rx=re.compile(
              r'GATE_E_CARRIAGE_LOCAL_CONTINUITY[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)'
              r'[^\n]*local_feet=\(([-+0-9.eE]+), ([-+0-9.eE]+), ([-+0-9.eE]+)\)'
          )
          local_rows=[]
          for t,o,x,y,z in continuity_rx.findall(text):
              t=int(t); o=int(o)
              if a_tick <= t <= l_tick and o==jump_owner:
                  local_rows.append((t,float(x),float(y),float(z)))
          local_rows.sort()
          if len(local_rows) < 2:
              raise SystemExit(f'insufficient owner-local jump rows: {len(local_rows)} owner={jump_owner}')
          x0,z0=local_rows[0][1],local_rows[0][3]
          max_local_drift=max(math.hypot(x-x0,z-z0) for _,x,_,z in local_rows)
          max_local_step=max(
              [math.hypot(b[1]-a[1],b[3]-a[3]) for a,b in zip(local_rows,local_rows[1:])] or [0.0]
          )
          if max_local_drift > 1.5:
              raise SystemExit(f'owner-local airborne drift too large: {max_local_drift:.6f}')
          if max_local_step > 0.75:
              raise SystemExit(f'owner-local one-tick discontinuity too large: {max_local_step:.6f}')

          turn_rx=re.compile(
              r'REFERENCE_OWNER_V2_CAMERA_REFERENCE_FRAME_PROOF sample=(\d+) player_tick=(\d+) owner_id=(-?\d+)'
              r'.*?horizontal_error=([-+0-9.eE]+) owner_heading=([-+0-9.eE]+)'
          )
          groups={}
          for _,t,o,e,h in turn_rx.findall(text):
              groups.setdefault(int(o),[]).append((int(t),float(e),float(h)))
          candidates=[]
          for owner,rows in groups.items():
              if len({t for t,_,_ in rows}) < 2:
                  continue
              hs=[h for _,_,h in rows]
              un=[hs[0]]; prev=hs[0]
              for h in hs[1:]:
                  d=(h-prev+math.pi)%(2*math.pi)-math.pi
                  un.append(un[-1]+d); prev=h
              span=max(un)-min(un)
              if span>=0.01:
                  candidates.append((span,owner,rows))
          if not candidates:
              print('REFERENCE_OWNER_V3_ROOT_PROOF classification=TURN_NOT_EXERCISED_WHILE_OWNER_ACTIVE'
                    f' ready={ready} attempt={winner} jump_owner={jump_owner} video_recorded=false')
              raise SystemExit(2)

          heading_span,turn_owner,turn_rows=max(candidates,key=lambda x:x[0])
          if turn_owner != jump_owner:
              raise SystemExit(f'owner changed between jump and turn: jump={jump_owner} turn={turn_owner}')
          max_camera_error=max(e for _,e,_ in turn_rows)
          turn_tick_min=min(t for t,_,_ in turn_rows)
          turn_tick_max=max(t for t,_,_ in turn_rows)
          turn_pose=[r for r in poses if r[1]==turn_owner and turn_tick_min-2 <= r[0] <= turn_tick_max+2]
          if not turn_pose:
              raise SystemExit('no V3 pose rows during active-owner turn window')
          max_abs_yaw=max(abs(r[4]) for r in turn_pose)
          if max_abs_yaw <= 1.0e-5:
              raise SystemExit(f'V3 previous->current yaw transform never activated during real turn: {max_abs_yaw}')

          print(
              'REFERENCE_OWNER_V3_ROOT_PROOF classification=CONTINUOUS_OWNER_POSE_JUMP_TURN_PROVEN '
              f'attempt={winner} owner={jump_owner} airborne_tick={a_tick} landed_tick={l_tick} '
              f'jump_pose_ticks={unique_jump_ticks} jump_pose_span={jump_span} max_air_owner_age={max_air_age} '
              f'max_local_drift={max_local_drift:.6f} max_local_step={max_local_step:.6f} '
              f'heading_span_deg={math.degrees(heading_span):.6f} max_abs_pose_yaw_delta={max_abs_yaw:.9f} '
              f'max_camera_horizontal_error={max_camera_error:.9f} '
              'fixed_ttl=false jump_lease=false one_pose_owner=true create_collision_geometry_authoritative=true '
              'video_recorded=false final_ready=false'
          )
          PY

          grep -E 'REFERENCE_OWNER_V3_ROOT_PROOF|REFERENCE_OWNER_V3_CONTINUOUS_POSE|GATE_E_M1_NATIVE_JUMP_(AIRBORNE|LANDED)|REFERENCE_OWNER_V2_CAMERA_REFERENCE_FRAME_PROOF' "$FINAL_LOG" | tail -220 || true

      - name: Upload V3 root-proof diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reference-owner-v3-continuous-pose-proof
          path: |
            reference-owner-v3-continuous-pose.log
            reference-owner-v3-continuous-pose-proof.txt
            reference-owner-v3-xvfb.log
            reference-owner-v3-attempt-*.log
          if-no-files-found: warn

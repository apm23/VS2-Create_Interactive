name: m1-reference-owner-v3-seam-trace

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_vs2_26_2_reference_owner_v3_seam_trace.py'
      - '.github/workflows/m1-reference-owner-v3-seam-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seam-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compose exact V3 plus read-only seam trace
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          python3 scripts/prepare_vs2_26_2_phase205.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v1.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_composefix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_schedule_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_authority_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v2_camera_fix.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v3_continuous_pose.py
          python3 scripts/prepare_vs2_26_2_reference_owner_v3_seam_trace.py
          python3 scripts/prepare_vs2_26_2_natural_landing_harness_v2.py
          python3 scripts/prepare_vs2_26_2_camera_external_reference_proof.py
          grep -q 'REFERENCE_OWNER_V3_SEAM_NATIVE' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt
          grep -q 'currentCreateCollisionWorldToLocal' upstream/common/src/main/kotlin/org/valkyrienskies/mod/common/util/ExternalReferenceFrameResolver.kt
          echo 'REFERENCE_OWNER_V3_SEAM_SOURCE_CONTRACT read_only=true gameplay_mutated=false video_recorded=false'

      - name: Compile exact seam proof composition
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:compileJava

      - name: Reconstruct pristine verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          rm -rf v3-pristine
          mkdir v3-pristine
          unzip -q train-world-state-r0v3.zip -d v3-pristine
          test -d 'v3-pristine/train build 1'

      - name: Prefetch client assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Trace actual V3 seam through native jump and turn
        working-directory: upstream
        timeout-minutes: 16
        env:
          JAVA_TOOL_OPTIONS: -Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true -Dvs2.referenceOwnerV3Trace=true -Dvs2.referenceOwnerV3SeamTrace=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          FINAL_LOG=../reference-owner-v3-seam-trace.log
          PROOF=../reference-owner-v3-seam-trace-proof.txt
          XVFB_LOG=../reference-owner-v3-seam-xvfb.log
          rm -f "$FINAL_LOG" "$PROOF" "$XVFB_LOG" ../reference-owner-v3-seam-attempt-*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$XVFB_LOG" 2>&1 &
          XVFB_PID=$!
          CLIENT_PID=''
          cleanup() {
            if [ -n "$CLIENT_PID" ]; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          WINNER=0
          for ATTEMPT in 1 2 3; do
            LOG=../reference-owner-v3-seam-attempt-${ATTEMPT}.log
            rm -rf fabric/run/crash-reports fabric/run/saves/train-v3-seam
            rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log "$LOG"
            mkdir -p fabric/run/saves
            cp -a '../v3-pristine/train build 1' fabric/run/saves/train-v3-seam

            ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-v3-seam' > "$LOG" 2>&1 &
            CLIENT_PID=$!

            fatal_state() {
              grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' "$LOG" \
                || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
                || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
                || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
            }

            ATTEMPT_READY=0
            for i in $(seq 1 210); do
              if grep -q 'GATE_E_M1_NATIVE_JUMP_AIRBORNE' "$LOG" \
                && grep -q 'GATE_E_M1_NATIVE_JUMP_LANDED' "$LOG" \
                && grep -q 'REFERENCE_OWNER_V3_SEAM_NATIVE' "$LOG"; then
                ATTEMPT_READY=1
                READY=1
                WINNER=$ATTEMPT
                break
              fi
              if fatal_state; then tail -280 "$LOG"; exit 1; fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
                wait "$CLIENT_PID" || true
                CLIENT_PID=''
                break
              fi
              sleep 1
            done

            if [ -n "$CLIENT_PID" ]; then
              kill "$CLIENT_PID" 2>/dev/null || true
              wait "$CLIENT_PID" 2>/dev/null || true
              CLIENT_PID=''
            fi
            if [ "$ATTEMPT_READY" -eq 1 ]; then
              cp "$LOG" "$FINAL_LOG"
              break
            fi
          done

          if [ "$READY" -ne 1 ]; then
            cat ../reference-owner-v3-seam-attempt-*.log > "$FINAL_LOG"
          fi

          python3 - "$FINAL_LOG" "$READY" "$WINNER" <<'PY' | tee "$PROOF"
          import math,re,sys
          text=re.sub(r'\x1b\[[0-9;]*[mK]','',open(sys.argv[1],encoding='utf-8',errors='replace').read())
          ready=int(sys.argv[2]); winner=int(sys.argv[3])
          airborne=re.search(r'GATE_E_M1_NATIVE_JUMP_AIRBORNE[^\n]*player_tick=(\d+)',text)
          landed=re.search(r'GATE_E_M1_NATIVE_JUMP_LANDED[^\n]*player_tick=(\d+)',text)
          if not airborne or not landed:
              print(f'REFERENCE_OWNER_V3_SEAM_PROOF classification=JUMP_NOT_EXERCISED ready={ready} attempt={winner} gameplay_mutated=false video_recorded=false')
              raise SystemExit(2)
          a_tick=int(airborne.group(1)); l_tick=int(landed.group(1))

          rows=[]
          for line in text.splitlines():
              if 'REFERENCE_OWNER_V3_SEAM_NATIVE ' not in line:
                  continue
              tail=line.split('REFERENCE_OWNER_V3_SEAM_NATIVE ',1)[1]
              kv={}
              for token in tail.split():
                  if '=' in token:
                      k,v=token.split('=',1); kv[k]=v
              try:
                  row={k:float(v) for k,v in kv.items() if k not in {'owner_id','player_tick','gameplay_mutated','writer'}}
                  row['owner_id']=int(kv['owner_id']); row['player_tick']=int(kv['player_tick'])
              except (KeyError,ValueError):
                  continue
              rows.append(row)
          jump_rows=[r for r in rows if a_tick <= r['player_tick'] <= l_tick]
          if len(jump_rows) < 3:
              raise SystemExit(f'insufficient seam rows in native jump interval: {len(jump_rows)}')
          owners={}
          for r in jump_rows: owners[r['owner_id']]=owners.get(r['owner_id'],0)+1
          owner=max(owners,key=owners.get)
          rows=[r for r in rows if r['owner_id']==owner]
          jump_rows=[r for r in jump_rows if r['owner_id']==owner]

          def finite(*xs): return all(math.isfinite(x) for x in xs)
          position_errors=[]; added_errors=[]; yaw_local_errors=[]; yaw_steps=[]
          for r in rows:
              req=['resolver_local_x','resolver_local_y','resolver_local_z','create_target_local_x','create_target_local_y','create_target_local_z',
                   'world_x','world_y','world_z','target_x','target_y','target_z','added_x','added_y','added_z',
                   'resolver_local_yaw','create_target_local_yaw','added_yaw']
              if not all(k in r for k in req):
                  continue
              vals=[r[k] for k in req]
              if not finite(*vals):
                  continue
              position_errors.append(math.sqrt(
                  (r['resolver_local_x']-r['create_target_local_x'])**2+
                  (r['resolver_local_y']-r['create_target_local_y'])**2+
                  (r['resolver_local_z']-r['create_target_local_z'])**2))
              added_errors.append(math.sqrt(
                  ((r['target_x']-r['world_x'])-r['added_x'])**2+
                  ((r['target_y']-r['world_y'])-r['added_y'])**2+
                  ((r['target_z']-r['world_z'])-r['added_z'])**2))
              dyaw=(r['resolver_local_yaw']-r['create_target_local_yaw']+math.pi)%(2*math.pi)-math.pi
              yaw_local_errors.append(abs(dyaw))
              yaw_steps.append(abs(r['added_yaw']))

          if len(position_errors) < 3:
              raise SystemExit('insufficient finite same-tick seam rows')
          max_pos=max(position_errors); max_added=max(added_errors); max_yaw=max(yaw_local_errors)
          max_step=max(yaw_steps) if yaw_steps else 0.0
          jump_pos=max(
              math.sqrt((r['resolver_local_x']-r['create_target_local_x'])**2+
                        (r['resolver_local_y']-r['create_target_local_y'])**2+
                        (r['resolver_local_z']-r['create_target_local_z'])**2)
              for r in jump_rows
              if finite(r.get('resolver_local_x',math.nan),r.get('resolver_local_y',math.nan),r.get('resolver_local_z',math.nan),
                        r.get('create_target_local_x',math.nan),r.get('create_target_local_y',math.nan),r.get('create_target_local_z',math.nan))
          )

          if max_added > 1e-7:
              classification='NATIVE_ADDED_DELTA_INCONSISTENT'
          elif max_pos > 0.05:
              classification='POSITION_SEAM_DIVERGED_FROM_CREATE_COLLISION_FRAME'
          elif max_yaw > 0.05:
              classification='YAW_SEAM_DIVERGED_FROM_CREATE_COLLISION_FRAME'
          else:
              classification='POSITION_AND_YAW_SEAM_ALIGNED_WITH_CREATE_COLLISION_FRAME'

          print(
              'REFERENCE_OWNER_V3_SEAM_PROOF '
              f'classification={classification} attempt={winner} owner={owner} airborne_tick={a_tick} landed_tick={l_tick} '
              f'jump_rows={len(jump_rows)} total_rows={len(rows)} max_position_local_error={max_pos:.9f} '
              f'max_jump_position_local_error={jump_pos:.9f} max_native_added_consistency_error={max_added:.9f} '
              f'max_yaw_local_error_rad={max_yaw:.9f} max_abs_native_added_yaw_deg={max_step:.9f} '
              'gameplay_mutated=false video_recorded=false final_ready=false'
          )
          if classification == 'NATIVE_ADDED_DELTA_INCONSISTENT': raise SystemExit(3)
          PY

      - name: Upload seam trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-owner-v3-seam-trace
          path: |
            reference-owner-v3-seam-trace.log
            reference-owner-v3-seam-trace-proof.txt
            reference-owner-v3-seam-xvfb.log
            reference-owner-v3-seam-attempt-*.log
          if-no-files-found: warn

name: production-world-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/world/r0v3.part-*'
      - '.ci/world/r0v3.sha256'
      - 'scripts/prepare_vs2_26_2*.py'
      - '.github/workflows/production-world-smoke.yml'

jobs:
  real-train-production-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare 26.2 production-isolated client
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done
          python3 scripts/prepare_vs2_26_2_phase98.py
          grep -q 'vs2.productionSmoke' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'vs2.productionSmokeFixture' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'vs2.createCarryCompat' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'GATE_F_NATIVE_RIGHT_CLICK_ENTRYPOINT' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'GATE_E_CARRIAGE_LOCAL_CONTINUITY' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java
          grep -q 'GATE_E_PHASE130_REPLAY_GUARD' upstream/fabric/src/main/java/org/valkyrienskies/mod/fabric/client/GateEClientProbe.java

      - name: Reconstruct verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          cat "${parts[@]}" > train-world-state-r0v3.b64
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')" = "$EXPECTED"
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          test -f 'world-fixture/train build 1/level.dat'
          test -f 'world-fixture/train build 1/data/create/tracks.dat'

      - name: Install pristine save into client game directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-production-smoke
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-production-smoke
          test -f upstream/fabric/run/saves/train-production-smoke/data/create/tracks.dat

      - name: Prefetch Minecraft client assets with retry
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Load real train world with production carry and test-only support fixture
        working-directory: upstream
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: '-Dvs2.createCarryCompat=true -Dvs2.productionSmoke=true -Dvs2.productionSmokeFixture=true'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -euo pipefail
          rm -f ../production-world-smoke.log ../production-world-xvfb.log
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > ../production-world-xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-production-smoke' > ../production-world-smoke.log 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' ../production-world-smoke.log \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          MODE_READY=0
          WORLD_READY=0
          for i in $(seq 1 900); do
            if grep -q 'VS2_CREATE_CARRY_COMPAT_MODE ci_harness=false explicit_opt_in=true' ../production-world-smoke.log; then MODE_READY=1; fi
            if grep -Eq 'Starting integrated minecraft server|Starting integrated server' ../production-world-smoke.log \
              && grep -Eq 'Preparing level|Preparing spawn area|Time elapsed|Loaded [0-9]+ advancements' ../production-world-smoke.log \
              && grep -Eq '(^|[[:space:]])- create 6\.0\.9-1([[:space:]]|$)' ../production-world-smoke.log \
              && grep -Eq '(^|[[:space:]])- railways ' ../production-world-smoke.log \
              && grep -Eq '(^|[[:space:]])- copycats ' ../production-world-smoke.log \
              && grep -q 'Initialized VSCore on Fabric!' ../production-world-smoke.log; then WORLD_READY=1; fi
            if [ "$MODE_READY" -eq 1 ] && [ "$WORLD_READY" -eq 1 ]; then break; fi
            if fatal_state; then tail -260 ../production-world-smoke.log; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; tail -260 ../production-world-smoke.log; exit 1; fi
            sleep 1
          done
          test "$MODE_READY" -eq 1
          test "$WORLD_READY" -eq 1

          FIXTURE_READY=0
          for i in $(seq 1 90); do
            if grep -Eq 'GATE_D_FIXTURE_PLAYER_REPOSITIONED|GATE_E_FIXTURE_' ../production-world-smoke.log; then FIXTURE_READY=1; break; fi
            if fatal_state; then exit 1; fi
            sleep 1
          done
          test "$FIXTURE_READY" -eq 1
          if grep -q 'VS2_CREATE_CARRY_COMPAT_MODE ci_harness=true' ../production-world-smoke.log; then
            echo 'Production carry mode unexpectedly entered the normal CI harness.'
            exit 1
          fi

          CARRIAGE_PRESENT=0
          TRAIN_MOVED=0
          for i in $(seq 1 180); do
            grep -q 'GATE_D_CARRIAGE_PRESENT' ../production-world-smoke.log && CARRIAGE_PRESENT=1 || true
            grep -q 'GATE_D_TRAIN_MOVED' ../production-world-smoke.log && TRAIN_MOVED=1 || true
            if [ "$CARRIAGE_PRESENT" -eq 1 ] && [ "$TRAIN_MOVED" -eq 1 ]; then break; fi
            if fatal_state; then exit 1; fi
            sleep 1
          done
          test "$CARRIAGE_PRESENT" -eq 1
          test "$TRAIN_MOVED" -eq 1

          CARRY=0
          for i in $(seq 1 40); do
            if python3 - ../production-world-smoke.log <<'PY'
          import math, re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          continuity_pattern = re.compile(
              r'GATE_E_CARRIAGE_LOCAL_CONTINUITY[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)'
              r'[^\n]*local_feet=\(([-+0-9.eE]+), ([-+0-9.eE]+), ([-+0-9.eE]+)\)'
              r'[^\n]*broadphase=(true|false)[^\n]*on_ground=(true|false)'
              r'[^\n]*baseline_frame=(true|false)')
          guard_pattern = re.compile(
              r'GATE_E_PHASE130_REPLAY_GUARD[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)'
              r'[^\n]*baseline_captured=(true|false)[^\n]*physical_support=(true|false)'
              r'[^\n]*collision_eligible=(true|false)[^\n]*broadphase=(true|false)')
          carry_delta_pattern = re.compile(
              r'GATE_E_CLIENT_CARRY_DELTA[^\n]*carriage_id=(\d+)[^\n]*drift_sq=([-+0-9.eE]+)'
              r'[^\n]*contact_now=(true|false)[^\n]*on_ground_now=(true|false)')
          guards = {
              (int(m.group(1)), int(m.group(2))): tuple(value == 'true' for value in m.groups()[2:])
              for m in guard_pattern.finditer(text)
          }
          stable_delta_carriages = {
              int(m.group(1))
              for m in carry_delta_pattern.finditer(text)
              if float(m.group(2)) <= 0.01 and m.group(3) == 'true' and m.group(4) == 'true'
          }
          raw_samples = []
          samples = []
          for match in continuity_pattern.finditer(text):
              tick, carriage = map(int, match.groups()[:2])
              x, y, z = map(float, match.groups()[2:5])
              broadphase, on_ground, baseline_frame = match.groups()[5:]
              raw_samples.append((
                  tick, carriage, x, y, z,
                  broadphase == 'true',
                  on_ground == 'true',
                  baseline_frame == 'true',
              ))
              guard = guards.get((tick, carriage))
              if guard is None:
                  continue
              baseline_captured, physical_support, collision_eligible, guard_broadphase = guard
              samples.append((
                  tick, carriage, x, y, z,
                  broadphase == 'true' and guard_broadphase,
                  on_ground == 'true',
                  baseline_captured,
                  physical_support,
                  collision_eligible,
                  baseline_frame == 'true',
              ))

          def best_streak(require_physical_support, max_step):
              streak = []
              best = []
              for sample in samples:
                  broadphase, on_ground, baseline_captured, physical_support, collision_eligible, baseline_frame = sample[5:11]
                  valid = broadphase and on_ground and baseline_captured and collision_eligible and baseline_frame
                  if require_physical_support:
                      valid = valid and physical_support
                  if not valid:
                      streak = []
                      continue
                  if not streak:
                      streak = [sample]
                  else:
                      prev = streak[-1]
                      local_step = math.dist(sample[2:5], prev[2:5])
                      if sample[0] == prev[0] + 1 and sample[1] == prev[1] and local_step <= max_step:
                          streak.append(sample)
                      else:
                          streak = [sample]
                  if len(streak) > len(best):
                      best = list(streak)
              return best

          def best_raw_streak(max_step):
              streak = []
              best = []
              for sample in raw_samples:
                  broadphase, on_ground, baseline_frame = sample[5:8]
                  valid = broadphase and on_ground and baseline_frame
                  if not valid:
                      streak = []
                      continue
                  if not streak:
                      streak = [sample]
                  else:
                      prev = streak[-1]
                      local_step = math.dist(sample[2:5], prev[2:5])
                      if sample[0] == prev[0] + 1 and sample[1] == prev[1] and local_step <= max_step:
                          streak.append(sample)
                      else:
                          streak = [sample]
                  if len(streak) > len(best):
                      best = list(streak)
              return best

          strict = best_streak(True, 0.05)
          stable_local = best_streak(False, 0.01)
          raw_stable_local = best_raw_streak(0.01)
          if len(strict) >= 5:
              best, proof = strict, 'physical_support_stable'
          elif len(stable_local) >= 5:
              best, proof = stable_local, 'carriage_local_stable'
          elif len(strict) >= 3 and strict[0][1] in stable_delta_carriages:
              best, proof = strict, 'carry_delta_plus_local_stable'
          elif len(raw_stable_local) >= 3 and raw_stable_local[0][1] in stable_delta_carriages:
              best, proof = raw_stable_local, 'direct_continuity_plus_carry_delta'
          else:
              best, proof = [], 'none'
          if best:
              start, end = best[0], best[-1]
              span = math.dist(start[2:5], end[2:5])
              print(f'PRODUCTION_CARRY {proof} carriage_id={start[1]} ticks={start[0]}-{end[0]} samples={len(best)} span={span:.9f}')
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then CARRY=1; break; fi
            if fatal_state; then exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$CARRY" -ne 1 ]; then
            echo 'Production world did not prove sustained carriage-local carry continuity.'
            grep -E 'GATE_D_TRAIN_MOVED|GATE_E_CARRIAGE_LOCAL_CONTINUITY|GATE_E_CLIENT_CARRY_DELTA|GATE_E_PHASE85_CARRY_REPLAY|GATE_E_PHASE130_REPLAY_GUARD' ../production-world-smoke.log | tail -320 || true
            exit 1
          fi

          INTERACTION_TARGET_READY=0
          NATIVE_RAY_USED=0
          for i in $(seq 1 60); do
            if grep -Eq 'GATE_F_CREATE_NATIVE_RAY_SETTLED.*hit=[^;]+;face=' ../production-world-smoke.log; then
              echo 'PRODUCTION_INTERACTION native_create_ray_ready'
              INTERACTION_TARGET_READY=1
              NATIVE_RAY_USED=1
              break
            fi
            if grep -Eq 'GATE_F_CONTRAPTION_EXACT_LOCAL_HIT.*exact_hit=true' ../production-world-smoke.log \
              && grep -Eq 'GATE_F_SYNTHETIC_BLOCK_HIT_CONSTRUCTED.*fields_match=true' ../production-world-smoke.log \
              && grep -Eq 'GATE_F_INTERACTION_DISPATCH_CANDIDATE.*exact_handle_player_interaction=true' ../production-world-smoke.log; then
              echo 'PRODUCTION_INTERACTION validated_contraption_local_fallback'
              INTERACTION_TARGET_READY=1
              break
            fi
            if fatal_state; then exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$INTERACTION_TARGET_READY" -ne 1 ]; then
            echo 'Production world did not prove an exact moving-contraption interaction target.'
            grep -E 'GATE_F_CREATE_NATIVE_RAY_SETTLED|GATE_F_CONTRAPTION_EXACT_LOCAL_HIT|GATE_F_SYNTHETIC_BLOCK_HIT_CONSTRUCTED|GATE_F_INTERACTION_DISPATCH_CANDIDATE' ../production-world-smoke.log | tail -160 || true
            exit 1
          fi

          RIGHT_CLICK_ENTRYPOINT_READY=0
          for i in $(seq 1 60); do
            if grep -Eq 'GATE_F_NATIVE_RIGHT_CLICK_ENTRYPOINT.*exact=true' ../production-world-smoke.log; then
              RIGHT_CLICK_ENTRYPOINT_READY=1
              break
            fi
            if fatal_state; then exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$RIGHT_CLICK_ENTRYPOINT_READY" -ne 1 ]; then
            echo 'Production world did not expose the exact Create moving-contraption right-click entrypoint.'
            grep -E 'GATE_F_NATIVE_RIGHT_CLICK_ENTRYPOINT|GATE_F_INTERACTION_DISPATCH_CANDIDATE' ../production-world-smoke.log | tail -120 || true
            exit 1
          fi

          if [ "$NATIVE_RAY_USED" -eq 1 ]; then
            NATIVE_RIGHT_CLICK_CONFIRMED=0
            for i in $(seq 1 60); do
              if grep -Eq 'GATE_F_NATIVE_RIGHT_CLICK_PROBE.*invoked=true.*handled=true.*hand_empty_after=true' ../production-world-smoke.log \
                && grep -Eq 'GATE_F_NATIVE_RIGHT_CLICK_CONFIRMED.*handled=true' ../production-world-smoke.log; then
                echo 'PRODUCTION_INTERACTION native_right_click_dispatch_confirmed'
                NATIVE_RIGHT_CLICK_CONFIRMED=1
                break
              fi
              if fatal_state; then exit 1; fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$NATIVE_RIGHT_CLICK_CONFIRMED" -ne 1 ]; then
              echo 'Native Create ray was ready but the fixture did not prove an actual handled empty-hand right-click dispatch.'
              grep -E 'GATE_F_CREATE_NATIVE_RAY_SETTLED|GATE_F_NATIVE_RIGHT_CLICK_ENTRYPOINT|GATE_F_NATIVE_RIGHT_CLICK_PROBE|GATE_F_NATIVE_RIGHT_CLICK_CONFIRMED' ../production-world-smoke.log | tail -160 || true
              exit 1
            fi
          fi

          PLACEMENT_SYNC_READY=0
          for i in $(seq 1 60); do
            if grep -Eq 'VS2_CREATE_CELL_REPLICATION_CONFIRMED.*state=Block\{minecraft:stone\}.*state_match=true.*packet_authoritative=true' ../production-world-smoke.log \
              && grep -Eq 'GATE_F_NATIVE_PLACEMENT_CLIENT_EXACT_SYNC.*state=Block\{minecraft:stone\}.*synced=true' ../production-world-smoke.log; then
              echo 'PRODUCTION_PLACEMENT authoritative_moving_cell_synced'
              PLACEMENT_SYNC_READY=1
              break
            fi
            if fatal_state; then exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$PLACEMENT_SYNC_READY" -ne 1 ]; then
            echo 'Production world did not prove authoritative new-cell placement replication on the moving carriage.'
            grep -E 'VS2_CREATE_CELL_REPLICATION_CONFIRMED|GATE_F_NATIVE_PLACEMENT_TARGET_PUBLISHED|GATE_F_NATIVE_PLACEMENT_CLIENT_EXACT_SYNC' ../production-world-smoke.log | tail -160 || true
            exit 1
          fi

          if fatal_state; then exit 1; fi
          if ! kill -0 "$CLIENT_PID" 2>/dev/null; then wait "$CLIENT_PID" || true; exit 1; fi
          echo 'Production sustained carriage-local carry continuity, interaction targeting/entrypoint, confirmed native dispatch when available, and authoritative moving-carriage placement replication passed.'

      - name: Upload production real-world diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs2-production-real-train-world-smoke-log
          path: |
            production-world-smoke.log
            production-world-xvfb.log
          if-no-files-found: warn
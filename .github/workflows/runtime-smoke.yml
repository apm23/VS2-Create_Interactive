name: runtime-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/runtime-smoke.yml'

permissions:
  contents: write

jobs:
  dedicated-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5
      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare 26.2 runtime port through Phase 50
        run: |
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..50}.py; do python3 "$script"; done
      - name: Verify runServer task exists
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:tasks --all | tee ../tasks.txt
          grep -E '(^|[[:space:]])runServer([[:space:]]|$)' ../tasks.txt
      - name: Dedicated server boot, extended idle, and clean shutdown
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          printf 'online-mode=false\n' > fabric/run/server.properties
          rm -f ../server.in ../runtime-smoke.log
          mkfifo ../server.in
          exec 3<>../server.in
          ./gradlew --no-daemon :fabric:runServer < ../server.in > ../runtime-smoke.log 2>&1 &
          GRADLE_PID=$!
          cleanup() { if kill -0 "$GRADLE_PID" 2>/dev/null; then kill "$GRADLE_PID" 2>/dev/null || true; fi; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 210); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' ../runtime-smoke.log; then READY=1; break; fi
            if grep -Eiq 'Exception in server tick loop|Could not execute entrypoint|Mixin (apply|prepare) failed|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)' ../runtime-smoke.log; then echo 'Fatal runtime signature detected before ready.'; cat ../runtime-smoke.log; exit 1; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then echo 'Server process exited before ready.'; cat ../runtime-smoke.log; wait "$GRADLE_PID" || true; exit 1; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then echo 'Server did not reach ready state within 210 seconds.'; cat ../runtime-smoke.log; exit 1; fi
          for mod in 'create 6\.0\.9-1' 'railways ' 'copycats '; do
            if ! grep -Eq "(^|[[:space:]])- ${mod}" ../runtime-smoke.log; then echo "Expected train runtime mod not observed: ${mod}"; cat ../runtime-smoke.log; exit 1; fi
          done
          echo 'Server reached ready state with Create+VS2+Railways+Copycats; holding 45 seconds for async physics/runtime failures...'
          sleep 45
          if grep -Eiq 'Exception in server tick loop|Could not execute entrypoint|Mixin (apply|prepare) failed|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)' ../runtime-smoke.log; then echo 'Fatal runtime signature detected after extended idle.'; cat ../runtime-smoke.log; exit 1; fi
          echo 'stop' >&3
          exec 3>&-
          STOPPED=0
          for i in $(seq 1 90); do
            if grep -q 'VSPhysicsPipelineStage is fully deleted!' ../runtime-smoke.log && grep -q 'ThreadedAnvilChunkStorage: All dimensions are saved' ../runtime-smoke.log; then STOPPED=1; break; fi
            sleep 1
          done
          if [ "$STOPPED" -ne 1 ]; then echo 'Server did not complete clean VS2/world shutdown.'; cat ../runtime-smoke.log; exit 1; fi
          if grep -Eq 'Method overwrite conflict for (getLevel|setLevel).*MixinPersistentEntitySectionManager' ../runtime-smoke.log; then echo 'Duplicate shipyard PersistentEntitySectionManager mixin conflict detected.'; exit 1; fi
          if grep -Eq 'ChunkMapAccessor.*callDropChunk.*should be static as its target is' ../runtime-smoke.log; then echo 'ChunkMap dropChunk invoker is still instance-bound despite static MC 26.2 target.'; exit 1; fi
          for i in $(seq 1 30); do if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi; sleep 1; done
          if kill -0 "$GRADLE_PID" 2>/dev/null; then kill "$GRADLE_PID" 2>/dev/null || true; fi
          wait "$GRADLE_PID" || true
          echo 'Dedicated server Phase 50 train runtime smoke passed.'
      - name: Summarize dedicated smoke diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo '## VS2 26.2 dedicated runtime smoke diagnostics'
            if [ ! -f runtime-smoke.log ]; then
              echo 'No runtime-smoke.log was produced; failure occurred before runServer launched.'
              exit 0
            fi
            echo
            echo '### Fatal/error context'
            echo '```text'
            MATCHES=$(grep -Ein 'Exception in server tick loop|Could not execute entrypoint|Mixin (apply|prepare) failed|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError|Caused by:|Exception|ERROR|WARN' runtime-smoke.log | tail -80 || true)
            if [ -n "$MATCHES" ]; then
              printf '%s\n' "$MATCHES"
            else
              echo 'No configured fatal/error signature matched.'
            fi
            echo '```'
            echo
            echo '### Last 120 runtime lines'
            echo '```text'
            tail -120 runtime-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs2-26.2-runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: warn
      - name: Persist latest failed runtime diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo 'VS2 26.2 dedicated runtime smoke failure diagnostic'
            echo "source_commit=${GITHUB_SHA}"
            echo
            if [ ! -f runtime-smoke.log ]; then
              echo 'No runtime-smoke.log was produced.'
            else
              echo '=== fatal/error context (last 80 matches) ==='
              grep -Ein 'Exception in server tick loop|Could not execute entrypoint|Mixin (apply|prepare) failed|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError|Caused by:|Exception|ERROR|WARN' runtime-smoke.log | tail -80 || true
              echo
              echo '=== last 160 runtime lines ==='
              tail -160 runtime-smoke.log
            fi
          } > diagnostics/latest-runtime-smoke.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/latest-runtime-smoke.txt
          if git diff --cached --quiet; then
            echo 'Diagnostic content unchanged; nothing to persist.'
            exit 0
          fi
          git commit -m 'ci: record latest dedicated runtime failure'
          git pull --rebase origin main
          git push origin HEAD:main

name: runtime-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/runtime-smoke.yml'

jobs:
  dedicated-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5
      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare 26.2 runtime port
        run: |
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..34}.py; do python3 "$script"; done
      - name: Verify runServer task exists
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:tasks --all | tee ../tasks.txt
          grep -E '(^|[[:space:]])runServer([[:space:]]|$)' ../tasks.txt
      - name: Dedicated server boot, idle, and clean shutdown
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          printf 'online-mode=false\n' > fabric/run/server.properties
          rm -f ../server.in ../runtime-smoke.log
          mkfifo ../server.in
          exec 3<>../server.in
          ./gradlew --no-daemon :fabric:runServer < ../server.in > ../runtime-smoke.log 2>&1 &
          GRADLE_PID=$!
          cleanup() { if kill -0 "$GRADLE_PID" 2>/dev/null; then kill "$GRADLE_PID" 2>/dev/null || true; fi; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 210); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' ../runtime-smoke.log; then READY=1; break; fi
            if grep -Eiq 'Exception in server tick loop|Could not execute entrypoint|Mixin apply failed|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)' ../runtime-smoke.log; then echo 'Fatal runtime signature detected before ready.'; cat ../runtime-smoke.log; exit 1; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then echo 'Server process exited before ready.'; cat ../runtime-smoke.log; wait "$GRADLE_PID" || true; exit 1; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then echo 'Server did not reach ready state within 210 seconds.'; cat ../runtime-smoke.log; exit 1; fi
          echo 'Server reached ready state; holding for async physics/runtime failures...'
          sleep 15
          if grep -Eiq 'Exception in server tick loop|Could not execute entrypoint|Mixin apply failed|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)' ../runtime-smoke.log; then echo 'Fatal runtime signature detected after ready.'; cat ../runtime-smoke.log; exit 1; fi
          echo 'stop' >&3
          exec 3>&-
          STOPPED=0
          for i in $(seq 1 90); do
            if grep -q 'VSPhysicsPipelineStage is fully deleted!' ../runtime-smoke.log && grep -q 'ThreadedAnvilChunkStorage: All dimensions are saved' ../runtime-smoke.log; then STOPPED=1; break; fi
            sleep 1
          done
          if [ "$STOPPED" -ne 1 ]; then echo 'Server did not complete clean VS2/world shutdown.'; cat ../runtime-smoke.log; exit 1; fi
          # Gradle/Architectury may remain alive briefly after Minecraft and VS physics have fully stopped.
          for i in $(seq 1 30); do if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi; sleep 1; done
          if kill -0 "$GRADLE_PID" 2>/dev/null; then kill "$GRADLE_PID" 2>/dev/null || true; fi
          wait "$GRADLE_PID" || true
          grep -E 'Done \(|Stopping server|Saving worlds|ThreadedAnvilChunkStorage|VSPhysicsPipelineStage|Physics pipeline ending|Valkyrien|valkyrienskies' ../runtime-smoke.log || true
          echo 'Dedicated server runtime smoke passed.'
      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs2-26.2-runtime-smoke-log
          path: runtime-smoke.log
          if-no-files-found: warn

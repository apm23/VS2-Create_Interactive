name: walk-gate

on:
  workflow_run:
    workflows: ["production-world-smoke"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  moving-train-walk-stability:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source production-world run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          LATEST_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "production-world-smoke")] | sort_by(.created_at) | last | .id // empty')"
          test -n "$LATEST_ID"
          if [ "$SOURCE_ID" != "$LATEST_ID" ]; then
            echo "Ignoring stale production-world workflow_run source ${SOURCE_ID}; newer same-SHA source is ${LATEST_ID}."
            echo 'STALE_SOURCE=true' >> "$GITHUB_ENV"
            exit 0
          fi
          test "$SOURCE_CONCLUSION" = 'success'
          echo 'STALE_SOURCE=false' >> "$GITHUB_ENV"

      - name: Download production-world diagnostics
        if: env.STALE_SOURCE != 'true'
        uses: actions/download-artifact@v5
        with:
          name: vs2-production-real-train-world-smoke-log
          path: diagnostics
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Require bounded same-carriage walking stability
        if: env.STALE_SOURCE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG=diagnostics/production-world-smoke.log
          test -f "$LOG"
          if ! grep -Eq 'GATE_E_PHASE154_FIXTURE_WALK_START.*on_ground=true.*broadphase=true.*fixture_only=true' "$LOG"; then
            echo 'Production world did not start the bounded forward-key walking fixture from stable moving-carriage support.'
            grep -E 'GATE_E_PHASE154_FIXTURE_WALK_(START|SAMPLE|CONFIRMED)|GATE_E_CARRIAGE_LOCAL_CONTINUITY|GATE_E_CLIENT_CARRY_DELTA' "$LOG" | tail -220 || true
            exit 1
          fi
          if ! grep -Eq 'GATE_E_PHASE154_FIXTURE_WALK_CONFIRMED.*on_ground=true.*broadphase=true.*support_healthy=true.*confirmed=true.*sprinting=true.*fixture_only=true' "$LOG"; then
            echo 'Production world did not prove supported native sprinting displacement in one moving carriage frame.'
            grep -E 'GATE_E_PHASE154_FIXTURE_WALK_(START|SAMPLE|CONFIRMED)|GATE_E_CARRIAGE_LOCAL_CONTINUITY|GATE_E_CLIENT_CARRY_DELTA' "$LOG" | tail -260 || true
            exit 1
          fi
          echo 'PRODUCTION_WALK same_carriage_native_sprint_stability_confirmed'

      - name: Freeze full native M1 locomotion contract
        if: env.STALE_SOURCE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG=diagnostics/production-world-smoke.log
          test -f "$LOG"

          grep -Eq 'GATE_E_M1_NATIVE_BACKWARD_CONFIRMED.*grounding_deferred_to_create_contact=true.*fixture_only=true.*vanilla_keymapping=true.*native_motion=true' "$LOG"
          grep -Eq 'GATE_E_M1_NATIVE_STRAFE_CONFIRMED.*grounding_deferred_to_create_contact=true.*fixture_only=true.*vanilla_keymapping=true.*native_motion=true.*direction=right' "$LOG"
          grep -Eq 'GATE_E_M1_NATIVE_JUMP_AIRBORNE.*fixture_only=true.*native_motion=true.*vertical_arc=true' "$LOG"
          grep -Eq 'GATE_E_M1_NATIVE_JUMP_LANDED.*on_ground=true.*fixture_only=true.*natural_fall=true' "$LOG"

          if grep -Eq 'GATE_E_PHASE85_CARRY_REPLAY|GATE_E_PHASE189_SIBLING_NATIVE_GAP_RECOVERY' "$LOG"; then
            echo 'Production locomotion regressed onto compatibility carry recovery.'
            grep -E 'GATE_E_PHASE85_CARRY_REPLAY|GATE_E_PHASE189_SIBLING_NATIVE_GAP_RECOVERY|GATE_E_M1_NATIVE_' "$LOG" | tail -160 || true
            exit 1
          fi

          echo 'PRODUCTION_M1_NATIVE_LOCOMOTION sprint_reverse_strafe_jump_land_replay_free'

      - name: Require stable floor recovery after native landing
        if: env.STALE_SOURCE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOG=diagnostics/production-world-smoke.log
          python3 - "$LOG" <<'PY'
          import re, sys

          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          landed = re.search(r'GATE_E_M1_NATIVE_JUMP_LANDED[^\n]*player_tick=(\d+)[^\n]*on_ground=true[^\n]*natural_fall=true', text)
          if not landed:
              raise SystemExit('native landing marker missing')
          landing_tick = int(landed.group(1))

          continuity = re.compile(
              r'GATE_E_CARRIAGE_LOCAL_CONTINUITY[^\n]*player_tick=(\d+)[^\n]*carriage_id=(\d+)'
              r'[^\n]*broadphase=(true|false)[^\n]*on_ground=(true|false)[^\n]*baseline_frame=(true|false)'
          )
          samples = [
              (int(m.group(1)), int(m.group(2)))
              for m in continuity.finditer(text)
              if int(m.group(1)) >= landing_tick
              and m.group(3) == 'true'
              and m.group(4) == 'true'
              and m.group(5) == 'true'
          ]

          best = 0
          streak = 0
          previous = None
          for sample in samples:
              if previous and sample[0] == previous[0] + 1 and sample[1] == previous[1]:
                  streak += 1
              else:
                  streak = 1
              previous = sample
              best = max(best, streak)

          if best < 3:
              raise SystemExit(f'post-landing grounded carriage-floor continuity too short: best={best}')
          print(f'PRODUCTION_M1_FLOOR_RECOVERY landing_tick={landing_tick} grounded_same_carriage_ticks={best}')
          PY

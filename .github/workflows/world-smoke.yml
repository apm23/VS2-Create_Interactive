name: world-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/world/r0v3.part-*'
      - '.ci/world/r0v3.sha256'
      - 'scripts/prepare_vs2_26_2*.py'
      - '.github/workflows/world-smoke.yml'

jobs:
  real-train-world-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v5

      - name: Checkout pinned VS2 baseline
        uses: actions/checkout@v5
        with:
          repository: Eminai-LeoVinci/VS2
          ref: 0bc19eac8f23258bbe03bdccb929c24d13e93838
          path: upstream

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Phase 54 train runtime baseline
        run: |
          for script in scripts/prepare_vs2_26_2.py scripts/prepare_vs2_26_2_phase{2..54}.py; do python3 "$script"; done

      - name: Reconstruct and validate verified r0v3 train save
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='e78bfb854a0f3ad0bfb87ded836ef322335812d303e51223825f3741f7232556'
          mapfile -t parts < <(find .ci/world -maxdepth 1 -type f -name 'r0v3.part-*' -print | sort -V)
          test "${#parts[@]}" -eq 17
          printf '%s\n' "${parts[@]}" | tee fixture-parts.txt
          cat "${parts[@]}" > train-world-state-r0v3.b64
          test "$(wc -c < train-world-state-r0v3.b64)" -eq 116120
          base64 -d train-world-state-r0v3.b64 > train-world-state-r0v3.zip
          test "$(stat -c%s train-world-state-r0v3.zip)" -eq 87090
          ACTUAL="$(sha256sum train-world-state-r0v3.zip | awk '{print $1}')"
          echo "$ACTUAL  train-world-state-r0v3.zip" | tee fixture-sha256.txt
          test "$ACTUAL" = "$EXPECTED"
          grep -q "$EXPECTED" .ci/world/r0v3.sha256
          unzip -tq train-world-state-r0v3.zip
          rm -rf world-fixture
          mkdir world-fixture
          unzip -q train-world-state-r0v3.zip -d world-fixture
          test -f 'world-fixture/train build 1/level.dat'
          TRACKS='world-fixture/train build 1/data/create/tracks.dat'
          test -f "$TRACKS"
          test "$(stat -c%s "$TRACKS")" -ge 50000
          gzip -cd "$TRACKS" | strings | grep -q 'Hayajiro'

      - name: Install exact save into client game directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/fabric/run/saves
          rm -rf upstream/fabric/run/saves/train-smoke
          mv 'world-fixture/train build 1' upstream/fabric/run/saves/train-smoke
          test -f upstream/fabric/run/saves/train-smoke/data/create/tracks.dat

      - name: Prefetch Minecraft client assets with retry
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :fabric:downloadAssets; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Load verified real train save and run functional Gate D
        working-directory: upstream
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -euo pipefail
          rm -f ../world-smoke.log ../world-smoke-thread-dumps.txt ../xvfb.log
          rm -rf fabric/run/crash-reports
          rm -f fabric/run/hs_err_pid*.log fabric/run/replay_pid*.log

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > ../xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./gradlew --no-daemon :fabric:runClient --args='--quickPlaySingleplayer train-smoke' > ../world-smoke.log 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            if kill -0 "$CLIENT_PID" 2>/dev/null; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if kill -0 "$XVFB_PID" 2>/dev/null; then kill "$XVFB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          fatal_state() {
            grep -Eiq 'Could not execute entrypoint|Mixin (apply|prepare) failed|Exception in server tick loop|Caused by:.*(NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError)|Minecraft has crashed|Exception in thread "Render thread"|Game crashed' ../world-smoke.log \
              || compgen -G 'fabric/run/crash-reports/*' >/dev/null \
              || compgen -G 'fabric/run/hs_err_pid*.log' >/dev/null \
              || compgen -G 'fabric/run/replay_pid*.log' >/dev/null
          }

          WORLD_READY=0
          for i in $(seq 1 900); do
            if grep -Eq 'Starting integrated minecraft server|Starting integrated server' ../world-smoke.log \
              && grep -Eq 'Preparing level|Preparing spawn area|Time elapsed|Loaded [0-9]+ advancements' ../world-smoke.log \
              && grep -Eq '(^|[[:space:]])- create 6\.0\.9-1([[:space:]]|$)' ../world-smoke.log \
              && grep -Eq '(^|[[:space:]])- railways ' ../world-smoke.log \
              && grep -Eq '(^|[[:space:]])- copycats ' ../world-smoke.log \
              && grep -q 'Initialized VSCore on Fabric!' ../world-smoke.log; then WORLD_READY=1; break; fi
            if fatal_state; then echo 'Fatal state while loading verified real train world.'; exit 1; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then echo 'Client exited before world ready.'; wait "$CLIENT_PID" || true; exit 1; fi
            sleep 1
          done
          test "$WORLD_READY" -eq 1
          grep -q 'GATE_D_INPROC_READY' ../world-smoke.log

          CARRIAGE_PRESENT=0
          for i in $(seq 1 120); do
            if grep -q 'GATE_D_CARRIAGE_PRESENT' ../world-smoke.log; then CARRIAGE_PRESENT=1; break; fi
            if fatal_state; then exit 1; fi
            sleep 1
          done
          test "$CARRIAGE_PRESENT" -eq 1

          TRAIN_MOVED=0
          for i in $(seq 1 120); do
            if grep -q 'GATE_D_TRAIN_MOVED' ../world-smoke.log; then TRAIN_MOVED=1; break; fi
            if fatal_state; then exit 1; fi
            sleep 1
          done
          test "$TRAIN_MOVED" -eq 1

          # Phase 54 is telemetry-only. Give the render/client observer a short post-motion
          # window so anchor-adjusted Gate E state is guaranteed to reach the artifact.
          PHASE54=0
          for i in $(seq 1 30); do
            if grep -q 'anchor_state=' ../world-smoke.log; then PHASE54=1; break; fi
            if fatal_state; then exit 1; fi
            sleep 1
          done
          if [ "$PHASE54" -ne 1 ]; then
            echo 'Phase 54 anchor telemetry did not appear.'
            tail -220 ../world-smoke.log
            exit 1
          fi

          if grep -q 'GATE_D_PLAYER_NEAR_START' ../world-smoke.log; then
            if grep -q 'GATE_D_PLAYER_FAR_END' ../world-smoke.log || ! grep -q 'GATE_D_PLAYER_NEAR_END' ../world-smoke.log; then
              echo 'Gate D observed player near the train initially but not after carriage motion.'
              tail -220 ../world-smoke.log
              exit 1
            fi
          fi

          if ! kill -0 "$CLIENT_PID" 2>/dev/null; then echo 'Client exited during functional Gate D.'; wait "$CLIENT_PID" || true; exit 1; fi
          if fatal_state; then echo 'Fatal state during functional Gate D.'; exit 1; fi
          test -f fabric/run/saves/train-smoke/data/create/tracks.dat
          grep -E 'GATE_D_|GATE_E_|anchor_state=|Starting integrated|Preparing level|Done \(|create 6\.0\.9-1|railways |copycats |Initialized VSCore|Train|train|Hayajiro' ../world-smoke.log | tail -260 || true
          echo 'Verified real train world functional Gate D + Phase 54 telemetry passed.'

      - name: Summarize real-world smoke diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo '## Verified r0v3 real train world smoke + Gate D + Phase 54'
            if [ -f fixture-sha256.txt ]; then echo "Fixture ZIP SHA256: $(cut -d' ' -f1 fixture-sha256.txt)"; fi
            echo 'Phase 54: read-only Contraption.anchor coordinate-frame telemetry; no player/train/physics mutation.'
            if [ -f world-smoke.log ]; then
              echo '```text'
              grep -Ein 'GATE_D_|GATE_E_|anchor_state=|Could not execute entrypoint|Mixin|Exception|Caused by:|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|LinkageError|Minecraft has crashed|Game crashed|ERROR' world-smoke.log | tail -380 || true
              echo '--- tail ---'
              tail -220 world-smoke.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload real-world runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs2-create-real-train-world-smoke-log
          path: |
            world-smoke.log
            world-smoke-thread-dumps.txt
            xvfb.log
          if-no-files-found: warn
